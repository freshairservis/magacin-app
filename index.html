<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3b82f6">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <title>Magacin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #e2e8f0;
            color: #1a1a2a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        #root {
            height: 100vh;
            height: 100dvh;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            box-shadow: 0 0 40px rgba(0,0,0,0.12);
        }

        /* ---------- HEADER ---------- */
        .header {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .hamburger {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #3b82f6;
            padding: 4px;
        }

        .header-title { font-size: 17px; font-weight: 700; color: #3b82f6; }
        .header-sub { font-size: 11px; color: #64748b; }

        /* ---------- DRAWER ---------- */
        .drawer-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200;
        }
        .drawer-overlay.active { display: block; }

        .drawer {
            position: absolute;
            top: 0;
            left: 0;
            width: 280px;
            height: 100%;
            background: #ffffff;
            box-shadow: 2px 0 12px rgba(0,0,0,0.1);
            z-index: 300;
            transform: translateX(-105%);
            transition: transform 0.28s ease;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e2e8f0;
        }
        .drawer.active { transform: translateX(0); }

        .drawer-header {
            padding: 20px 16px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .drawer-title { font-size: 16px; font-weight: 700; color: #3b82f6; }
        .drawer-close { background: none; border: none; font-size: 22px; cursor: pointer; color: #64748b; }

        .drawer-menu { flex: 1; overflow-y: auto; padding: 8px; }

        .drawer-item {
            padding: 13px 16px;
            margin-bottom: 3px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #64748b;
            transition: all 0.15s;
            border-left: 3px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .drawer-item:hover { background: #f1f5f9; color: #3b82f6; }
        .drawer-item.active {
            background: #eff6ff;
            border-left-color: #3b82f6;
            color: #3b82f6;
            font-weight: 600;
        }
        .drawer-badge {
            background: #fee2e2;
            color: #991b1b;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .drawer-footer {
            padding: 12px 16px;
            border-top: 1px solid #e2e8f0;
            font-size: 11px;
            color: #94a3b8;
        }

        /* ---------- CONTENT ---------- */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-bottom: 32px;
            -webkit-overflow-scrolling: touch;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .card-title {
            font-size: 13px;
            font-weight: 700;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ---------- STATS ---------- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .stat-box {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .stat-box.green { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); border-color: #bbf7d0; }
        .stat-box.green .stat-value { color: #15803d; }
        .stat-box.green .stat-label { color: #15803d; }
        .stat-value { font-size: 20px; font-weight: 800; color: #1e40af; line-height: 1.1; }
        .stat-label { font-size: 10px; color: #1e40af; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.3px; opacity: 0.7; }

        .warning-banner {
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 13px;
            color: #991b1b;
            font-size: 13px;
            line-height: 1.5;
            cursor: pointer;
        }

        /* ---------- LISTS ---------- */
        .list-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
        }
        .list-item:last-child { margin-bottom: 0; }
        .list-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .item-title { font-size: 14px; font-weight: 600; color: #1e293b; margin-bottom: 2px; }
        .item-meta { font-size: 12px; color: #64748b; }
        .item-value { font-size: 13px; color: #15803d; font-weight: 600; }
        .item-value.red { color: #b91c1c; }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 24px 12px;
            font-size: 13px;
        }
        .empty-state .big { font-size: 32px; margin-bottom: 8px; }

        /* ---------- TABLE ---------- */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th {
            padding: 9px 8px;
            text-align: left;
            font-weight: 600;
            color: #64748b;
            border-bottom: 1px solid #e2e8f0;
            font-size: 10px;
            text-transform: uppercase;
            background: #f8fafc;
            white-space: nowrap;
        }
        th.num, td.num { text-align: right; }
        td { padding: 9px 8px; border-bottom: 1px solid #f1f5f9; }
        tr:last-child td { border-bottom: none; }
        tfoot td { font-weight: 700; border-top: 2px solid #e2e8f0; background: #f8fafc; }

        /* ---------- BUTTONS ---------- */
        .btn {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            width: 100%;
        }
        .btn:active { transform: scale(0.98); }
        .btn-small { width: auto; padding: 6px 10px; font-size: 12px; border-radius: 8px; }
        .btn-danger { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .btn-ghost {
            background: #f1f5f9;
            color: #475569;
        }
        .btn-success { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
        .btn-row { display: flex; gap: 8px; }
        .btn-row .btn { flex: 1; }
        .icon-btn {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 6px 9px;
            cursor: pointer;
            font-size: 13px;
        }
        .icon-btn.danger { background: #fef2f2; border-color: #fecaca; }

        /* ---------- FORMS ---------- */
        .form-group { margin-bottom: 11px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 5px; }
        input, select, textarea {
            width: 100%;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #1a1a2a;
            padding: 11px;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.15s, box-shadow 0.15s;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .search-input {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
        }

        .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .chip {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 6px 13px;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            white-space: nowrap;
        }
        .chip.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #ffffff;
        }

        .pin-bar {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: #ffffff;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .pin-bar button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            border-radius: 6px;
            padding: 3px 9px;
            cursor: pointer;
            font-size: 12px;
        }

        .update-bar {
            position: absolute;
            top: 62px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #f1f5f9;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 550;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .update-bar button {
            background: #3b82f6;
            border: none;
            color: #fff;
            border-radius: 8px;
            padding: 6px 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ---------- BADGES ---------- */
        .badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-success { background: #dcfce7; color: #15803d; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-warn { background: #fef3c7; color: #92400e; }
        .badge-blue { background: #dbeafe; color: #1e40af; }

        /* ---------- TOAST ---------- */
        #toastWrap {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 600;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: calc(100% - 40px);
            max-width: 360px;
            pointer-events: none;
        }
        .toast {
            background: #1e293b;
            color: #f1f5f9;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            animation: toastIn 0.25s ease;
            text-align: center;
        }
        .toast.success { background: #14532d; color: #bbf7d0; }
        .toast.error { background: #7f1d1d; color: #fecaca; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------- MODAL ---------- */
        .modal-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(15,23,42,0.5);
            z-index: 500;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #ffffff;
            border-radius: 20px 20px 0 0;
            padding: 20px 16px;
            width: 100%;
            max-height: 85%;
            overflow-y: auto;
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { transform: translateY(40px); opacity: 0.5; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root">
        <div class="header">
            <div class="header-left">
                <button class="hamburger" onclick="app.toggleDrawer()">☰</button>
                <div>
                    <div class="header-title" id="headerTitle">📦 Magacin</div>
                    <div class="header-sub" id="headerSub"></div>
                </div>
            </div>
        </div>

        <div id="pinBar"></div>
        <div class="drawer-overlay" id="drawerOverlay" onclick="app.toggleDrawer()"></div>
        <div class="drawer" id="drawer"></div>

        <div class="content" id="content"></div>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal" id="modalBox"></div>
        </div>
        <div id="toastWrap"></div>
    </div>

    <script>
        /* ================= UTILS ================= */
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const fmt = n => (Math.round(n * 100) / 100).toLocaleString('sr-RS');
        const fmtDate = d => new Date(d).toLocaleDateString('sr-RS', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const fmtDateTime = d => fmtDate(d) + ' ' + new Date(d).toLocaleTimeString('sr-RS', { hour: '2-digit', minute: '2-digit' });
        const num = v => {
            const n = parseFloat(String(v).replace(',', '.'));
            return isNaN(n) ? 0 : n;
        };
        const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        /* ================= DATA ================= */
        class DataManager {
            constructor() {
                this.migrate();
            }

            migrate() {
                // normalizuj stare zapise (količina -> kolicina, dodaj minZaliha, status posla)
                const mats = this.get('materijali').map(m => ({
                    kategorija: '', ...m,
                    nabavna: num(m.nabavna), prodajna: num(m.prodajna), minZaliha: m.minZaliha != null ? num(m.minZaliha) : 3
                }));
                const trans = this.get('transakcije').map(t => ({
                    ...t,
                    kolicina: t.kolicina != null ? num(t.kolicina) : num(t['količina'])
                })).map(t => { delete t['količina']; return t; });
                const poslovi = this.get('poslovi').map(p => ({ status: 'aktivan', ...p }));
                this.set('materijali', mats);
                this.set('transakcije', trans);
                this.set('poslovi', poslovi);
            }

            get(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } }
            set(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

            getMaterijali() { return this.get('materijali').sort((a, b) => a.naziv.localeCompare(b.naziv, 'sr')); }
            getTransakcije() { return this.get('transakcije').sort((a, b) => new Date(b.datum) - new Date(a.datum)); }
            getPoslovi() { return this.get('poslovi').sort((a, b) => (a.status === 'aktivan' ? 0 : 1) - (b.status === 'aktivan' ? 0 : 1)); }

            materijal(id) { return this.get('materijali').find(m => m.id === id); }
            posao(id) { return this.get('poslovi').find(p => p.id === id); }

            addMaterijal(data) {
                const m = this.get('materijali');
                m.push({ id: uid(), ...data });
                this.set('materijali', m);
            }
            updateMaterijal(id, data) {
                this.set('materijali', this.get('materijali').map(m => m.id === id ? { ...m, ...data } : m));
            }
            deleteMaterijal(id) {
                this.set('materijali', this.get('materijali').filter(m => m.id !== id));
                this.set('transakcije', this.get('transakcije').filter(t => t.materijal_id !== id));
            }

            addTransakcija(data) {
                const t = this.get('transakcije');
                const mat = this.materijal(data.materijal_id);
                t.push({
                    id: uid(),
                    datum: new Date().toISOString(),
                    // zamrzni cene u trenutku transakcije
                    nabavna: mat ? mat.nabavna : 0,
                    prodajna: mat ? mat.prodajna : 0,
                    ...data
                });
                this.set('transakcije', t);
            }
            deleteTransakcija(id) {
                this.set('transakcije', this.get('transakcije').filter(t => t.id !== id));
            }
            updateTransakcija(id, data) {
                this.set('transakcije', this.get('transakcije').map(t => t.id === id ? { ...t, ...data } : t));
            }
            transakcija(id) { return this.get('transakcije').find(t => t.id === id); }

            // rucne stavke na soping listi
            getSoping() { return this.get('soping'); }
            addSoping(data) {
                const s = this.get('soping');
                s.push({ id: uid(), ...data });
                this.set('soping', s);
            }
            deleteSoping(id) { this.set('soping', this.get('soping').filter(x => x.id !== id)); }

            // kompleti (sabloni materijala)
            getKompleti() { return this.get('kompleti').sort((a, b) => a.naziv.localeCompare(b.naziv, 'sr')); }
            komplet(id) { return this.get('kompleti').find(k => k.id === id); }
            addKomplet(data) {
                const k = this.get('kompleti');
                k.push({ id: uid(), ...data });
                this.set('kompleti', k);
            }
            updateKomplet(id, data) {
                this.set('kompleti', this.get('kompleti').map(k => k.id === id ? { ...k, ...data } : k));
            }
            deleteKomplet(id) { this.set('kompleti', this.get('kompleti').filter(k => k.id !== id)); }

            kategorije() {
                return [...new Set(this.get('materijali').map(m => (m.kategorija || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'sr'));
            }

            nedavniMaterijali(n = 5) {
                const ids = [];
                for (const t of this.getTransakcije()) {
                    if (!ids.includes(t.materijal_id)) ids.push(t.materijal_id);
                    if (ids.length >= n) break;
                }
                return ids.map(id => this.materijal(id)).filter(Boolean);
            }

            addPosao(data) {
                const p = this.get('poslovi');
                const novi = { id: uid(), status: 'aktivan', datum: new Date().toISOString(), ...data };
                p.push(novi);
                this.set('poslovi', p);
                return novi;
            }
            updatePosao(id, data) {
                this.set('poslovi', this.get('poslovi').map(p => p.id === id ? { ...p, ...data } : p));
            }
            deletePosao(id) {
                this.set('poslovi', this.get('poslovi').filter(p => p.id !== id));
                this.set('transakcije', this.get('transakcije').map(t => t.posao_id === id ? { ...t, posao_id: null } : t));
            }

            stanje(materijal_id) {
                return this.get('transakcije').reduce((s, t) =>
                    t.materijal_id === materijal_id ? s + (t.tip === 'ulaz' ? t.kolicina : -t.kolicina) : s, 0);
            }

            getInventura() {
                return this.getMaterijali().map(m => {
                    const stanje = this.stanje(m.id);
                    return { ...m, stanje, vredNabavna: stanje * m.nabavna, vredProdajna: stanje * m.prodajna };
                });
            }

            getNiskaZaliha() {
                return this.getInventura().filter(i => i.stanje <= i.minZaliha);
            }

            // finansije po poslu: izlazi zaduzuju, ulazi sa posao_id su povracaj (razduzuju)
            posaoFinansije(posao_id) {
                const vezane = this.get('transakcije').filter(t => t.posao_id === posao_id);
                let trosak = 0, naplativo = 0;
                const stavke = {};
                vezane.forEach(t => {
                    const mat = this.materijal(t.materijal_id);
                    const nab = t.nabavna != null ? t.nabavna : (mat ? mat.nabavna : 0);
                    const prod = t.prodajna != null ? t.prodajna : (mat ? mat.prodajna : 0);
                    const znak = t.tip === 'izlaz' ? 1 : -1;
                    trosak += znak * t.kolicina * nab;
                    naplativo += znak * t.kolicina * prod;
                    const key = t.materijal_id;
                    if (!stavke[key]) stavke[key] = { materijal_id: key, naziv: mat ? mat.naziv : '(obrisan materijal)', jedinica: mat ? mat.jedinica : '', kolicina: 0, trosak: 0, naplativo: 0 };
                    stavke[key].kolicina += znak * t.kolicina;
                    stavke[key].trosak += znak * t.kolicina * nab;
                    stavke[key].naplativo += znak * t.kolicina * prod;
                });
                const p = this.posao(posao_id);
                const cenaRada = p && p.cenaRada ? num(p.cenaRada) : 0;
                return {
                    trosak, naplativo, cenaRada,
                    ukupnoNaplativo: naplativo + cenaRada,
                    profit: naplativo + cenaRada - trosak,
                    stavke: Object.values(stavke).filter(s => Math.abs(s.kolicina) > 1e-9)
                };
            }

            exportAll() {
                return JSON.stringify({
                    app: 'magacin',
                    verzija: 3,
                    izvezeno: new Date().toISOString(),
                    materijali: this.get('materijali'),
                    transakcije: this.get('transakcije'),
                    poslovi: this.get('poslovi'),
                    kompleti: this.get('kompleti'),
                    soping: this.get('soping')
                }, null, 2);
            }

            importAll(json) {
                const data = JSON.parse(json);
                if (!Array.isArray(data.materijali) || !Array.isArray(data.transakcije) || !Array.isArray(data.poslovi)) {
                    throw new Error('Neispravan format fajla');
                }
                this.set('materijali', data.materijali);
                this.set('transakcije', data.transakcije);
                this.set('poslovi', data.poslovi);
                this.set('kompleti', Array.isArray(data.kompleti) ? data.kompleti : []);
                this.set('soping', Array.isArray(data.soping) ? data.soping : []);
                this.migrate();
            }

            resetAll() {
                ['materijali', 'transakcije', 'poslovi', 'kompleti', 'soping', 'magacin_pin', 'magacin_lastBackup'].forEach(k => localStorage.removeItem(k));
                this.migrate();
            }
        }

        /* ================= APP ================= */
        const PAGES = {
            pocetna:    { naslov: '📦 Magacin',      sub: 'Pregled' },
            ulazi:      { naslov: '📥 Ulazi',        sub: 'Nabavka materijala' },
            izlazi:     { naslov: '📤 Izlazi',       sub: 'Potrošnja na poslu' },
            materijali: { naslov: '🔧 Materijali',   sub: 'Šifarnik artikala' },
            poslovi:    { naslov: '💼 Poslovi',      sub: 'Projekti i troškovi' },
            stanje:     { naslov: '📊 Stanje',       sub: 'Trenutne zalihe' },
            istorija:   { naslov: '🕘 Istorija',     sub: 'Sve transakcije' },
            soping:     { naslov: '🛒 Šoping lista', sub: 'Šta treba kupiti' },
            popis:      { naslov: '📋 Popis',        sub: 'Svođenje stanja magacina' },
            kompleti:   { naslov: '🧰 Kompleti',     sub: 'Šabloni materijala' },
            izvestaji:  { naslov: '📈 Izveštaji',    sub: 'Finansijski pregled' },
            podesavanja:{ naslov: '⚙️ Podešavanja',  sub: 'Podaci i backup' }
        };

        class MagacinApp {
            constructor() {
                this.db = new DataManager();
                this.stranica = 'pocetna';
                this.drawerOpen = false;
                this.filter = '';
                this.korpa = { ulaz: [], izlaz: [] };
                this.popisV = {};
                this.render();
            }

            /* ---------- UI helpers ---------- */
            toast(msg, type = '') {
                const wrap = document.getElementById('toastWrap');
                const el = document.createElement('div');
                el.className = 'toast ' + type;
                el.textContent = msg;
                wrap.appendChild(el);
                setTimeout(() => el.remove(), 2600);
            }

            modal(html) {
                document.getElementById('modalBox').innerHTML = html;
                document.getElementById('modalOverlay').classList.add('active');
            }
            closeModal() {
                document.getElementById('modalOverlay').classList.remove('active');
            }

            confirm(poruka, akcija) {
                this._confirmAkcija = akcija;
                this.modal(`
                    <div class="modal-title">Potvrda</div>
                    <p style="font-size:14px; color:#475569; margin-bottom:18px;">${poruka}</p>
                    <div class="btn-row">
                        <button class="btn btn-ghost" onclick="app.closeModal()">Otkaži</button>
                        <button class="btn btn-danger" onclick="app._confirmAkcija(); app.closeModal();">Potvrdi</button>
                    </div>
                `);
            }

            toggleDrawer() {
                this.drawerOpen = !this.drawerOpen;
                document.getElementById('drawer').classList.toggle('active', this.drawerOpen);
                document.getElementById('drawerOverlay').classList.toggle('active', this.drawerOpen);
            }

            idiNa(stranica) {
                this.stranica = stranica;
                this.filter = '';
                this.istF = null;
                this.katF = '';
                if (this.drawerOpen) this.toggleDrawer();
                this.render();
            }

            /* ---------- RENDER ---------- */
            /* ---------- PIN POSLA ---------- */
            getPin() {
                const id = localStorage.getItem('magacin_pin');
                if (!id) return null;
                const p = this.db.posao(id);
                if (!p || p.status !== 'aktivan') { localStorage.removeItem('magacin_pin'); return null; }
                return p;
            }
            pinuj(id) {
                const trenutni = localStorage.getItem('magacin_pin');
                if (trenutni === id) { localStorage.removeItem('magacin_pin'); this.toast('Posao otkačen', 'success'); }
                else { localStorage.setItem('magacin_pin', id); this.toast('📌 Izlazi sada idu na ovaj posao', 'success'); }
                this.render();
            }

            /* ---------- BRZI TASTERI KOLIČINE ---------- */
            qtyDugmad(inputId) {
                return `<div class="chip-row" style="margin-top:8px;">
                    ${[1, 5, 10].map(n => `<span class="chip" onclick="app.qtyAdd('${inputId}', ${n})">+${n}</span>`).join('')}
                    <span class="chip" onclick="app.qtySet('${inputId}', '')">obriši</span>
                </div>`;
            }
            qtyAdd(id, n) {
                const el = document.getElementById(id);
                el.value = num(el.value) + n;
                el.focus();
            }
            qtySet(id, v) {
                const el = document.getElementById(id);
                el.value = v;
                el.focus();
            }

            render() {
                const p = PAGES[this.stranica];
                document.getElementById('headerTitle').textContent = p.naslov;
                document.getElementById('headerSub').textContent = p.sub;
                const pin = this.getPin();
                document.getElementById('pinBar').innerHTML = pin
                    ? `<div class="pin-bar"><span onclick="app.detaljPosla('${pin.id}')" style="cursor:pointer;">📌 Radiš na: ${esc(pin.naziv)}</span><button onclick="app.pinuj('${pin.id}')">✕ skini</button></div>`
                    : '';
                this.renderDrawer();

                const content = document.getElementById('content');
                content.innerHTML = this['render_' + this.stranica]();
                content.scrollTop = 0;
            }

            renderDrawer() {
                const niska = this.db.getNiskaZaliha().length;
                const item = (id, ikona, tekst, badge) => `
                    <div class="drawer-item ${this.stranica === id ? 'active' : ''}" onclick="app.idiNa('${id}')">
                        <span>${ikona} ${tekst}</span>${badge ? `<span class="drawer-badge">${badge}</span>` : ''}
                    </div>`;
                document.getElementById('drawer').innerHTML = `
                    <div class="drawer-header">
                        <div class="drawer-title">📦 MAGACIN</div>
                        <button class="drawer-close" onclick="app.toggleDrawer()">✕</button>
                    </div>
                    <div class="drawer-menu">
                        ${item('pocetna', '🏠', 'Početna')}
                        ${item('ulazi', '📥', 'Ulazi')}
                        ${item('izlazi', '📤', 'Izlazi')}
                        ${item('stanje', '📊', 'Stanje')}
                        ${item('istorija', '🕘', 'Istorija')}
                        ${item('soping', '🛒', 'Šoping lista', niska || '')}
                        ${item('popis', '📋', 'Popis')}
                        ${item('kompleti', '🧰', 'Kompleti')}
                        ${item('materijali', '🔧', 'Materijali')}
                        ${item('poslovi', '💼', 'Poslovi')}
                        ${item('izvestaji', '📈', 'Izveštaji')}
                        ${item('podesavanja', '⚙️', 'Podešavanja')}
                    </div>
                    <div class="drawer-footer">Podaci se čuvaju na ovom uređaju.<br>Backup: Podešavanja → Izvezi.</div>
                `;
            }

            /* ---------- POČETNA ---------- */
            render_pocetna() {
                const inv = this.db.getInventura();
                const trans = this.db.getTransakcije();
                const niska = this.db.getNiskaZaliha();
                const aktivni = this.db.getPoslovi().filter(p => p.status === 'aktivan');

                const vredNab = inv.reduce((s, i) => s + Math.max(0, i.vredNabavna), 0);
                const vredProd = inv.reduce((s, i) => s + Math.max(0, i.vredProdajna), 0);

                const mesec = new Date().toISOString().slice(0, 7);
                let mesUlaz = 0, mesIzlaz = 0, mesBr = 0;
                trans.forEach(t => {
                    if (t.datum.slice(0, 7) !== mesec) return;
                    mesBr++;
                    const m = this.db.materijal(t.materijal_id);
                    const nab = t.nabavna != null ? t.nabavna : (m ? m.nabavna : 0);
                    const prod = t.prodajna != null ? t.prodajna : (m ? m.prodajna : 0);
                    if (t.tip === 'ulaz') mesUlaz += t.kolicina * nab;
                    else mesIzlaz += t.kolicina * prod;
                });

                const poslednje = trans.slice(0, 6).map(t => {
                    const m = this.db.materijal(t.materijal_id);
                    const p = t.posao_id ? this.db.posao(t.posao_id) : null;
                    return `<div class="list-item">
                        <div class="list-row">
                            <div>
                                <div class="item-title">${t.tip === 'ulaz' ? '📥' : '📤'} ${esc(m ? m.naziv : '(obrisan)')}</div>
                                <div class="item-meta">${fmtDateTime(t.datum)}${p ? ' • ' + esc(p.naziv) : ''}</div>
                            </div>
                            <div class="item-value ${t.tip === 'izlaz' ? 'red' : ''}">${t.tip === 'ulaz' ? '+' : '−'}${fmt(t.kolicina)} ${esc(m ? m.jedinica : '')}</div>
                        </div>
                    </div>`;
                }).join('');

                return `
                    <div class="stats-grid">
                        <div class="stat-box"><div class="stat-value">${fmt(vredNab)}</div><div class="stat-label">Vrednost (nabavna) RSD</div></div>
                        <div class="stat-box green"><div class="stat-value">${fmt(vredProd)}</div><div class="stat-label">Vrednost (prodajna) RSD</div></div>
                        <div class="stat-box"><div class="stat-value">${inv.length}</div><div class="stat-label">Materijala</div></div>
                        <div class="stat-box"><div class="stat-value">${aktivni.length}</div><div class="stat-label">Aktivnih poslova</div></div>
                    </div>

                    ${niska.length ? `<div class="warning-banner" onclick="app.idiNa('soping')">⚠️ <strong>${niska.length} ${niska.length === 1 ? 'materijal je' : 'materijala je'} na niskoj zalihi.</strong><br>Dodirni za šoping listu →</div>` : ''}

                    ${this.backupUpozorenje(trans.length)}

                    <div class="card">
                        <div class="card-title">Brze akcije</div>
                        <div class="btn-row">
                            <button class="btn" onclick="app.idiNa('ulazi')">📥 Novi ulaz</button>
                            <button class="btn btn-success" onclick="app.idiNa('izlazi')">📤 Novi izlaz</button>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">Ovaj mesec <span style="color:#94a3b8; font-weight:400; text-transform:none;">${mesBr} transakcija</span></div>
                        <div class="stats-grid">
                            <div class="stat-box"><div class="stat-value">${fmt(mesUlaz)}</div><div class="stat-label">Nabavljeno RSD</div></div>
                            <div class="stat-box green"><div class="stat-value">${fmt(mesIzlaz)}</div><div class="stat-label">Ugrađeno (prodajna) RSD</div></div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">Poslednje transakcije</div>
                        ${poslednje || '<div class="empty-state"><div class="big">📭</div>Još nema transakcija.<br>Kreni od ulaza materijala.</div>'}
                    </div>
                `;
            }

            backupUpozorenje(brTrans) {
                if (brTrans < 5) return '';
                const zadnji = localStorage.getItem('magacin_lastBackup');
                const dana = zadnji ? Math.floor((Date.now() - new Date(zadnji)) / 86400000) : null;
                if (zadnji && dana < 7) return '';
                return `<div class="warning-banner" style="background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%); border-color:#fde68a; color:#92400e;" onclick="app.idiNa('podesavanja')">
                    💾 ${zadnji ? `Backup je star <strong>${dana} dana</strong>.` : '<strong>Nikad nisi izvezao backup!</strong>'} Podaci žive samo u ovom browseru.<br>Dodirni za izvoz →
                </div>`;
            }

            /* ---------- KORPA UNOS (ULAZ / IZLAZ) ---------- */
            render_ulazi() { return this.renderKorpaStrana('ulaz'); }
            render_izlazi() { return this.renderKorpaStrana('izlaz'); }

            renderKorpaStrana(tip) {
                const mats = this.db.getMaterijali();
                const korpa = this.korpa[tip];
                const poslovi = this.db.getPoslovi().filter(p => p.status === 'aktivan');
                const poslednje = this.db.getTransakcije().filter(t => t.tip === tip).slice(0, 10);
                const danas = new Date().toISOString().slice(0, 10);

                if (!mats.length) return `<div class="card"><div class="empty-state"><div class="big">🔧</div>Prvo dodaj materijale u šifarnik.<br><br><button class="btn btn-small" onclick="app.idiNa('materijali')">Idi na Materijale</button></div></div>`;

                const stavke = korpa.map((s, i) => {
                    const m = this.db.materijal(s.materijal_id);
                    return `<div class="list-item">
                        <div class="list-row">
                            <div>
                                <div class="item-title">${esc(m.naziv)}</div>
                                <div class="item-meta">${fmt(s.kolicina)} ${esc(m.jedinica)}${s.cena ? ' • nova cena: ' + fmt(s.cena) + ' RSD' : ''}</div>
                            </div>
                            <button class="icon-btn danger" onclick="app.korpaUkloni('${tip}', ${i})">🗑</button>
                        </div>
                    </div>`;
                }).join('');

                return `
                    <div class="card">
                        <div class="card-title">${tip === 'ulaz' ? '📥 Novi ulaz (nabavka)' : '📤 Novi izlaz (potrošnja)'} ${korpa.length ? `<span class="badge badge-blue">${korpa.length} ${korpa.length === 1 ? 'stavka' : 'stavke/i'}</span>` : ''}</div>
                        ${stavke || '<div class="empty-state">Korpa je prazna.<br>Dodaj materijale pa sačuvaj sve odjednom.</div>'}
                        <button class="btn btn-ghost" style="margin-top:10px;" onclick="app.otvoriPicker('${tip}')">➕ Dodaj materijal</button>
                        ${korpa.length ? `
                        <div class="form-grid2" style="margin-top:12px;">
                            <div class="form-group">
                                <label class="form-label">Datum</label>
                                <input type="date" id="fDatum" value="${danas}" max="${danas}">
                            </div>
                            ${tip === 'izlaz' ? `
                            <div class="form-group">
                                <label class="form-label">Posao ${this.getPin() ? '📌' : ''}</label>
                                <select id="fPosao">
                                    <option value="">— bez posla —</option>
                                    ${poslovi.map(p => `<option value="${p.id}" ${this.getPin() && this.getPin().id === p.id ? 'selected' : ''}>${esc(p.naziv)}</option>`).join('')}
                                </select>
                            </div>` : '<div></div>'}
                        </div>
                        <div class="form-group">
                            <label class="form-label">Napomena (opciono)</label>
                            <input id="fNapomena" placeholder="npr. servis kod Jovića, uzeo Pera...">
                        </div>
                        <button class="btn ${tip === 'izlaz' ? 'btn-success' : ''}" onclick="app.sacuvajKorpu('${tip}')">Sačuvaj ${korpa.length > 1 ? 'sve stavke' : 'stavku'}</button>
                        ` : ''}
                    </div>

                    <div class="card">
                        <div class="card-title">Poslednji ${tip === 'ulaz' ? 'ulazi' : 'izlazi'}</div>
                        ${poslednje.length ? poslednje.map(t => this.transRed(t)).join('') : '<div class="empty-state">Nema transakcija.</div>'}
                    </div>
                `;
            }

            /* --- picker materijala sa pretragom --- */
            otvoriPicker(tip) {
                this.pickerTip = tip;
                this.pickerF = '';
                this.modal(`
                    <div class="modal-title">Izaberi materijal <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <input class="search-input" id="pickerSearch" placeholder="🔍 Kucaj naziv, šifru ili kategoriju..." autocomplete="off"
                        oninput="app.pickerF=this.value; app.osveziListu('pickerLista', app.pickerLista())">
                    <div id="pickerLista" style="margin-top:10px; max-height:50vh; overflow-y:auto;">${this.pickerLista()}</div>
                `);
                setTimeout(() => { const el = document.getElementById('pickerSearch'); if (el) el.focus(); }, 100);
            }

            pickerLista() {
                const tip = this.pickerTip;
                const f = (this.pickerF || '').toLowerCase();
                let inv = this.db.getInventura();
                if (tip === 'izlaz') inv = inv.filter(i => i.stanje > 0);

                const red = m => `<div class="list-item" style="cursor:pointer;" onclick="app.pickerIzbor('${m.id}')">
                    <div class="list-row">
                        <div>
                            <div class="item-title">${esc(m.naziv)}</div>
                            <div class="item-meta">${m.kategorija ? esc(m.kategorija) + ' • ' : ''}na stanju: ${fmt(m.stanje)} ${esc(m.jedinica)}</div>
                        </div>
                        <span style="color:#3b82f6; font-size:18px;">›</span>
                    </div>
                </div>`;

                if (!f) {
                    const nedavniIds = this.db.nedavniMaterijali(5).map(m => m.id);
                    const nedavni = inv.filter(i => nedavniIds.includes(i.id))
                        .sort((a, b) => nedavniIds.indexOf(a.id) - nedavniIds.indexOf(b.id));
                    const ostali = inv.filter(i => !nedavniIds.includes(i.id));
                    return (nedavni.length ? `<div class="item-meta" style="margin-bottom:6px;">🕘 NEDAVNO KORIŠĆENI</div>${nedavni.map(red).join('')}<div class="item-meta" style="margin:10px 0 6px;">SVI MATERIJALI</div>` : '')
                        + (ostali.length ? ostali.map(red).join('') : (nedavni.length ? '' : '<div class="empty-state">Nema materijala' + (tip === 'izlaz' ? ' na stanju' : '') + '.</div>'));
                }
                const nadjeni = inv.filter(m =>
                    m.naziv.toLowerCase().includes(f) || (m.sku || '').toLowerCase().includes(f) || (m.kategorija || '').toLowerCase().includes(f));
                return nadjeni.length ? nadjeni.map(red).join('') : '<div class="empty-state">Ništa nije nađeno za „' + esc(this.pickerF) + '".</div>';
            }

            pickerIzbor(mid) {
                const tip = this.pickerTip;
                const m = this.db.getInventura().find(i => i.id === mid);
                this.modal(`
                    <div class="modal-title">${esc(m.naziv)} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="item-meta" style="margin-bottom:12px;">Na stanju: <strong>${fmt(m.stanje)} ${esc(m.jedinica)}</strong>${tip === 'ulaz' ? ' • trenutna nab. cena: ' + fmt(m.nabavna) + ' RSD' : ''}</div>
                    <div class="form-group">
                        <label class="form-label">Količina (${esc(m.jedinica)})</label>
                        <input type="number" id="kKol" inputmode="decimal" placeholder="0" min="0" step="any" style="font-size:20px; text-align:center; padding:14px;">
                        ${this.qtyDugmad('kKol')}
                    </div>
                    ${tip === 'ulaz' ? `
                    <div class="form-group">
                        <label class="form-label">Nova nab. cena (opciono)</label>
                        <input type="number" id="kCena" inputmode="decimal" placeholder="ostaje ${fmt(m.nabavna)}" min="0" step="any">
                    </div>` : ''}
                    <button class="btn" onclick="app.korpaDodaj('${mid}')">Dodaj u korpu</button>
                `);
                setTimeout(() => { const el = document.getElementById('kKol'); if (el) el.focus(); }, 100);
            }

            korpaDodaj(mid) {
                const tip = this.pickerTip;
                const kol = num(document.getElementById('kKol').value);
                if (kol <= 0) return this.toast('Unesi ispravnu količinu', 'error');
                if (tip === 'izlaz') {
                    const uKorpi = this.korpa.izlaz.filter(s => s.materijal_id === mid).reduce((s, x) => s + x.kolicina, 0);
                    const stanje = this.db.stanje(mid);
                    if (kol + uKorpi > stanje) {
                        const m = this.db.materijal(mid);
                        return this.toast(`Nema dovoljno — na stanju ${fmt(stanje)} ${m.jedinica}${uKorpi ? ', u korpi već ' + fmt(uKorpi) : ''}`, 'error');
                    }
                }
                const stavka = { materijal_id: mid, kolicina: kol };
                if (tip === 'ulaz') {
                    const cena = num(document.getElementById('kCena').value);
                    if (cena > 0) stavka.cena = cena;
                }
                this.korpa[tip].push(stavka);
                this.closeModal();
                this.render();
            }

            korpaUkloni(tip, i) {
                this.korpa[tip].splice(i, 1);
                this.render();
            }

            sacuvajKorpu(tip) {
                const korpa = this.korpa[tip];
                if (!korpa.length) return;
                const datumStr = document.getElementById('fDatum').value;
                const danas = new Date().toISOString().slice(0, 10);
                const datum = (!datumStr || datumStr === danas) ? new Date().toISOString() : new Date(datumStr + 'T12:00:00').toISOString();
                const posao = tip === 'izlaz' ? (document.getElementById('fPosao').value || null) : null;
                const napomenaEl = document.getElementById('fNapomena');
                const napomena = napomenaEl ? napomenaEl.value.trim() : '';

                const preIds = new Set(this.db.get('transakcije').map(t => t.id));
                korpa.forEach(s => {
                    if (tip === 'ulaz' && s.cena) this.db.updateMaterijal(s.materijal_id, { nabavna: s.cena });
                    const t = { materijal_id: s.materijal_id, tip, kolicina: s.kolicina, posao_id: posao, datum };
                    if (napomena) t.napomena = napomena;
                    this.db.addTransakcija(t);
                });
                this.lastAkcija = this.db.get('transakcije').filter(t => !preIds.has(t.id)).map(t => t.id);
                const br = korpa.length;
                this.korpa[tip] = [];
                this.toastUndo(`${tip === 'ulaz' ? 'Ulaz' : 'Izlaz'} sačuvan — ${br} ${br === 1 ? 'stavka' : 'stavke/i'} ✓`);
                this.render();
            }

            /* ---------- UNDO / PONOVI ---------- */
            toastUndo(msg) {
                const wrap = document.getElementById('toastWrap');
                const el = document.createElement('div');
                el.className = 'toast success';
                el.style.pointerEvents = 'auto';
                el.innerHTML = `${esc(msg)} &nbsp; <button style="background:rgba(255,255,255,0.15); border:none; color:#fff; border-radius:6px; padding:4px 12px; font-weight:700; cursor:pointer;" onclick="app.ponisti(); this.parentElement.remove();">PONIŠTI</button>`;
                wrap.appendChild(el);
                setTimeout(() => el.remove(), 6000);
            }

            ponisti() {
                if (!this.lastAkcija || !this.lastAkcija.length) return;
                this.lastAkcija.forEach(id => this.db.deleteTransakcija(id));
                this.lastAkcija = null;
                this.toast('Poništeno ✓', 'success');
                this.render();
            }

            ponovi(id) {
                const t = this.db.transakcija(id);
                if (!t || !this.db.materijal(t.materijal_id)) return this.toast('Materijal više ne postoji', 'error');
                if (t.tip === 'izlaz') {
                    const uKorpi = this.korpa.izlaz.filter(x => x.materijal_id === t.materijal_id).reduce((a, x) => a + x.kolicina, 0);
                    if (t.kolicina + uKorpi > this.db.stanje(t.materijal_id)) return this.toast('Nema dovoljno na stanju za ponavljanje', 'error');
                }
                const postojeca = this.korpa[t.tip].find(x => x.materijal_id === t.materijal_id);
                if (postojeca) postojeca.kolicina += t.kolicina;
                else this.korpa[t.tip].push({ materijal_id: t.materijal_id, kolicina: t.kolicina });
                this.toast('Ubačeno u korpu ✓', 'success');
                this.idiNa(t.tip === 'ulaz' ? 'ulazi' : 'izlazi');
            }

            transRed(t) {
                const m = this.db.materijal(t.materijal_id);
                const p = t.posao_id ? this.db.posao(t.posao_id) : null;
                return `<div class="list-item">
                    <div class="list-row">
                        <div>
                            <div class="item-title">${esc(m ? m.naziv : '(obrisan)')}</div>
                            <div class="item-meta">${fmtDateTime(t.datum)}${p ? ' • 💼 ' + esc(p.naziv) : ''}${t.napomena ? ' • 📋 ' + esc(t.napomena) : ''}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <div class="item-value ${t.tip === 'izlaz' ? 'red' : ''}">${t.tip === 'ulaz' ? '+' : '−'}${fmt(t.kolicina)} ${esc(m ? m.jedinica : '')}</div>
                            <button class="icon-btn" onclick="app.ponovi('${t.id}')">🔁</button>
                            <button class="icon-btn" onclick="app.formaTrans('${t.id}')">✏️</button>
                            <button class="icon-btn danger" onclick="app.obrisiTrans('${t.id}')">🗑</button>
                        </div>
                    </div>
                </div>`;
            }

            formaTrans(id) {
                const t = this.db.transakcija(id);
                const m = this.db.materijal(t.materijal_id);
                const poslovi = this.db.getPoslovi();
                this.modal(`
                    <div class="modal-title">${t.tip === 'ulaz' ? '📥' : '📤'} ${esc(m ? m.naziv : '(obrisan)')} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="form-grid2">
                        <div class="form-group">
                            <label class="form-label">Količina (${esc(m ? m.jedinica : '')})</label>
                            <input type="number" id="tKol" inputmode="decimal" step="any" min="0" value="${t.kolicina}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Datum</label>
                            <input type="date" id="tDatum" value="${t.datum.slice(0, 10)}">
                        </div>
                    </div>
                    ${t.tip === 'izlaz' ? `
                    <div class="form-group">
                        <label class="form-label">Posao</label>
                        <select id="tPosao">
                            <option value="">— bez posla —</option>
                            ${poslovi.map(p => `<option value="${p.id}" ${t.posao_id === p.id ? 'selected' : ''}>${esc(p.naziv)}</option>`).join('')}
                        </select>
                    </div>` : ''}
                    <div class="form-group">
                        <label class="form-label">Napomena</label>
                        <input id="tNapomena" value="${esc(t.napomena || '')}" placeholder="opciono">
                    </div>
                    <button class="btn" onclick="app.sacuvajTrans('${id}')">Sačuvaj izmene</button>
                `);
            }

            sacuvajTrans(id) {
                const t = this.db.transakcija(id);
                const kol = num(document.getElementById('tKol').value);
                if (kol <= 0) return this.toast('Unesi ispravnu količinu', 'error');
                const datumStr = document.getElementById('tDatum').value;
                if (t.tip === 'izlaz') {
                    // stanje bez ove transakcije + nova kolicina ne sme u minus
                    const stanjeBez = this.db.stanje(t.materijal_id) + t.kolicina;
                    if (kol > stanjeBez) return this.toast(`Nema dovoljno — bez ove stavke na stanju je ${fmt(stanjeBez)}`, 'error');
                }
                const data = { kolicina: kol };
                if (datumStr && datumStr !== t.datum.slice(0, 10)) data.datum = new Date(datumStr + 'T12:00:00').toISOString();
                const posaoEl = document.getElementById('tPosao');
                if (posaoEl) data.posao_id = posaoEl.value || null;
                data.napomena = document.getElementById('tNapomena').value.trim();
                this.db.updateTransakcija(id, data);
                this.toast('Transakcija izmenjena ✓', 'success');
                this.closeModal();
                this.render();
            }

            obrisiTrans(id) {
                this.confirm('Obrisati ovu transakciju? Stanje će se preračunati.', () => {
                    this.db.deleteTransakcija(id);
                    this.toast('Transakcija obrisana', 'success');
                    this.render();
                });
            }

            /* ---------- ISTORIJA ---------- */
            render_istorija() {
                if (!this.istF) this.istF = { tip: '', mat: '', posao: '', od: '', do: '' };
                const f = this.istF;
                const mats = this.db.getMaterijali();
                const poslovi = this.db.get('poslovi');

                let trans = this.db.getTransakcije();
                if (f.tip) trans = trans.filter(t => t.tip === f.tip);
                if (f.mat) trans = trans.filter(t => t.materijal_id === f.mat);
                if (f.posao) trans = trans.filter(t => t.posao_id === f.posao);
                if (f.od) trans = trans.filter(t => t.datum.slice(0, 10) >= f.od);
                if (f.do) trans = trans.filter(t => t.datum.slice(0, 10) <= f.do);

                let vredUlaz = 0, vredIzlaz = 0;
                trans.forEach(t => {
                    const m = this.db.materijal(t.materijal_id);
                    const nab = t.nabavna != null ? t.nabavna : (m ? m.nabavna : 0);
                    if (t.tip === 'ulaz') vredUlaz += t.kolicina * nab;
                    else vredIzlaz += t.kolicina * nab;
                });

                const aktivanFilter = f.tip || f.mat || f.posao || f.od || f.do;

                return `
                    <div class="card">
                        <div class="card-title">Filteri ${aktivanFilter ? `<button class="btn btn-ghost btn-small" onclick="app.istF=null; app.render()">✕ Poništi</button>` : ''}</div>
                        <div class="form-grid2">
                            <div class="form-group">
                                <label class="form-label">Tip</label>
                                <select onchange="app.istF.tip=this.value; app.render()">
                                    <option value="">— svi —</option>
                                    <option value="ulaz" ${f.tip === 'ulaz' ? 'selected' : ''}>📥 Ulazi</option>
                                    <option value="izlaz" ${f.tip === 'izlaz' ? 'selected' : ''}>📤 Izlazi</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Materijal</label>
                                <select onchange="app.istF.mat=this.value; app.render()">
                                    <option value="">— svi —</option>
                                    ${mats.map(m => `<option value="${m.id}" ${f.mat === m.id ? 'selected' : ''}>${esc(m.naziv)}</option>`).join('')}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Posao</label>
                                <select onchange="app.istF.posao=this.value; app.render()">
                                    <option value="">— svi —</option>
                                    ${poslovi.map(p => `<option value="${p.id}" ${f.posao === p.id ? 'selected' : ''}>${esc(p.naziv)}</option>`).join('')}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Od — do</label>
                                <div style="display:flex; gap:6px;">
                                    <input type="date" value="${f.od}" onchange="app.istF.od=this.value; app.render()">
                                    <input type="date" value="${f.do}" onchange="app.istF.do=this.value; app.render()">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-box"><div class="stat-value">${fmt(vredUlaz)}</div><div class="stat-label">Ulazi (nabavna) RSD</div></div>
                        <div class="stat-box green"><div class="stat-value">${fmt(vredIzlaz)}</div><div class="stat-label">Izlazi (nabavna) RSD</div></div>
                    </div>

                    <div class="card">
                        <div class="card-title">Transakcije (${trans.length})</div>
                        ${trans.length ? trans.slice(0, 100).map(t => this.transRed(t)).join('') : '<div class="empty-state"><div class="big">🕘</div>Nema transakcija za izabrane filtere.</div>'}
                        ${trans.length > 100 ? '<div class="empty-state">Prikazano prvih 100 — suzi filtere za ostale.</div>' : ''}
                    </div>
                `;
            }

            /* ---------- MATERIJALI ---------- */
            render_materijali() {
                const kategorije = this.db.kategorije();
                if (!this.katF) this.katF = '';
                return `
                    <button class="btn" onclick="app.formaMaterijal()">➕ Novi materijal</button>
                    <input class="search-input" placeholder="🔍 Pretraži materijale..." value="${esc(this.filter)}"
                        oninput="app.filter=this.value; app.osveziListu('listaMat', app.listaMaterijala())">
                    ${kategorije.length ? `<div class="chip-row">
                        <span class="chip ${!this.katF ? 'active' : ''}" onclick="app.katF=''; app.render()">Sve</span>
                        ${kategorije.map(k => `<span class="chip ${this.katF === k ? 'active' : ''}" onclick="app.katF='${esc(k)}'; app.render()">${esc(k)}</span>`).join('')}
                    </div>` : ''}
                    <div id="listaMat">${this.listaMaterijala()}</div>
                `;
            }

            listaMaterijala() {
                const f = this.filter.toLowerCase();
                let mats = this.db.getInventura().filter(m =>
                    !f || m.naziv.toLowerCase().includes(f) || (m.sku || '').toLowerCase().includes(f) || (m.kategorija || '').toLowerCase().includes(f));
                if (this.katF) mats = mats.filter(m => m.kategorija === this.katF);
                if (!mats.length) return '<div class="card"><div class="empty-state"><div class="big">🔧</div>Nema materijala.</div></div>';
                return `<div class="card">${mats.map(m => `
                    <div class="list-item">
                        <div class="list-row">
                            <div>
                                <div class="item-title">${esc(m.naziv)} ${m.stanje <= m.minZaliha ? '<span class="badge badge-danger">nisko</span>' : ''}</div>
                                <div class="item-meta">${m.kategorija ? '🏷 ' + esc(m.kategorija) + ' • ' : ''}${m.sku ? esc(m.sku) + ' • ' : ''}nab. ${fmt(m.nabavna)} / prod. ${fmt(m.prodajna)} RSD • min: ${fmt(m.minZaliha)}</div>
                                <div class="item-meta">Na stanju: <strong>${fmt(m.stanje)} ${esc(m.jedinica)}</strong></div>
                            </div>
                            <div style="display:flex; gap:6px;">
                                <button class="icon-btn" onclick="app.formaMaterijal('${m.id}')">✏️</button>
                                <button class="icon-btn danger" onclick="app.obrisiMaterijal('${m.id}')">🗑</button>
                            </div>
                        </div>
                    </div>`).join('')}</div>`;
            }

            osveziListu(id, html) {
                document.getElementById(id).innerHTML = html;
            }

            formaMaterijal(id) {
                const m = id ? this.db.materijal(id) : { naziv: '', sku: '', jedinica: 'kom', nabavna: '', prodajna: '', minZaliha: 3, kategorija: '' };
                const kategorije = this.db.kategorije();
                this.modal(`
                    <div class="modal-title">${id ? 'Izmena materijala' : 'Novi materijal'} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="form-group"><label class="form-label">Naziv *</label><input id="mNaziv" value="${esc(m.naziv)}" placeholder="npr. Kabl NYM 3x2.5"></div>
                    <div class="form-grid2">
                        <div class="form-group"><label class="form-label">Šifra (SKU)</label><input id="mSku" value="${esc(m.sku || '')}" placeholder="npr. KBL-2.5"></div>
                        <div class="form-group"><label class="form-label">Jedinica</label>
                            <select id="mJed">${['kom', 'm', 'kg', 'l', 'pak', 'rol'].map(j => `<option ${m.jedinica === j ? 'selected' : ''}>${j}</option>`).join('')}</select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Kategorija</label>
                        <input id="mKat" value="${esc(m.kategorija || '')}" placeholder="npr. Kablovi" list="katList">
                        <datalist id="katList">${kategorije.map(k => `<option value="${esc(k)}">`).join('')}</datalist>
                    </div>
                    <div class="form-grid2">
                        <div class="form-group"><label class="form-label">Nabavna cena (RSD)</label><input id="mNab" type="number" inputmode="decimal" step="any" value="${m.nabavna}"></div>
                        <div class="form-group"><label class="form-label">Prodajna cena (RSD)</label><input id="mProd" type="number" inputmode="decimal" step="any" value="${m.prodajna}"></div>
                    </div>
                    <div class="form-group"><label class="form-label">Minimalna zaliha (za šoping listu)</label><input id="mMin" type="number" inputmode="decimal" step="any" value="${m.minZaliha}"></div>
                    <button class="btn" onclick="app.sacuvajMaterijal('${id || ''}')">Sačuvaj</button>
                `);
            }

            sacuvajMaterijal(id) {
                const data = {
                    naziv: document.getElementById('mNaziv').value.trim(),
                    sku: document.getElementById('mSku').value.trim(),
                    kategorija: document.getElementById('mKat').value.trim(),
                    jedinica: document.getElementById('mJed').value,
                    nabavna: num(document.getElementById('mNab').value),
                    prodajna: num(document.getElementById('mProd').value),
                    minZaliha: num(document.getElementById('mMin').value)
                };
                if (!data.naziv) return this.toast('Naziv je obavezan', 'error');
                if (id) { this.db.updateMaterijal(id, data); this.toast('Materijal izmenjen ✓', 'success'); }
                else { this.db.addMaterijal(data); this.toast('Materijal dodat ✓', 'success'); }
                this.closeModal();
                this.render();
            }

            obrisiMaterijal(id) {
                const m = this.db.materijal(id);
                this.confirm(`Obrisati <strong>${esc(m.naziv)}</strong>?<br>Brišu se i sve njegove transakcije!`, () => {
                    this.db.deleteMaterijal(id);
                    this.toast('Materijal obrisan', 'success');
                    this.render();
                });
            }

            /* ---------- POSLOVI ---------- */
            render_poslovi() {
                const svi = this.db.getPoslovi();
                if (!this.posloviF) this.posloviF = svi.some(p => p.status === 'aktivan') ? 'aktivan' : 'svi';
                const chip = (id, tekst) => `<span class="chip ${this.posloviF === id ? 'active' : ''}" onclick="app.posloviF='${id}'; app.render()">${tekst}</span>`;
                return `
                    <button class="btn" onclick="app.formaPosao()">➕ Novi posao</button>
                    ${svi.length > 3 ? `<input class="search-input" placeholder="🔍 Pretraži poslove..." value="${esc(this.filter)}" oninput="app.filter=this.value; app.osveziListu('listaPoslova', app.listaPoslova())">` : ''}
                    ${svi.length ? `<div class="chip-row">
                        ${chip('aktivan', 'Aktivni (' + svi.filter(p => p.status === 'aktivan').length + ')')}
                        ${chip('zavrsen', 'Završeni (' + svi.filter(p => p.status === 'zavrsen').length + ')')}
                        ${chip('svi', 'Svi')}
                    </div>` : ''}
                    <div id="listaPoslova" style="display:flex; flex-direction:column; gap:14px;">${this.listaPoslova()}</div>
                `;
            }

            listaPoslova() {
                const svi = this.db.getPoslovi();
                const f = this.filter.toLowerCase();
                const poslovi = svi
                    .filter(p => this.posloviF === 'svi' || p.status === this.posloviF)
                    .filter(p => !f || p.naziv.toLowerCase().includes(f) || (p.lokacija || '').toLowerCase().includes(f));
                return `
                    ${poslovi.length ? poslovi.map(p => {
                        const fin = this.db.posaoFinansije(p.id);
                        return `<div class="card">
                            <div class="list-row">
                                <div>
                                    <div class="item-title">💼 ${esc(p.naziv)} <span class="badge ${p.status === 'aktivan' ? 'badge-blue' : 'badge-success'}">${p.status === 'aktivan' ? 'aktivan' : 'završen'}</span></div>
                                    <div class="item-meta">${esc(p.lokacija || '')}${p.datum ? ' • ' + fmtDate(p.datum) : ''}</div>
                                    <div class="item-meta">Materijal: <strong>${fmt(fin.naplativo)}</strong>${fin.cenaRada ? ' • Rad: <strong>' + fmt(fin.cenaRada) + '</strong>' : ''} • Trošak: <strong>${fmt(fin.trosak)}</strong> RSD</div>
                                    <div class="item-value ${fin.profit < 0 ? 'red' : ''}">Profit: ${fmt(fin.profit)} RSD</div>
                                </div>
                            </div>
                            <div class="btn-row" style="margin-top:10px;">
                                ${p.status === 'aktivan' ? `<button class="btn ${this.getPin() && this.getPin().id === p.id ? '' : 'btn-ghost'} btn-small" onclick="app.pinuj('${p.id}')">📌</button>` : ''}
                                <button class="btn btn-ghost btn-small" onclick="app.detaljPosla('${p.id}')">📋 Detalji</button>
                                <button class="btn btn-ghost btn-small" onclick="app.specifikacija('${p.id}')">🖨</button>
                                <button class="btn btn-ghost btn-small" onclick="app.formaPosao('${p.id}')">✏️</button>
                                <button class="btn btn-ghost btn-small" onclick="app.togglePosao('${p.id}')">${p.status === 'aktivan' ? '✅ Završi' : '↩️'}</button>
                                <button class="btn btn-danger btn-small" onclick="app.obrisiPosao('${p.id}')">🗑</button>
                            </div>
                        </div>`;
                    }).join('') : '<div class="card"><div class="empty-state"><div class="big">💼</div>Nema poslova.<br>Dodaj posao pa vezuj izlaze materijala za njega.</div></div>'}
                `;
            }

            formaPosao(id) {
                const p = id ? this.db.posao(id) : { naziv: '', lokacija: '', napomena: '', cenaRada: '' };
                this.modal(`
                    <div class="modal-title">${id ? 'Izmena posla' : 'Novi posao'} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="form-group"><label class="form-label">Naziv *</label><input id="pNaziv" value="${esc(p.naziv)}" placeholder="npr. Stan 5B — elektroinstalacije"></div>
                    <div class="form-group"><label class="form-label">Lokacija</label><input id="pLok" value="${esc(p.lokacija || '')}" placeholder="npr. Novi Sad, Bulevar 12"></div>
                    <div class="form-group"><label class="form-label">Cena rada (RSD)</label><input id="pRad" type="number" inputmode="decimal" step="any" value="${p.cenaRada || ''}" placeholder="0"></div>
                    <div class="form-group"><label class="form-label">Napomena</label><textarea id="pNap" rows="2" placeholder="npr. dogovoreno sa investitorom...">${esc(p.napomena || '')}</textarea></div>
                    <button class="btn" onclick="app.sacuvajPosao('${id || ''}')">Sačuvaj</button>
                `);
            }

            sacuvajPosao(id) {
                const data = {
                    naziv: document.getElementById('pNaziv').value.trim(),
                    lokacija: document.getElementById('pLok').value.trim(),
                    cenaRada: num(document.getElementById('pRad').value),
                    napomena: document.getElementById('pNap').value.trim()
                };
                if (!data.naziv) return this.toast('Naziv je obavezan', 'error');
                if (id) { this.db.updatePosao(id, data); this.toast('Posao izmenjen ✓', 'success'); }
                else { this.db.addPosao(data); this.toast('Posao kreiran ✓', 'success'); }
                this.closeModal();
                this.render();
            }

            togglePosao(id) {
                const p = this.db.posao(id);
                this.db.updatePosao(id, { status: p.status === 'aktivan' ? 'zavrsen' : 'aktivan' });
                this.render();
            }

            obrisiPosao(id) {
                const p = this.db.posao(id);
                this.confirm(`Obrisati posao <strong>${esc(p.naziv)}</strong>?<br>Transakcije ostaju, samo se odvezuju od posla.`, () => {
                    this.db.deletePosao(id);
                    this.toast('Posao obrisan', 'success');
                    this.render();
                });
            }

            detaljPosla(id) {
                const p = this.db.posao(id);
                const fin = this.db.posaoFinansije(id);
                this.modal(`
                    <div class="modal-title">💼 ${esc(p.naziv)} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    ${p.napomena ? `<p style="font-size:13px; color:#64748b; margin-bottom:12px;">📝 ${esc(p.napomena)}</p>` : ''}
                    ${fin.stavke.length ? `
                    <div class="table-wrap"><table>
                        <thead><tr><th>Materijal</th><th class="num">Kol.</th><th class="num">Trošak</th><th class="num">Naplativo</th><th></th></tr></thead>
                        <tbody>${fin.stavke.map(s => `<tr><td>${esc(s.naziv)}</td><td class="num">${fmt(s.kolicina)} ${esc(s.jedinica)}</td><td class="num">${fmt(s.trosak)}</td><td class="num">${fmt(s.naplativo)}</td><td class="num">${s.materijal_id && this.db.materijal(s.materijal_id) ? `<button class="icon-btn" title="Vrati u magacin" onclick="app.formaPovracaj('${id}', '${s.materijal_id}')">↩️</button>` : ''}</td></tr>`).join('')}</tbody>
                        <tfoot>
                            ${fin.cenaRada ? `<tr><td>Cena rada</td><td></td><td class="num">—</td><td class="num">${fmt(fin.cenaRada)}</td><td></td></tr>` : ''}
                            <tr><td>UKUPNO</td><td></td><td class="num">${fmt(fin.trosak)}</td><td class="num">${fmt(fin.ukupnoNaplativo)}</td><td></td></tr>
                        </tfoot>
                    </table></div>
                    <p style="margin-top:12px; font-size:14px; font-weight:700; color:${fin.profit >= 0 ? '#15803d' : '#b91c1c'};">Profit (materijal + rad): ${fmt(fin.profit)} RSD</p>
                    ` : (fin.cenaRada ? `<p style="font-size:14px; font-weight:700; color:#15803d;">Cena rada: ${fmt(fin.cenaRada)} RSD</p><div class="empty-state">Još nema utrošenog materijala.</div>` : '<div class="empty-state">Još nema utrošenog materijala na ovom poslu.<br>Kod izlaza izaberi ovaj posao.</div>')}
                `);
            }

            specifikacija(id) {
                const p = this.db.posao(id);
                const fin = this.db.posaoFinansije(id);
                if (!fin.stavke.length && !fin.cenaRada) return this.toast('Posao još nema ni materijal ni cenu rada', 'error');

                const w = window.open('', '_blank');
                if (!w) return this.toast('Browser je blokirao novi prozor', 'error');
                w.document.write(`<!DOCTYPE html><html lang="sr"><head><meta charset="UTF-8"><title>Specifikacija — ${esc(p.naziv)}</title>
                    <style>
                        body { font-family: -apple-system, 'Segoe UI', sans-serif; color: #1e293b; max-width: 700px; margin: 30px auto; padding: 0 20px; }
                        h1 { font-size: 22px; margin-bottom: 4px; }
                        .meta { color: #64748b; font-size: 13px; margin-bottom: 24px; }
                        table { width: 100%; border-collapse: collapse; font-size: 13px; }
                        th { text-align: left; border-bottom: 2px solid #1e293b; padding: 8px 6px; font-size: 11px; text-transform: uppercase; }
                        td { padding: 8px 6px; border-bottom: 1px solid #e2e8f0; }
                        .num { text-align: right; }
                        tfoot td { font-weight: 700; border-top: 2px solid #1e293b; border-bottom: none; font-size: 15px; }
                        .footer { margin-top: 40px; color: #94a3b8; font-size: 11px; }
                        @media print { .no-print { display: none; } body { margin: 0 auto; } }
                    </style></head><body>
                    <h1>Specifikacija radova i materijala</h1>
                    <div class="meta"><strong>${esc(p.naziv)}</strong>${p.lokacija ? ' • ' + esc(p.lokacija) : ''}<br>Datum: ${fmtDate(new Date())}</div>
                    <table>
                        <thead><tr><th>Stavka</th><th class="num">Količina</th><th class="num">Cena (RSD)</th><th class="num">Iznos (RSD)</th></tr></thead>
                        <tbody>
                            ${fin.stavke.map(s => `<tr><td>${esc(s.naziv)}</td><td class="num">${fmt(s.kolicina)} ${esc(s.jedinica)}</td><td class="num">${s.kolicina ? fmt(s.naplativo / s.kolicina) : '—'}</td><td class="num">${fmt(s.naplativo)}</td></tr>`).join('')}
                            ${fin.cenaRada ? `<tr><td>Radovi</td><td class="num">—</td><td class="num">—</td><td class="num">${fmt(fin.cenaRada)}</td></tr>` : ''}
                        </tbody>
                        <tfoot><tr><td colspan="3">UKUPNO ZA NAPLATU</td><td class="num">${fmt(fin.ukupnoNaplativo)} RSD</td></tr></tfoot>
                    </table>
                    <div class="footer">Generisano iz aplikacije Magacin • ${fmtDateTime(new Date())}</div>
                    <button class="no-print" style="margin-top:20px; padding:10px 20px; font-size:14px; cursor:pointer;" onclick="window.print()">🖨 Štampaj / Sačuvaj kao PDF</button>
                    </body></html>`);
                w.document.close();
            }

            formaPovracaj(posaoId, mid) {
                const fin = this.db.posaoFinansije(posaoId);
                const s = fin.stavke.find(x => x.materijal_id === mid);
                const m = this.db.materijal(mid);
                if (!s || s.kolicina <= 0) return this.toast('Nema šta da se vrati', 'error');
                this.modal(`
                    <div class="modal-title">↩️ Povraćaj: ${esc(m.naziv)} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="item-meta" style="margin-bottom:12px;">Na poslu je utrošeno <strong>${fmt(s.kolicina)} ${esc(m.jedinica)}</strong>. Koliko vraćaš u magacin?</div>
                    <div class="form-group">
                        <input type="number" id="pvKol" inputmode="decimal" step="any" min="0" max="${s.kolicina}" placeholder="0" style="font-size:20px; text-align:center; padding:14px;">
                        ${this.qtyDugmad('pvKol')}
                    </div>
                    <button class="btn" onclick="app.sacuvajPovracaj('${posaoId}', '${mid}')">Vrati u magacin</button>
                `);
            }

            sacuvajPovracaj(posaoId, mid) {
                const kol = num(document.getElementById('pvKol').value);
                const fin = this.db.posaoFinansije(posaoId);
                const s = fin.stavke.find(x => x.materijal_id === mid);
                if (kol <= 0) return this.toast('Unesi količinu', 'error');
