                });

                const aktivanFilter = f.tip || f.mat || f.posao || f.od || f.do;

                return `
                    <div class="card">
                        <div class="card-title">Filteri ${aktivanFilter ? `<button class="btn btn-ghost btn-small" onclick="app.istF=null; app.render()">✕ Poništi</button>` : ''}</div>
                        <div class="form-grid2">
                            <div class="form-group">
                                <label class="form-label">Tip</label>
                                <select onchange="app.istF.tip=this.value; app.render()">
                                    <option value="">— svi —</option>
                                    <option value="ulaz" ${f.tip === 'ulaz' ? 'selected' : ''}>📥 Ulazi</option>
                                    <option value="izlaz" ${f.tip === 'izlaz' ? 'selected' : ''}>📤 Izlazi</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Materijal</label>
                                <select onchange="app.istF.mat=this.value; app.render()">
                                    <option value="">— svi —</option>
                                    ${mats.map(m => `<option value="${m.id}" ${f.mat === m.id ? 'selected' : ''}>${esc(m.naziv)}</option>`).join('')}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Posao</label>
                                <select onchange="app.istF.posao=this.value; app.render()">
                                    <option value="">— svi —</option>
                                    ${poslovi.map(p => `<option value="${p.id}" ${f.posao === p.id ? 'selected' : ''}>${esc(p.naziv)}</option>`).join('')}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Od — do</label>
                                <div style="display:flex; gap:6px;">
                                    <input type="date" value="${f.od}" onchange="app.istF.od=this.value; app.render()">
                                    <input type="date" value="${f.do}" onchange="app.istF.do=this.value; app.render()">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-box"><div class="stat-value">${fmt(vredUlaz)}</div><div class="stat-label">Ulazi (nabavna) RSD</div></div>
                        <div class="stat-box green"><div class="stat-value">${fmt(vredIzlaz)}</div><div class="stat-label">Izlazi (nabavna) RSD</div></div>
                    </div>

                    ${this.dnevnik(trans.slice(0, 150))}
                    ${trans.length > 150 ? '<div class="card"><div class="empty-state">Prikazano poslednjih 150 — suzi filtere za starije.</div></div>' : ''}
                `;
            }

            dnevnik(trans) {
                if (!trans.length) return '<div class="card"><div class="empty-state"><div class="big">🕘</div>Nema transakcija za izabrane filtere.</div></div>';
                const dani = {};
                trans.forEach(t => {
                    const d = t.datum.slice(0, 10);
                    if (!dani[d]) dani[d] = [];
                    dani[d].push(t);
                });
                const imenaDana = ['nedelja', 'ponedeljak', 'utorak', 'sreda', 'četvrtak', 'petak', 'subota'];
                const danas = new Date().toISOString().slice(0, 10);
                const juce = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
                return Object.keys(dani).sort().reverse().map(d => {
                    const ts = dani[d];
                    let ulazNab = 0, izlazProd = 0;
                    const posloviDana = new Set();
                    ts.forEach(t => {
                        const m = this.db.materijal(t.materijal_id);
                        const nab = t.nabavna != null ? t.nabavna : (m ? m.nabavna : 0);
                        const prod = t.prodajna != null ? t.prodajna : (m ? m.prodajna : 0);
                        if (t.tip === 'ulaz') ulazNab += t.kolicina * nab;
                        else izlazProd += t.kolicina * prod;
                        if (t.posao_id) { const p = this.db.posao(t.posao_id); if (p) posloviDana.add(p.naziv); }
                    });
                    const dat = new Date(d + 'T12:00:00');
                    const oznaka = d === danas ? 'DANAS' : (d === juce ? 'JUČE' : imenaDana[dat.getDay()]);
                    return `<div class="card">
                        <div class="card-title">${oznaka} — ${fmtDate(dat)}
                            <span style="text-transform:none; font-weight:600; color:#64748b;">${izlazProd ? '📤 ' + fmt(izlazProd) : ''}${izlazProd && ulazNab ? ' • ' : ''}${ulazNab ? '📥 ' + fmt(ulazNab) : ''} RSD</span>
                        </div>
                        ${posloviDana.size ? `<div class="item-meta" style="margin-bottom:8px;">💼 ${[...posloviDana].map(esc).join(' • ')}</div>` : ''}
                        ${ts.map(t => this.transRed(t)).join('')}
                    </div>`;
                }).join('');
            }

            /* ---------- MATERIJALI ---------- */
            render_materijali() {
                const kategorije = this.db.kategorije();
                if (!this.katF) this.katF = '';
                const brArhiviranih = this.db.get('materijali').filter(m => m.arhiviran).length;
                return `
                    <div class="btn-row">
                        <button class="btn" onclick="app.formaMaterijal()">➕ Novi</button>
                        <button class="btn btn-ghost" onclick="app.predloziMinimume()">🎯 Minimumi</button>
                        <button class="btn btn-ghost" onclick="app.srediMarze()">🛡 Marže</button>
                    </div>
                    ${brArhiviranih || this.arhivaView ? `<div class="item-meta" style="cursor:pointer;" onclick="app.arhivaView=!app.arhivaView; app.render()">${this.arhivaView ? '← Nazad na aktivne artikle' : `🗄 Arhiva (${brArhiviranih}) →`}</div>` : ''}
                    <input class="search-input" placeholder="🔍 Pretraži materijale..." value="${esc(this.filter)}"
                        oninput="app.filter=this.value; app.osveziListu('listaMat', app.listaMaterijala())">
                    ${kategorije.length ? `<div class="chip-row">
                        <span class="chip ${!this.katF ? 'active' : ''}" onclick="app.katF=''; app.render()">Sve</span>
                        ${kategorije.map(k => `<span class="chip ${this.katF === k ? 'active' : ''}" onclick="app.katF='${esc(k)}'; app.render()">${esc(k)}</span>`).join('')}
                    </div>` : ''}
                    <div id="listaMat">${this.listaMaterijala()}</div>
                `;
            }

            listaMaterijala() {
                const f = this.filter.toLowerCase();
                let mats = this.db.getInventura(true)
                    .filter(m => this.arhivaView ? m.arhiviran : !m.arhiviran)
                    .filter(m => !f || m.naziv.toLowerCase().includes(f) || (m.sku || '').toLowerCase().includes(f) || (m.kategorija || '').toLowerCase().includes(f));
                if (this.katF) mats = mats.filter(m => m.kategorija === this.katF);
                if (!mats.length) return `<div class="card"><div class="empty-state"><div class="big">${this.arhivaView ? '🗄' : '🔧'}</div>${this.arhivaView ? 'Arhiva je prazna.' : 'Nema materijala.'}</div></div>`;
                return `<div class="card">${mats.map(m => `
                    <div class="list-item">
                        <div class="list-row">
                            <div>
                                <div class="item-title">${esc(m.naziv)} ${m.stanje <= m.minZaliha ? '<span class="badge badge-danger">nisko</span>' : ''}</div>
                                <div class="item-meta">${m.kategorija ? '🏷 ' + esc(m.kategorija) + ' • ' : ''}${m.sku ? esc(m.sku) + ' • ' : ''}nab. ${fmt(m.nabavna)} / prod. ${fmt(m.prodajna)} RSD • min: ${fmt(m.minZaliha)}</div>
                                <div class="item-meta">Na stanju: <strong>${fmt(m.stanje)} ${esc(m.jedinica)}</strong>${m.lokacija ? ' • 📍 ' + esc(m.lokacija) : ''}</div>
                            </div>
                            <div style="display:flex; gap:6px;">
                                ${m.arhiviran ? `<button class="icon-btn" onclick="app.vratiIzArhive('${m.id}')">♻️</button>` : `
                                <button class="icon-btn" onclick="app.istorijaNabavki('${m.id}')">📉</button>
                                <button class="icon-btn" onclick="app.formaMaterijal('${m.id}')">✏️</button>
                                <button class="icon-btn" onclick="app.arhiviraj('${m.id}')">🗄</button>`}
                                <button class="icon-btn danger" onclick="app.obrisiMaterijal('${m.id}')">🗑</button>
                            </div>
                        </div>
                    </div>`).join('')}</div>`;
            }

            osveziListu(id, html) {
                document.getElementById(id).innerHTML = html;
            }

            formaMaterijal(id) {
                const m = id ? this.db.materijal(id) : { naziv: '', sku: '', jedinica: 'kom', nabavna: '', prodajna: '', minZaliha: 3, kategorija: '' };
                const kategorije = this.db.kategorije();
                this.modal(`
                    <div class="modal-title">${id ? 'Izmena materijala' : 'Novi materijal'} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="form-group"><label class="form-label">Naziv *</label><input id="mNaziv" value="${esc(m.naziv)}" placeholder="npr. Kabl NYM 3x2.5"></div>
                    <div class="form-grid2">
                        <div class="form-group"><label class="form-label">Šifra (SKU)</label><input id="mSku" value="${esc(m.sku || '')}" placeholder="npr. KBL-2.5"></div>
                        <div class="form-group"><label class="form-label">Jedinica</label>
                            <select id="mJed">${['kom', 'm', 'kg', 'l', 'pak', 'rol'].map(j => `<option ${m.jedinica === j ? 'selected' : ''}>${j}</option>`).join('')}</select>
                        </div>
                    </div>
                    <div class="form-grid2">
                        <div class="form-group">
                            <label class="form-label">Kategorija</label>
                            <input id="mKat" value="${esc(m.kategorija || '')}" placeholder="npr. Kablovi" list="katList">
                            <datalist id="katList">${kategorije.map(k => `<option value="${esc(k)}">`).join('')}</datalist>
                        </div>
                        <div class="form-group">
                            <label class="form-label">📍 Lokacija (gde stoji)</label>
                            <input id="mLok" value="${esc(m.lokacija || '')}" placeholder="npr. kombi — fioka 3" list="lokList">
                            <datalist id="lokList">${this.db.lokacije().map(l => `<option value="${esc(l)}">`).join('')}</datalist>
                        </div>
                    </div>
                    <div class="form-grid2">
                        <div class="form-group"><label class="form-label">Nabavna cena (RSD)</label><input id="mNab" type="number" inputmode="decimal" step="any" value="${m.nabavna}"></div>
                        <div class="form-group"><label class="form-label">Prodajna cena (RSD)</label><input id="mProd" type="number" inputmode="decimal" step="any" value="${m.prodajna}"></div>
                    </div>
                    <div class="form-grid2">
                        <div class="form-group"><label class="form-label">Minimalna zaliha</label><input id="mMin" type="number" inputmode="decimal" step="any" value="${m.minZaliha}"></div>
                        <div class="form-group"><label class="form-label">Pakovanje (npr. rolna 100)</label><input id="mPak" type="number" inputmode="decimal" step="any" value="${m.pakovanje || ''}" placeholder="kupuje se po 1"></div>
                    </div>
                    <div class="form-group"><label class="form-label">Ciljna marža % (čuvar marže)</label><input id="mMarza" type="number" inputmode="decimal" step="any" value="${m.marza || ''}" placeholder="npr. 40 — prazno = bez čuvara"></div>
                    <button class="btn" onclick="app.sacuvajMaterijal('${id || ''}')">Sačuvaj</button>
                `);
            }

            sacuvajMaterijal(id) {
                const data = {
                    naziv: document.getElementById('mNaziv').value.trim(),
                    sku: document.getElementById('mSku').value.trim(),
                    kategorija: document.getElementById('mKat').value.trim(),
                    lokacija: document.getElementById('mLok').value.trim(),
                    jedinica: document.getElementById('mJed').value,
                    nabavna: num(document.getElementById('mNab').value),
                    prodajna: num(document.getElementById('mProd').value),
                    minZaliha: num(document.getElementById('mMin').value),
                    pakovanje: num(document.getElementById('mPak').value) || null,
                    marza: num(document.getElementById('mMarza').value) || null
                };
                if (!data.naziv) return this.toast('Naziv je obavezan', 'error');
                if (id) { this.db.updateMaterijal(id, data); this.toast('Materijal izmenjen ✓', 'success'); }
                else { this.db.addMaterijal(data); this.toast('Materijal dodat ✓', 'success'); }
                this.closeModal();
                this.render();
            }

            predloziMinimume() {
                const predlozi = this.db.getInventura()
                    .map(i => {
                        const mes = this.potrosnjaMesecno(i.id);
                        return { i, mes, predlog: Math.max(1, Math.ceil(mes / 2)) };
                    })
                    .filter(x => x.mes > 0 && x.predlog !== x.i.minZaliha);
                if (!predlozi.length) return this.toast('Nema šta da se menja — minimumi odgovaraju potrošnji ✓', 'success');
                this._minPredlozi = predlozi;
                this.modal(`
                    <div class="modal-title">🎯 Predlog minimalnih zaliha <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <p style="font-size:12px; color:#64748b; margin-bottom:12px;">Na osnovu tvoje stvarne potrošnje (poslednjih ~60 dana). Predlog = pola mesečne potrošnje.</p>
                    <div class="table-wrap"><table>
                        <thead><tr><th>Materijal</th><th class="num">Troši se /mes</th><th class="num">Min sad</th><th class="num">Predlog</th></tr></thead>
                        <tbody>${predlozi.map(x => `<tr>
                            <td>${esc(x.i.naziv)}</td>
                            <td class="num">${fmt(Math.round(x.mes * 10) / 10)}</td>
                            <td class="num">${fmt(x.i.minZaliha)}</td>
                            <td class="num" style="font-weight:700; color:#1e40af;">${fmt(x.predlog)}</td>
                        </tr>`).join('')}</tbody>
                    </table></div>
                    <div class="btn-row" style="margin-top:14px;">
                        <button class="btn btn-ghost" onclick="app.closeModal()">Otkaži</button>
                        <button class="btn" onclick="app.primeniMinimume()">✓ Primeni sve</button>
                    </div>
                `);
            }

            primeniMinimume() {
                this._minPredlozi.forEach(x => this.db.updateMaterijal(x.i.id, { minZaliha: x.predlog }));
                this.toast(`Minimumi ažurirani za ${this._minPredlozi.length} materijala ✓`, 'success');
                this._minPredlozi = null;
                this.closeModal();
                this.render();
            }

            srediMarze() {
                const losi = this.db.ispodMarze().map(m => ({
                    m,
                    marzaSad: (m.prodajna - m.nabavna) / m.nabavna * 100,
                    predlog: Math.ceil(m.nabavna * (1 + m.marza / 100))
                }));
                if (!losi.length) return this.toast('Sve marže su na cilju ✓', 'success');
                this._marzePredlozi = losi;
                this.modal(`
                    <div class="modal-title">🛡 Čuvar marže <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <p style="font-size:12px; color:#64748b; margin-bottom:12px;">Nabavne cene su porasle, prodajne kaskaju. Predlog = nabavna + ciljna marža (zaokruženo naviše).</p>
                    <div class="table-wrap"><table>
                        <thead><tr><th>Materijal</th><th class="num">Marža sad</th><th class="num">Cilj</th><th class="num">Prod. sad</th><th class="num">Predlog</th></tr></thead>
                        <tbody>${losi.map(x => `<tr>
                            <td>${esc(x.m.naziv)}</td>
                            <td class="num" style="color:#b91c1c; font-weight:700;">${fmt(Math.round(x.marzaSad))}%</td>
                            <td class="num">${fmt(x.m.marza)}%</td>
                            <td class="num">${fmt(x.m.prodajna)}</td>
                            <td class="num" style="font-weight:700; color:#15803d;">${fmt(x.predlog)}</td>
                        </tr>`).join('')}</tbody>
                    </table></div>
                    <div class="btn-row" style="margin-top:14px;">
                        <button class="btn btn-ghost" onclick="app.closeModal()">Otkaži</button>
                        <button class="btn" onclick="app.primeniMarze()">✓ Primeni sve</button>
                    </div>
                `);
            }

            primeniMarze() {
                this._marzePredlozi.forEach(x => this.db.updateMaterijal(x.m.id, { prodajna: x.predlog }));
                this.toast(`Prodajne cene ažurirane za ${this._marzePredlozi.length} artikala ✓`, 'success');
                this._marzePredlozi = null;
                this.closeModal();
                this.render();
            }

            istorijaNabavki(mid) {
                const m = this.db.materijal(mid);
                const nabavke = this.db.nabavkeMaterijala(mid);
                const saCenom = nabavke.filter(t => t.nabavna > 0);
                const najjeftinija = saCenom.length ? Math.min(...saCenom.map(t => t.nabavna)) : null;
                this.modal(`
                    <div class="modal-title">📉 Nabavke: ${esc(m.naziv)} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    ${nabavke.length ? `<div class="table-wrap"><table>
                        <thead><tr><th>Datum</th><th class="num">Kol.</th><th class="num">Cena</th><th>Radnja</th></tr></thead>
                        <tbody>${nabavke.map(t => `<tr>
                            <td>${fmtDate(t.datum)}</td>
                            <td class="num">${fmt(t.kolicina)}</td>
                            <td class="num" style="${najjeftinija && t.nabavna === najjeftinija ? 'color:#15803d; font-weight:700;' : ''}">${t.nabavna > 0 ? fmt(t.nabavna) : '—'}${najjeftinija && t.nabavna === najjeftinija ? ' ⭐' : ''}</td>
                            <td>${esc(t.dobavljac || '—')}</td>
                        </tr>`).join('')}</tbody>
                    </table></div>
                    <p style="font-size:11px; color:#94a3b8; margin-top:10px;">⭐ = najjeftinija nabavka. Trenutna nabavna: ${fmt(m.nabavna)} RSD.</p>
                    ` : '<div class="empty-state">Još nema zabeleženih nabavki.</div>'}
                `);
            }

            arhiviraj(id) {
                const m = this.db.materijal(id);
                const stanje = this.db.stanje(id);
                this.confirm(`Arhivirati <strong>${esc(m.naziv)}</strong>?${stanje > 0 ? `<br>⚠️ Na stanju ima još ${fmt(stanje)} ${esc(m.jedinica)} — nestaće iz pregleda dok ga ne vratiš.` : '<br>Nestaje iz pickera, stanja i šoping liste — istorija ostaje.'}`, () => {
                    this.db.updateMaterijal(id, { arhiviran: true });
                    this.toast('Arhivirano 🗄', 'success');
                    this.render();
                });
            }

            vratiIzArhive(id) {
                this.db.updateMaterijal(id, { arhiviran: false });
                this.toast('Vraćeno iz arhive ♻️', 'success');
                this.render();
            }

            obrisiMaterijal(id) {
                const m = this.db.materijal(id);
                this.confirm(`Obrisati <strong>${esc(m.naziv)}</strong>?<br>Brišu se i sve njegove transakcije!`, () => {
                    this.db.deleteMaterijal(id);
                    this.toast('Materijal obrisan', 'success');
                    this.render();
                });
            }

            /* ---------- POSLOVI ---------- */
            render_poslovi() {
                const svi = this.db.getPoslovi();
                if (!this.posloviF) this.posloviF = svi.some(p => p.status === 'aktivan') ? 'aktivan' : 'svi';
                const chip = (id, tekst) => `<span class="chip ${this.posloviF === id ? 'active' : ''}" onclick="app.posloviF='${id}'; app.render()">${tekst}</span>`;
                return `
                    <button class="btn" onclick="app.formaPosao()">➕ Novi posao</button>
                    ${svi.length > 3 ? `<input class="search-input" placeholder="🔍 Pretraži poslove..." value="${esc(this.filter)}" oninput="app.filter=this.value; app.osveziListu('listaPoslova', app.listaPoslova())">` : ''}
                    ${svi.length ? `<div class="chip-row">
                        ${chip('aktivan', 'Aktivni (' + svi.filter(p => p.status === 'aktivan').length + ')')}
                        ${chip('zavrsen', 'Završeni (' + svi.filter(p => p.status === 'zavrsen').length + ')')}
                        ${chip('svi', 'Svi')}
                    </div>` : ''}
                    <div id="listaPoslova" style="display:flex; flex-direction:column; gap:14px;">${this.listaPoslova()}</div>
                `;
            }

            listaPoslova() {
                const svi = this.db.getPoslovi();
                const f = this.filter.toLowerCase();
                const poslovi = svi
                    .filter(p => this.posloviF === 'svi' || p.status === this.posloviF)
                    .filter(p => !f || p.naziv.toLowerCase().includes(f) || (p.lokacija || '').toLowerCase().includes(f));
                return `
                    ${poslovi.length ? poslovi.map(p => {
                        const fin = this.db.posaoFinansije(p.id);
                        return `<div class="card">
                            <div class="list-row">
                                <div>
                                    <div class="item-title">💼 ${esc(p.naziv)} <span class="badge ${p.status === 'aktivan' ? 'badge-blue' : 'badge-success'}">${p.status === 'aktivan' ? 'aktivan' : 'završen'}</span>${(p.zaPoneti || []).filter(z => !z.done).length ? ` <span class="badge badge-warn">🎒 ${(p.zaPoneti || []).filter(z => !z.done).length}</span>` : ''}</div>
                                    <div class="item-meta">${esc(p.lokacija || '')}${p.datum ? ' • ' + fmtDate(p.datum) : ''}</div>
                                    <div class="item-meta">Materijal: <strong>${fmt(fin.naplativo)}</strong>${fin.cenaRada ? ' • Rad: <strong>' + fmt(fin.cenaRada) + '</strong>' : ''} • Trošak: <strong>${fmt(fin.trosak)}</strong> RSD</div>
                                    <div class="item-value ${fin.profit < 0 ? 'red' : ''}">Profit: ${fmt(fin.profit)} RSD</div>
                                    ${this.progresBar(this.progresPosla(p.id))}
                                </div>
                            </div>
                            <div class="btn-row" style="margin-top:10px;">
                                ${p.status === 'aktivan' ? `<button class="btn ${this.getPin() && this.getPin().id === p.id ? '' : 'btn-ghost'} btn-small" onclick="app.pinuj('${p.id}')">📌</button>` : ''}
                                ${p.status === 'aktivan' && this.tovarStavke(p.id).length ? `<button class="btn btn-ghost btn-small" onclick="app.tovarenje('${p.id}')">🚚</button>` : ''}
                                <button class="btn btn-ghost btn-small" onclick="app.detaljPosla('${p.id}')">📋 Detalji</button>
                                <button class="btn btn-ghost btn-small" onclick="app.specifikacija('${p.id}')">🖨</button>
                                <button class="btn btn-ghost btn-small" onclick="app.formaPosao('${p.id}')">✏️</button>
                                <button class="btn btn-ghost btn-small" onclick="app.togglePosao('${p.id}')">${p.status === 'aktivan' ? '✅ Završi' : '↩️'}</button>
                                <button class="btn btn-danger btn-small" onclick="app.obrisiPosao('${p.id}')">🗑</button>
                            </div>
                        </div>`;
                    }).join('') : '<div class="card"><div class="empty-state"><div class="big">💼</div>Nema poslova.<br>Dodaj posao pa vezuj izlaze materijala za njega.</div></div>'}
                `;
            }

            formaPosao(id) {
                const p = id ? this.db.posao(id) : { naziv: '', lokacija: '', napomena: '', cenaRada: '' };
                this.modal(`
                    <div class="modal-title">${id ? 'Izmena posla' : 'Novi posao'} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="form-group"><label class="form-label">Naziv *</label><input id="pNaziv" value="${esc(p.naziv)}" placeholder="npr. Stan 5B — elektroinstalacije"></div>
                    <div class="form-group"><label class="form-label">Lokacija</label><input id="pLok" value="${esc(p.lokacija || '')}" placeholder="npr. Novi Sad, Bulevar 12"></div>
                    <div class="form-group"><label class="form-label">Cena rada (RSD)</label><input id="pRad" type="number" inputmode="decimal" step="any" value="${p.cenaRada || ''}" placeholder="0"></div>
                    <div class="form-group"><label class="form-label">Napomena</label><textarea id="pNap" rows="2" placeholder="npr. dogovoreno sa investitorom...">${esc(p.napomena || '')}</textarea></div>
                    <button class="btn" onclick="app.sacuvajPosao('${id || ''}')">Sačuvaj</button>
                `);
            }

            sacuvajPosao(id) {
                const data = {
                    naziv: document.getElementById('pNaziv').value.trim(),
                    lokacija: document.getElementById('pLok').value.trim(),
                    cenaRada: num(document.getElementById('pRad').value),
                    napomena: document.getElementById('pNap').value.trim()
                };
                if (!data.naziv) return this.toast('Naziv je obavezan', 'error');
                if (id) { this.db.updatePosao(id, data); this.toast('Posao izmenjen ✓', 'success'); }
                else { this.db.addPosao(data); this.toast('Posao kreiran ✓', 'success'); }
                this.closeModal();
                this.render();
            }

            togglePosao(id) {
                const p = this.db.posao(id);
                this.db.updatePosao(id, { status: p.status === 'aktivan' ? 'zavrsen' : 'aktivan' });
                this.render();
            }

            obrisiPosao(id) {
                const p = this.db.posao(id);
                this.confirm(`Obrisati posao <strong>${esc(p.naziv)}</strong>?<br>Transakcije ostaju, samo se odvezuju od posla.`, () => {
                    this.db.deletePosao(id);
                    this.toast('Posao obrisan', 'success');
                    this.render();
                });
            }

            detaljPosla(id) {
                const p = this.db.posao(id);
                const fin = this.db.posaoFinansije(id);
                this.modal(`
                    <div class="modal-title">💼 ${esc(p.naziv)} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    ${p.napomena ? `<p style="font-size:13px; color:#64748b; margin-bottom:12px;">📝 ${esc(p.napomena)}</p>` : ''}
                    ${fin.stavke.length ? `
                    <div class="table-wrap"><table>
                        <thead><tr><th>Materijal</th><th class="num">Kol.</th><th class="num">Trošak</th><th class="num">Naplativo</th><th></th></tr></thead>
                        <tbody>${fin.stavke.map(s => `<tr><td>${esc(s.naziv)}</td><td class="num">${fmt(s.kolicina)} ${esc(s.jedinica)}</td><td class="num">${fmt(s.trosak)}</td><td class="num">${fmt(s.naplativo)}</td><td class="num">${s.materijal_id && this.db.materijal(s.materijal_id) ? `<button class="icon-btn" title="Vrati u magacin" onclick="app.formaPovracaj('${id}', '${s.materijal_id}')">↩️</button>` : ''}</td></tr>`).join('')}</tbody>
                        <tfoot>
                            ${fin.cenaRada ? `<tr><td>Cena rada</td><td></td><td class="num">—</td><td class="num">${fmt(fin.cenaRada)}</td><td></td></tr>` : ''}
                            <tr><td>UKUPNO</td><td></td><td class="num">${fmt(fin.trosak)}</td><td class="num">${fmt(fin.ukupnoNaplativo)}</td><td></td></tr>
                        </tfoot>
                    </table></div>
                    <p style="margin-top:12px; font-size:14px; font-weight:700; color:${fin.profit >= 0 ? '#15803d' : '#b91c1c'};">Profit (materijal + rad): ${fmt(fin.profit)} RSD</p>
                    ` : (fin.cenaRada ? `<p style="font-size:14px; font-weight:700; color:#15803d;">Cena rada: ${fmt(fin.cenaRada)} RSD</p><div class="empty-state">Još nema utrošenog materijala.</div>` : '<div class="empty-state">Još nema utrošenog materijala na ovom poslu.<br>Kod izlaza izaberi ovaj posao.</div>')}

                    <div class="card-title" style="margin-top:16px;">📐 Plan materijala</div>
                    ${(p.plan || []).length ? (p.plan || []).map((pl, i) => {
                        const m = this.db.materijal(pl.materijal_id);
                        if (!m) return '';
                        const utroseno = this.db.utrosenoNaPoslu(id, pl.materijal_id);
                        const preostalo = Math.max(0, pl.kolicina - utroseno);
                        const slobodno = this.db.stanje(pl.materijal_id) - this.db.rezervisano(pl.materijal_id, id);
                        const fali = Math.max(0, preostalo - Math.max(0, slobodno));
                        const status = preostalo === 0 ? '<span class="badge badge-success">✓ ugrađeno</span>'
                            : fali > 0 ? `<span class="badge badge-danger">fali ${fmt(fali)}</span>`
                            : '<span class="badge badge-blue">spremno</span>';
                        return `<div class="list-item" style="padding:9px 12px;"><div class="list-row">
                            <div>
                                <div class="item-meta" style="color:#334155; font-weight:600;">${esc(m.naziv)} — plan ${fmt(pl.kolicina)} ${esc(m.jedinica)} ${status}</div>
                                <div class="item-meta">ugrađeno ${fmt(utroseno)} • preostalo ${fmt(preostalo)}</div>
                            </div>
                            <button class="icon-btn danger" onclick="app.planUkloni('${id}', ${i})">🗑</button>
                        </div></div>`;
                    }).join('') : '<div class="item-meta" style="margin-bottom:6px;">Upiši šta će trebati — app rezerviše materijal i javi šta fali (ide pravo na šoping listu).</div>'}
                    <div style="display:flex; gap:8px; margin-top:8px;">
                        <select id="planMat" style="flex:2;">${this.db.getMaterijali().map(m => `<option value="${m.id}">${esc(m.naziv)}</option>`).join('')}</select>
                        <input id="planKol" type="number" inputmode="decimal" step="any" min="0" placeholder="kol." style="flex:1;">
                        <button class="btn btn-small" onclick="app.planDodaj('${id}')">➕</button>
                    </div>
                    ${(p.plan || []).length ? `<button class="btn btn-ghost btn-small" style="margin-top:8px;" onclick="app.ponuda('${id}')">📄 Ponuda za klijenta (iz plana)</button>` : ''}

                    <div class="card-title" style="margin-top:16px;">🎒 Za poneti</div>
                    ${(p.zaPoneti || []).length ? p.zaPoneti.map(z => `
                        <div class="list-item" style="padding:9px 12px;"><div class="list-row">
                            <div class="item-meta" style="cursor:pointer; ${z.done ? 'text-decoration:line-through; opacity:0.5;' : 'color:#334155; font-weight:600;'}" onclick="app.zpToggle('${id}', '${z.id}')">${z.done ? '☑' : '☐'} ${esc(z.tekst)}</div>
                            <button class="icon-btn danger" onclick="app.zpObrisi('${id}', '${z.id}')">🗑</button>
                        </div></div>`).join('') : '<div class="item-meta" style="margin-bottom:6px;">Šta ne smeš da zaboraviš sutra? (alat, sitnice, dokumenti...)</div>'}
                    <div style="display:flex; gap:8px; margin-top:8px;">
                        <input id="zpNovo" placeholder="npr. silikon, merdevine..." style="flex:1;" onkeydown="if(event.key==='Enter') app.zpDodaj('${id}')">
                        <button class="btn btn-small" onclick="app.zpDodaj('${id}')">➕</button>
                    </div>
                `);
            }

            specifikacija(id) {
                const p = this.db.posao(id);
                const fin = this.db.posaoFinansije(id);
                if (!fin.stavke.length && !fin.cenaRada) return this.toast('Posao još nema ni materijal ni cenu rada', 'error');

                const w = window.open('', '_blank');
                if (!w) return this.toast('Browser je blokirao novi prozor', 'error');
                w.document.write(`<!DOCTYPE html><html lang="sr"><head><meta charset="UTF-8"><title>Specifikacija — ${esc(p.naziv)}</title>
                    <style>
                        body { font-family: -apple-system, 'Segoe UI', sans-serif; color: #1e293b; max-width: 700px; margin: 30px auto; padding: 0 20px; }
                        h1 { font-size: 22px; margin-bottom: 4px; }
                        .meta { color: #64748b; font-size: 13px; margin-bottom: 24px; }
                        table { width: 100%; border-collapse: collapse; font-size: 13px; }
                        th { text-align: left; border-bottom: 2px solid #1e293b; padding: 8px 6px; font-size: 11px; text-transform: uppercase; }
                        td { padding: 8px 6px; border-bottom: 1px solid #e2e8f0; }
                        .num { text-align: right; }
                        tfoot td { font-weight: 700; border-top: 2px solid #1e293b; border-bottom: none; font-size: 15px; }
                        .footer { margin-top: 40px; color: #94a3b8; font-size: 11px; }
                        @media print { .no-print { display: none; } body { margin: 0 auto; } }
                    </style></head><body>
                    <h1>Specifikacija radova i materijala</h1>
                    <div class="meta"><strong>${esc(p.naziv)}</strong>${p.lokacija ? ' • ' + esc(p.lokacija) : ''}<br>Datum: ${fmtDate(new Date())}</div>
                    <table>
                        <thead><tr><th>Stavka</th><th class="num">Količina</th><th class="num">Cena (RSD)</th><th class="num">Iznos (RSD)</th></tr></thead>
                        <tbody>
                            ${fin.stavke.map(s => `<tr><td>${esc(s.naziv)}</td><td class="num">${fmt(s.kolicina)} ${esc(s.jedinica)}</td><td class="num">${s.kolicina ? fmt(s.naplativo / s.kolicina) : '—'}</td><td class="num">${fmt(s.naplativo)}</td></tr>`).join('')}
                            ${fin.cenaRada ? `<tr><td>Radovi</td><td class="num">—</td><td class="num">—</td><td class="num">${fmt(fin.cenaRada)}</td></tr>` : ''}
                        </tbody>
                        <tfoot><tr><td colspan="3">UKUPNO ZA NAPLATU</td><td class="num">${fmt(fin.ukupnoNaplativo)} RSD</td></tr></tfoot>
                    </table>
                    <div class="footer">Generisano iz aplikacije Magacin • ${fmtDateTime(new Date())}</div>
                    <button class="no-print" style="margin-top:20px; padding:10px 20px; font-size:14px; cursor:pointer;" onclick="window.print()">🖨 Štampaj / Sačuvaj kao PDF</button>
                    </body></html>`);
                w.document.close();
            }

            formaPovracaj(posaoId, mid) {
                const fin = this.db.posaoFinansije(posaoId);
                const s = fin.stavke.find(x => x.materijal_id === mid);
                const m = this.db.materijal(mid);
                if (!s || s.kolicina <= 0) return this.toast('Nema šta da se vrati', 'error');
                this.modal(`
                    <div class="modal-title">↩️ Povraćaj: ${esc(m.naziv)} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="item-meta" style="margin-bottom:12px;">Na poslu je utrošeno <strong>${fmt(s.kolicina)} ${esc(m.jedinica)}</strong>. Koliko vraćaš u magacin?</div>
                    <div class="form-group">
                        <input type="number" id="pvKol" inputmode="decimal" step="any" min="0" max="${s.kolicina}" placeholder="0" style="font-size:20px; text-align:center; padding:14px;">
                        ${this.qtyDugmad('pvKol')}
                    </div>
                    <button class="btn" onclick="app.sacuvajPovracaj('${posaoId}', '${mid}')">Vrati u magacin</button>
                `);
            }

            sacuvajPovracaj(posaoId, mid) {
                const kol = num(document.getElementById('pvKol').value);
                const fin = this.db.posaoFinansije(posaoId);
                const s = fin.stavke.find(x => x.materijal_id === mid);
                if (kol <= 0) return this.toast('Unesi količinu', 'error');
                if (!s || kol > s.kolicina) return this.toast(`Možeš vratiti najviše ${fmt(s ? s.kolicina : 0)}`, 'error');
                this.db.addTransakcija({ materijal_id: mid, tip: 'ulaz', kolicina: kol, posao_id: posaoId, napomena: 'povraćaj sa posla' });
                this.toast('Vraćeno u magacin ✓ — posao razdužen', 'success');
                this.closeModal();
                this.detaljPosla(posaoId);
                this.render();
            }

            /* ---------- PROGRES I TOVARENJE ---------- */
            progresPosla(posaoId) {
                const p = this.db.posao(posaoId);
                if (!p || !p.plan || !p.plan.length) return null;
                let plan = 0, gotovo = 0;
                p.plan.forEach(pl => {
                    plan += pl.kolicina;
                    gotovo += Math.min(this.db.utrosenoNaPoslu(posaoId, pl.materijal_id), pl.kolicina);
                });
                return plan > 0 ? Math.round(gotovo / plan * 100) : null;
            }

            progresBar(pct) {
                if (pct === null) return '';
                return `<div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
                    <div class="item-meta" style="margin-top:3px;">📐 ${pct}% plana ugrađeno</div>`;
            }

            tovarStavke(posaoId) {
                const p = this.db.posao(posaoId);
                const stavke = [];
                (p.plan || []).forEach(pl => {
                    const m = this.db.materijal(pl.materijal_id);
                    if (!m) return;
                    const preostalo = Math.max(0, pl.kolicina - this.db.utrosenoNaPoslu(posaoId, pl.materijal_id));
                    if (preostalo <= 0) return;
                    const fali = Math.max(0, preostalo - Math.max(0, this.db.stanje(pl.materijal_id)));
                    stavke.push({ key: 'm:' + pl.materijal_id, tekst: m.naziv, kol: preostalo, jedinica: m.jedinica, lokacija: m.lokacija || '', fali, mid: pl.materijal_id });
                });
                (p.zaPoneti || []).filter(z => !z.done).forEach(z => stavke.push({ key: 'z:' + z.id, tekst: z.tekst, kol: null, lokacija: '', fali: 0 }));
                return stavke;
            }

            tovarenje(posaoId) {
                const p = this.db.posao(posaoId);
                if (!this.tovarV) this.tovarV = {};
                const stavke = this.tovarStavke(posaoId);
                if (!stavke.length) return this.toast('Nema šta da se tovari — plan je ugrađen, „za poneti" prazno', 'success');
                this.modal(`
                    <div class="modal-title">🚚 Tovarenje: ${esc(p.naziv)} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    ${stavke.map(s => {
                        const ck = this.tovarV[posaoId + s.key];
                        return `<div class="list-item" style="padding:10px 12px; ${s.fali > 0 ? 'border-color:#fecaca; background:#fef2f2;' : ''}">
                            <div class="item-meta" style="cursor:pointer; ${ck ? 'text-decoration:line-through; opacity:0.5;' : 'color:#334155; font-weight:600;'}" onclick="app.tovarToggle('${posaoId}', '${s.key}')">
                                ${ck ? '☑' : '☐'} ${esc(s.tekst)}${s.kol != null ? ' — ' + fmt(s.kol) + ' ' + esc(s.jedinica) : ''}${s.lokacija ? ' • 📍 ' + esc(s.lokacija) : ''}
                                ${s.fali > 0 ? `<div style="color:#b91c1c; font-weight:700;">⚠️ fali ${fmt(s.fali)} — kupi usput${(() => { const j = this.najjeftinijaNabavka(s.mid); return j ? ' (' + esc(j.dobavljac) + ')' : ''; })()}</div>` : ''}
                            </div>
                        </div>`;
                    }).join('')}
                    <div class="btn-row" style="margin-top:10px;">
                        <button class="btn btn-ghost btn-small" onclick="app.kopirajTovar('${posaoId}')">📋 Kopiraj</button>
                        ${navigator.share ? `<button class="btn btn-ghost btn-small" onclick="app.podeliTovar('${posaoId}')">📤 Podeli</button>` : ''}
                    </div>
                `);
            }

            tovarToggle(posaoId, key) {
                if (!this.tovarV) this.tovarV = {};
                this.tovarV[posaoId + key] = !this.tovarV[posaoId + key];
                this.tovarenje(posaoId);
            }

            tovarTekst(posaoId) {
                const p = this.db.posao(posaoId);
                return `🚚 Tovarenje — ${p.naziv} (${fmtDate(new Date())})\n` + this.tovarStavke(posaoId).map(s =>
                    `☐ ${s.tekst}${s.kol != null ? ' — ' + fmt(s.kol) + ' ' + s.jedinica : ''}${s.lokacija ? ' [' + s.lokacija + ']' : ''}${s.fali > 0 ? ' ⚠️ KUPI ' + fmt(s.fali) : ''}`
                ).join('\n');
            }

            kopirajTovar(posaoId) {
                navigator.clipboard.writeText(this.tovarTekst(posaoId))
                    .then(() => this.toast('Lista kopirana ✓', 'success'))
                    .catch(() => this.toast('Kopiranje nije uspelo', 'error'));
            }

            podeliTovar(posaoId) {
                navigator.share({ title: 'Tovarenje', text: this.tovarTekst(posaoId) }).catch(() => {});
            }

            /* ---------- PLAN POSLA ---------- */
            planDodaj(posaoId) {
                const mid = document.getElementById('planMat').value;
                const kol = num(document.getElementById('planKol').value);
                if (!mid || kol <= 0) return this.toast('Izaberi materijal i količinu', 'error');
                const p = this.db.posao(posaoId);
                const plan = p.plan || [];
                const postojeca = plan.find(x => x.materijal_id === mid);
                if (postojeca) postojeca.kolicina += kol;
                else plan.push({ materijal_id: mid, kolicina: kol });
                this.db.updatePosao(posaoId, { plan });
                this.detaljPosla(posaoId);
            }

            planUkloni(posaoId, i) {
                const p = this.db.posao(posaoId);
                const plan = p.plan || [];
                plan.splice(i, 1);
                this.db.updatePosao(posaoId, { plan });
                this.detaljPosla(posaoId);
            }

            ponuda(id) {
                const p = this.db.posao(id);
                const plan = p.plan || [];
                if (!plan.length) return this.toast('Posao nema plan materijala', 'error');
                const stavke = plan.map(pl => {
                    const m = this.db.materijal(pl.materijal_id);
                    return m ? { naziv: m.naziv, jedinica: m.jedinica, kolicina: pl.kolicina, cena: m.prodajna, iznos: pl.kolicina * m.prodajna } : null;
                }).filter(Boolean);
                const cenaRada = p.cenaRada ? num(p.cenaRada) : 0;
                const ukupno = stavke.reduce((s, x) => s + x.iznos, 0) + cenaRada;

                const w = window.open('', '_blank');
                if (!w) return this.toast('Browser je blokirao novi prozor', 'error');
                w.document.write(`<!DOCTYPE html><html lang="sr"><head><meta charset="UTF-8"><title>Ponuda — ${esc(p.naziv)}</title>
                    <style>
                        body { font-family: -apple-system, 'Segoe UI', sans-serif; color: #1e293b; max-width: 700px; margin: 30px auto; padding: 0 20px; }
                        h1 { font-size: 22px; margin-bottom: 4px; }
                        .meta { color: #64748b; font-size: 13px; margin-bottom: 24px; }
                        table { width: 100%; border-collapse: collapse; font-size: 13px; }
                        th { text-align: left; border-bottom: 2px solid #1e293b; padding: 8px 6px; font-size: 11px; text-transform: uppercase; }
                        td { padding: 8px 6px; border-bottom: 1px solid #e2e8f0; }
                        .num { text-align: right; }
                        tfoot td { font-weight: 700; border-top: 2px solid #1e293b; border-bottom: none; font-size: 15px; }
                        .footer { margin-top: 40px; color: #94a3b8; font-size: 11px; }
                        @media print { .no-print { display: none; } body { margin: 0 auto; } }
                    </style></head><body>
                    <h1>PONUDA</h1>
                    <div class="meta"><strong>${esc(p.naziv)}</strong>${p.lokacija ? ' • ' + esc(p.lokacija) : ''}<br>Datum: ${fmtDate(new Date())} • Ponuda važi 15 dana</div>
                    <table>
                        <thead><tr><th>Stavka</th><th class="num">Količina</th><th class="num">Cena (RSD)</th><th class="num">Iznos (RSD)</th></tr></thead>
                        <tbody>
                            ${stavke.map(s => `<tr><td>${esc(s.naziv)}</td><td class="num">${fmt(s.kolicina)} ${esc(s.jedinica)}</td><td class="num">${fmt(s.cena)}</td><td class="num">${fmt(s.iznos)}</td></tr>`).join('')}
                            ${cenaRada ? `<tr><td>Radovi</td><td class="num">—</td><td class="num">—</td><td class="num">${fmt(cenaRada)}</td></tr>` : ''}
                        </tbody>
                        <tfoot><tr><td colspan="3">UKUPNO</td><td class="num">${fmt(ukupno)} RSD</td></tr></tfoot>
                    </table>
                    <div class="footer">Ponuda je informativnog karaktera — konačan obračun po stvarno utrošenom materijalu.</div>
                    <button class="no-print" style="margin-top:20px; padding:10px 20px; font-size:14px; cursor:pointer;" onclick="window.print()">🖨 Štampaj / Sačuvaj kao PDF</button>
                    </body></html>`);
                w.document.close();
            }

            /* ---------- ZA PONETI ---------- */
            zpDodaj(posaoId) {
                const el = document.getElementById('zpNovo');
                const tekst = el.value.trim();
                if (!tekst) return;
                const p = this.db.posao(posaoId);
                const lista = p.zaPoneti || [];
                lista.push({ id: uid(), tekst, done: false });
                this.db.updatePosao(posaoId, { zaPoneti: lista });
                this.detaljPosla(posaoId);
                setTimeout(() => { const n = document.getElementById('zpNovo'); if (n) n.focus(); }, 50);
            }

            zpToggle(posaoId, zId) {
                const p = this.db.posao(posaoId);
                this.db.updatePosao(posaoId, { zaPoneti: (p.zaPoneti || []).map(z => z.id === zId ? { ...z, done: !z.done } : z) });
                this.detaljPosla(posaoId);
            }

            zpObrisi(posaoId, zId) {
                const p = this.db.posao(posaoId);
                this.db.updatePosao(posaoId, { zaPoneti: (p.zaPoneti || []).filter(z => z.id !== zId) });
                this.detaljPosla(posaoId);
            }

            /* ---------- STANJE ---------- */
            render_stanje() {
                if (!this.stanjeSort) this.stanjeSort = 'naziv';
                const sortChip = (id, tekst) => `<span class="chip ${this.stanjeSort === id ? 'active' : ''}" onclick="app.stanjeSort='${id}'; app.render()">${tekst}</span>`;
                return `
                    <input class="search-input" placeholder="🔍 Pretraži stanje..." value="${esc(this.filter)}"
                        oninput="app.filter=this.value; app.osveziListu('listaStanje', app.tabelaStanja())">
                    <div class="chip-row">
                        ${sortChip('naziv', 'A–Š')}
                        ${sortChip('nisko', '⚠️ Nisko prvo')}
                        ${sortChip('vrednost', '💰 Po vrednosti')}
                    </div>
                    ${this.db.lokacije().length ? `<div class="chip-row">
                        <span class="chip ${!this.lokF ? 'active' : ''}" onclick="app.lokF=''; app.render()">📍 Sve</span>
                        ${this.db.lokacije().map(l => `<span class="chip ${this.lokF === l ? 'active' : ''}" onclick="app.lokF='${esc(l)}'; app.render()">${esc(l)}</span>`).join('')}
                    </div>` : ''}
                    <div id="listaStanje">${this.tabelaStanja()}</div>
                    ${this.topPotrosnja()}
                `;
            }

            topPotrosnja() {
                const mesec = new Date().toISOString().slice(0, 7);
                const potroseno = {};
                this.db.get('transakcije').forEach(t => {
                    if (t.tip !== 'izlaz' || t.datum.slice(0, 7) !== mesec) return;
                    potroseno[t.materijal_id] = (potroseno[t.materijal_id] || 0) + t.kolicina;
                });
                const top = Object.entries(potroseno)
                    .map(([id, kol]) => ({ m: this.db.materijal(id), kol }))
                    .filter(x => x.m)
                    .sort((a, b) => b.kol * b.m.nabavna - a.kol * a.m.nabavna)
                    .slice(0, 5);
                if (!top.length) return '';
                return `<div class="card">
                    <div class="card-title">🔥 Najtrošenije ovog meseca</div>
                    ${top.map(x => `<div class="list-item"><div class="list-row">
                        <div class="item-meta">${esc(x.m.naziv)}</div>
                        <div class="item-value red">−${fmt(x.kol)} ${esc(x.m.jedinica)} (~${fmt(x.kol * x.m.nabavna)} RSD)</div>
                    </div></div>`).join('')}
                    <p style="font-size:11px; color:#94a3b8; margin-top:8px;">Ovo drži u većoj zalihi — razmisli o povećanju minimuma (✏️ na materijalu).</p>
                </div>`;
            }

            tabelaStanja() {
                const f = this.filter.toLowerCase();
                let inv = this.db.getInventura().filter(i => !f || i.naziv.toLowerCase().includes(f));
                if (this.lokF) inv = inv.filter(i => i.lokacija === this.lokF);
                if (this.stanjeSort === 'nisko') inv.sort((a, b) => (a.stanje - a.minZaliha) - (b.stanje - b.minZaliha));
                else if (this.stanjeSort === 'vrednost') inv.sort((a, b) => b.vredNabavna - a.vredNabavna);
                if (!inv.length) return '<div class="card"><div class="empty-state"><div class="big">📊</div>Nema materijala.</div></div>';
                const ukupnoNab = inv.reduce((s, i) => s + Math.max(0, i.vredNabavna), 0);
                const ukupnoProd = inv.reduce((s, i) => s + Math.max(0, i.vredProdajna), 0);
                return `<div class="card"><div class="table-wrap"><table>
                    <thead><tr><th>Materijal</th><th class="num">Stanje</th><th class="num">Vred. nab.</th><th class="num">Vred. prod.</th></tr></thead>
                    <tbody>${inv.map(i => {
                        const rez = this.db.rezervisano(i.id);
                        return `
                        <tr>
                            <td>${esc(i.naziv)}${i.stanje <= i.minZaliha ? ' <span class="badge badge-danger">nisko</span>' : ''}${i.lokacija ? `<div style="font-size:10px; color:#94a3b8;">📍 ${esc(i.lokacija)}</div>` : ''}</td>
                            <td class="num"><strong>${fmt(i.stanje)}</strong> ${esc(i.jedinica)}${rez > 0 ? `<div style="font-size:10px; color:#92400e;">🔒 rez. ${fmt(rez)}</div>` : ''}</td>
                            <td class="num">${fmt(Math.max(0, i.vredNabavna))}</td>
                            <td class="num">${fmt(Math.max(0, i.vredProdajna))}</td>
                        </tr>`; }).join('')}</tbody>
                    <tfoot><tr><td>UKUPNO (RSD)</td><td></td><td class="num">${fmt(ukupnoNab)}</td><td class="num">${fmt(ukupnoProd)}</td></tr></tfoot>
                </table></div></div>`;
            }

            /* ---------- ŠOPING LISTA ---------- */
            zaokruziNaPakovanje(m, kol) {
                if (!m || !m.pakovanje || m.pakovanje <= 0) return kol;
                return Math.ceil(kol / m.pakovanje) * m.pakovanje;
            }

            najjeftinijaNabavka(mid) {
                const saCenom = this.db.nabavkeMaterijala(mid).filter(t => t.nabavna > 0 && t.dobavljac);
                if (!saCenom.length) return null;
                return saCenom.reduce((min, t) => t.nabavna < min.nabavna ? t : min, saCenom[0]);
            }

            sopingStavke() {
                const rucneRaw = this.db.getSoping();
                const rucneMatIds = rucneRaw.map(r => r.materijal_id).filter(Boolean);
                const auto = [];
                this.db.getInventura().forEach(i => {
                    if (rucneMatIds.includes(i.id)) return;
                    let potrebno = 0, razlog = '';
                    if (i.stanje <= i.minZaliha) { potrebno = Math.max(i.minZaliha * 2 - i.stanje, 1); razlog = 'nisko'; }
                    const deficit = this.db.rezervisano(i.id) - i.stanje;
                    if (deficit > 0 && deficit > potrebno) { potrebno = deficit; razlog = razlog ? 'nisko+plan' : 'plan'; }
                    else if (deficit > 0 && !razlog) { potrebno = deficit; razlog = 'plan'; }
                    if (potrebno <= 0) return;
                    const zaokruzeno = this.zaokruziNaPakovanje(i, potrebno);
                    auto.push({
                        auto: true, razlog, materijal_id: i.id, naziv: i.naziv, jedinica: i.jedinica,
                        kolicina: zaokruzeno, pakovanje: i.pakovanje, nabavna: i.nabavna, stanje: i.stanje
                    });
                });
                const rucne = rucneRaw.map(r => {
                    const m = r.materijal_id ? this.db.materijal(r.materijal_id) : null;
                    return {
                        auto: false, sopingId: r.id, materijal_id: m ? m.id : null,
                        naziv: m ? m.naziv : r.naziv, jedinica: m ? m.jedinica : (r.jedinica || ''),
                        kolicina: r.kolicina || 1, nabavna: m ? m.nabavna : 0, stanje: m ? this.db.stanje(m.id) : null
                    };
                });
                return [...rucne, ...auto];
            }

            render_soping() {
                const stavke = this.sopingStavke();
                const ukupno = stavke.reduce((s, x) => s + x.kolicina * (x.nabavna || 0), 0);

                return `
                    <div class="btn-row">
                        <button class="btn" onclick="app.formaSoping()">➕ Dodaj stavku</button>
                        ${stavke.length ? `<button class="btn btn-ghost" onclick="app.kopirajSoping()">📋 Kopiraj</button>` : ''}
                        ${stavke.length && navigator.share ? `<button class="btn btn-ghost" onclick="app.podeliSoping()">📤 Podeli</button>` : ''}
                    </div>
                    ${stavke.length ? `
                    <div class="card">
                        <div class="card-title">Treba kupiti (${stavke.length}) <span style="text-transform:none; color:#64748b; font-weight:600;">~${fmt(ukupno)} RSD</span></div>
                        ${stavke.map(s => {
                            const jeftina = s.materijal_id ? this.najjeftinijaNabavka(s.materijal_id) : null;
                            return `<div class="list-item">
                            <div class="list-row">
                                <div>
                                    <div class="item-title">${esc(s.naziv)} ${s.auto ? (s.razlog === 'plan' ? '<span class="badge badge-blue">📐 plan</span>' : s.razlog === 'nisko+plan' ? '<span class="badge badge-danger">nisko + plan</span>' : '<span class="badge badge-warn">nisko</span>') : '<span class="badge badge-blue">ručno</span>'}</div>
                                    <div class="item-meta">Kupi: <strong>${fmt(s.kolicina)} ${esc(s.jedinica)}</strong>${s.pakovanje ? ' (' + fmt(s.kolicina / s.pakovanje) + ' × pak. ' + fmt(s.pakovanje) + ')' : ''}${s.stanje != null ? ' • imaš ' + fmt(s.stanje) : ''}${s.nabavna ? ' • ~' + fmt(s.kolicina * s.nabavna) + ' RSD' : ''}</div>
                                    ${jeftina ? `<div class="item-meta">🏪 najjeftinije: ${esc(jeftina.dobavljac)} (${fmt(jeftina.nabavna)} RSD, ${fmtDate(jeftina.datum)})</div>` : ''}
                                </div>
                                <div style="display:flex; gap:6px;">
                                    <button class="btn btn-success btn-small" onclick='app.kupiStavku(${JSON.stringify(JSON.stringify({ materijal_id: s.materijal_id, kolicina: s.kolicina, sopingId: s.sopingId || null }))})'>✓ Kupljeno</button>
                                    ${!s.auto ? `<button class="icon-btn danger" onclick="app.obrisiSoping('${s.sopingId}')">🗑</button>` : ''}
                                </div>
                            </div>
                        </div>`; }).join('')}
                        <p style="font-size:11px; color:#94a3b8; margin-top:10px;">„Nisko" stavke dolaze automatski kad zaliha padne ispod minimuma. „✓ Kupljeno" odmah knjiži ulaz u magacin.</p>
                    </div>
                    ` : '<div class="card"><div class="empty-state"><div class="big">✅</div>Sve zalihe su iznad minimuma i nema ručnih stavki.<br>Ništa ne treba kupovati!</div></div>'}
                `;
            }

            formaSoping() {
                const mats = this.db.getMaterijali();
                this.modal(`
                    <div class="modal-title">Dodaj na šoping listu <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="form-group">
                        <label class="form-label">Materijal iz šifarnika</label>
                        <select id="sMat" onchange="document.getElementById('sNazivWrap').style.display = this.value ? 'none' : 'block'">
                            <option value="">— nije u šifarniku (slobodan unos) —</option>
                            ${mats.map(m => `<option value="${m.id}">${esc(m.naziv)}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group" id="sNazivWrap">
                        <label class="form-label">Naziv (slobodan unos)</label>
                        <input id="sNaziv" placeholder="npr. burgija 8mm, silikon...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Količina</label>
                        <input type="number" id="sKol" inputmode="decimal" step="any" min="0" value="1">
                    </div>
                    <button class="btn" onclick="app.sacuvajSoping()">Dodaj</button>
                `);
            }

            sacuvajSoping() {
                const mid = document.getElementById('sMat').value || null;
                const naziv = document.getElementById('sNaziv').value.trim();
                const kol = num(document.getElementById('sKol').value) || 1;
                if (!mid && !naziv) return this.toast('Izaberi materijal ili upiši naziv', 'error');
                this.db.addSoping({ materijal_id: mid, naziv, kolicina: kol });
                this.toast('Dodato na listu ✓', 'success');
                this.closeModal();
                this.render();
            }

            obrisiSoping(id) {
                this.db.deleteSoping(id);
                this.render();
            }

            kupiStavku(json) {
                const s = JSON.parse(json);
                if (!s.materijal_id) {
                    // slobodna stavka — samo skini sa liste
                    if (s.sopingId) this.db.deleteSoping(s.sopingId);
                    this.toast('Skinuto sa liste ✓', 'success');
                    return this.render();
                }
                const m = this.db.materijal(s.materijal_id);
                this.modal(`
                    <div class="modal-title">✓ Kupljeno: ${esc(m.naziv)} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="form-grid2">
                        <div class="form-group">
                            <label class="form-label">Količina (${esc(m.jedinica)})</label>
                            <input type="number" id="bKol" inputmode="decimal" step="any" min="0" value="${s.kolicina}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Cena po ${esc(m.jedinica)} (RSD)</label>
                            <input type="number" id="bCena" inputmode="decimal" step="any" min="0" value="${m.nabavna}">
                        </div>
                    </div>
                    <button class="btn btn-success" onclick="app.potvrdiKupovinu('${s.materijal_id}', '${s.sopingId || ''}')">Proknjiži ulaz</button>
                `);
            }

            potvrdiKupovinu(mid, sopingId) {
                const kol = num(document.getElementById('bKol').value);
                if (kol <= 0) return this.toast('Unesi ispravnu količinu', 'error');
                const cena = num(document.getElementById('bCena').value);
                const m = this.db.materijal(mid);
                if (cena > 0 && cena !== m.nabavna) this.db.updateMaterijal(mid, { nabavna: cena });
                this.db.addTransakcija({ materijal_id: mid, tip: 'ulaz', kolicina: kol, posao_id: null });
                if (sopingId) this.db.deleteSoping(sopingId);
                this.toast('Ulaz proknjižen ✓', 'success');
                this.closeModal();
                this.render();
            }

            sopingTekst() {
                return '🛒 Šoping lista — ' + fmtDate(new Date()) + '\n'
                    + this.sopingStavke().map(s => `• ${s.naziv} — ${fmt(s.kolicina)} ${s.jedinica}`.trim()).join('\n');
            }

            kopirajSoping() {
                navigator.clipboard.writeText(this.sopingTekst())
                    .then(() => this.toast('Lista kopirana — nalepi u poruku ✓', 'success'))
                    .catch(() => this.toast('Kopiranje nije uspelo', 'error'));
            }

            podeliSoping() {
                navigator.share({ title: 'Šoping lista', text: this.sopingTekst() }).catch(() => {});
            }

            podeliBackup() {
                const fajl = new File([this.db.exportAll()], 'magacin-backup-' + new Date().toISOString().slice(0, 10) + '.json', { type: 'application/json' });
                if (navigator.canShare && navigator.canShare({ files: [fajl] })) {
                    navigator.share({ files: [fajl], title: 'Magacin backup' })
                        .then(() => localStorage.setItem('magacin_lastBackup', new Date().toISOString()))
                        .catch(() => {});
                } else {
                    this.toast('Deljenje fajlova nije podržano — koristi Izvezi', 'error');
                }
            }

            /* ---------- KOMPLETI ---------- */
            render_kompleti() {
                const kompleti = this.db.getKompleti();
                return `
                    <button class="btn" onclick="app.formaKomplet()">➕ Novi komplet</button>
                    ${kompleti.length ? kompleti.map(k => {
                        const cena = k.stavke.reduce((s, x) => {
                            const m = this.db.materijal(x.materijal_id);
                            return s + (m ? x.kolicina * m.prodajna : 0);
                        }, 0);
                        return `<div class="card">
                            <div class="list-row">
                                <div>
                                    <div class="item-title">🧰 ${esc(k.naziv)}</div>
                                    <div class="item-meta">${k.stavke.map(x => {
                                        const m = this.db.materijal(x.materijal_id);
                                        return m ? `${esc(m.naziv)} ×${fmt(x.kolicina)}` : '(obrisan)';
                                    }).join(' • ')}</div>
                                    <div class="item-value">~${fmt(cena)} RSD po kompletu (prodajna)</div>
                                </div>
                            </div>
                            <div class="btn-row" style="margin-top:10px;">
                                <button class="btn btn-success btn-small" onclick="app.kompletUKorpu('${k.id}')">📤 U izlaz</button>
                                <button class="btn btn-ghost btn-small" onclick="app.formaKomplet('${k.id}')">✏️</button>
                                <button class="btn btn-danger btn-small" onclick="app.obrisiKomplet('${k.id}')">🗑</button>
                            </div>
                        </div>`;
                    }).join('') : `<div class="card"><div class="empty-state"><div class="big">🧰</div>Nema kompleta.<br>Komplet = šablon materijala koji stalno ide zajedno<br>(npr. „Montaža utičnice": doza + utičnica + 3m kabla).<br>Kod izlaza ga ubaciš u korpu jednim klikom.</div></div>`}
                `;
            }

            formaKomplet(id) {
                const k = id ? this.db.komplet(id) : null;
                this.kompletDraft = k ? { id: k.id, naziv: k.naziv, stavke: [...k.stavke.map(s => ({ ...s }))] } : { id: null, naziv: '', stavke: [] };
                this.modalKomplet();
            }

            modalKomplet() {
                const d = this.kompletDraft;
                const mats = this.db.getMaterijali();
                this.modal(`
                    <div class="modal-title">${d.id ? 'Izmena kompleta' : 'Novi komplet'} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="form-group"><label class="form-label">Naziv *</label><input id="kNaziv" value="${esc(d.naziv)}" placeholder="npr. Montaža utičnice"></div>
                    ${d.stavke.length ? d.stavke.map((s, i) => {
                        const m = this.db.materijal(s.materijal_id);
                        return `<div class="list-item"><div class="list-row">
                            <div class="item-meta">${esc(m ? m.naziv : '(obrisan)')} — <strong>${fmt(s.kolicina)} ${esc(m ? m.jedinica : '')}</strong></div>
                            <button class="icon-btn danger" onclick="app.kompletDraftUkloni(${i})">🗑</button>
                        </div></div>`;
                    }).join('') : '<div class="empty-state">Još nema stavki.</div>'}
                    <div class="form-grid2" style="margin-top:10px;">
                        <div class="form-group">
                            <label class="form-label">Materijal</label>
                            <select id="kMat">${mats.map(m => `<option value="${m.id}">${esc(m.naziv)}</option>`).join('')}</select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Količina</label>
                            <input type="number" id="kStKol" inputmode="decimal" step="any" min="0" placeholder="0">
                        </div>
                    </div>
                    <button class="btn btn-ghost" onclick="app.kompletDraftDodaj()">➕ Dodaj stavku</button>
                    <button class="btn" style="margin-top:8px;" onclick="app.sacuvajKomplet()">Sačuvaj komplet</button>
                `);
            }

            kompletDraftDodaj() {
                const mid = document.getElementById('kMat').value;
                const kol = num(document.getElementById('kStKol').value);
                this.kompletDraft.naziv = document.getElementById('kNaziv').value;
                if (!mid || kol <= 0) return this.toast('Izaberi materijal i količinu', 'error');
                const postojeca = this.kompletDraft.stavke.find(s => s.materijal_id === mid);
                if (postojeca) postojeca.kolicina += kol;
                else this.kompletDraft.stavke.push({ materijal_id: mid, kolicina: kol });
                this.modalKomplet();
            }

            kompletDraftUkloni(i) {
                this.kompletDraft.naziv = document.getElementById('kNaziv').value;
                this.kompletDraft.stavke.splice(i, 1);
                this.modalKomplet();
            }

            sacuvajKomplet() {
                const d = this.kompletDraft;
                d.naziv = document.getElementById('kNaziv').value.trim();
                if (!d.naziv) return this.toast('Naziv je obavezan', 'error');
                if (!d.stavke.length) return this.toast('Dodaj bar jednu stavku', 'error');
                if (d.id) { this.db.updateKomplet(d.id, { naziv: d.naziv, stavke: d.stavke }); this.toast('Komplet izmenjen ✓', 'success'); }
                else { this.db.addKomplet({ naziv: d.naziv, stavke: d.stavke }); this.toast('Komplet sačuvan ✓', 'success'); }
                this.kompletDraft = null;
                this.closeModal();
                this.render();
            }

            obrisiKomplet(id) {
                const k = this.db.komplet(id);
                this.confirm(`Obrisati komplet <strong>${esc(k.naziv)}</strong>?`, () => {
                    this.db.deleteKomplet(id);
                    this.toast('Komplet obrisan', 'success');
                    this.render();
                });
            }

            kompletUKorpu(id) {
                const k = this.db.komplet(id);
                this.modal(`
                    <div class="modal-title">🧰 ${esc(k.naziv)} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="form-group">
                        <label class="form-label">Koliko puta? (npr. broj utičnica)</label>
                        <input type="number" id="kPuta" inputmode="numeric" min="1" step="1" value="1" style="font-size:18px; text-align:center;">
                        ${this.qtyDugmad('kPuta')}
                    </div>
                    <button class="btn btn-success" onclick="app.potvrdiKompletUKorpu('${id}')">Ubaci u izlaz</button>
                `);
            }

            potvrdiKompletUKorpu(id) {
                const k = this.db.komplet(id);
                const puta = Math.max(1, Math.round(num(document.getElementById('kPuta').value) || 1));
                // provera stanja za sve stavke (ukljucujuci ono sto je vec u korpi)
                for (const s of k.stavke) {
                    const m = this.db.materijal(s.materijal_id);
                    if (!m) return this.toast('Komplet sadrži obrisan materijal — izmeni komplet', 'error');
                    const potrebno = s.kolicina * puta + this.korpa.izlaz.filter(x => x.materijal_id === s.materijal_id).reduce((a, x) => a + x.kolicina, 0);
                    const stanje = this.db.stanje(s.materijal_id);
                    if (potrebno > stanje) return this.toast(`Nema dovoljno: ${m.naziv} (treba ${fmt(potrebno)}, imaš ${fmt(stanje)})`, 'error');
                }
                k.stavke.forEach(s => {
                    const postojeca = this.korpa.izlaz.find(x => x.materijal_id === s.materijal_id);
                    if (postojeca) postojeca.kolicina += s.kolicina * puta;
                    else this.korpa.izlaz.push({ materijal_id: s.materijal_id, kolicina: s.kolicina * puta });
                });
                this.toast(`Komplet ×${puta} ubačen u korpu ✓`, 'success');
                if (this.brzi) {
                    this.otvoriPicker('izlaz');
                } else {
                    this.closeModal();
                    this.idiNa('izlazi');
                }
            }

            /* ---------- POPIS ---------- */
            render_popis() {
                const inv = this.db.getInventura();
                if (!inv.length) return '<div class="card"><div class="empty-state"><div class="big">📋</div>Nema materijala za popis.</div></div>';

                const unetih = Object.keys(this.popisV).length;
                const f = this.filter.toLowerCase();
                const prikaz = inv.filter(i => !f || i.naziv.toLowerCase().includes(f));

                return `
                    <div class="card">
                        <div class="card-title">Kako se radi popis</div>
                        <p style="font-size:13px; color:#64748b;">Prođi kroz policu i za svaki materijal upiši <strong>koliko stvarno imaš</strong>. Preskoči ono što se slaže. Na kraju pritisni „Pregled razlika" — app će ti pokazati rastur i ponuditi da svede stanje.</p>
                    </div>
                    <input class="search-input" placeholder="🔍 Pretraži..." value="${esc(this.filter)}"
                        oninput="app.filter=this.value; app.osveziListu('popisLista', app.popisLista())">
                    <div id="popisLista">${this.popisLista()}</div>
                    <button class="btn ${unetih ? '' : 'btn-ghost'}" onclick="app.pregledPopisa()">📋 Pregled razlika ${unetih ? `(${unetih})` : ''}</button>
                `;
            }

            popisLista() {
                const f = this.filter.toLowerCase();
                const inv = this.db.getInventura().filter(i => !f || i.naziv.toLowerCase().includes(f));
                return `<div class="card">${inv.map(i => {
                    const uneto = this.popisV[i.id];
                    const imaUnos = uneto !== undefined && uneto !== '';
                    const razlika = imaUnos ? num(uneto) - i.stanje : 0;
                    return `<div class="list-item" style="${imaUnos ? (razlika === 0 ? 'border-color:#bbf7d0; background:#f0fdf4;' : 'border-color:#fecaca; background:#fef2f2;') : ''}">
                        <div class="list-row">
                            <div style="flex:1;">
                                <div class="item-title">${esc(i.naziv)}</div>
                                <div class="item-meta">Knjižno: <strong>${fmt(i.stanje)} ${esc(i.jedinica)}</strong>${imaUnos && razlika !== 0 ? ` • razlika: <strong style="color:#b91c1c;">${razlika > 0 ? '+' : ''}${fmt(razlika)}</strong>` : ''}${imaUnos && razlika === 0 ? ' • ✓ slaže se' : ''}</div>
                            </div>
                            <input type="number" inputmode="decimal" step="any" min="0" placeholder="stvarno"
                                value="${imaUnos ? uneto : ''}"
                                style="width:90px; flex:none; text-align:right;"
                                oninput="app.popisUnos('${i.id}', this.value)">
                        </div>
                    </div>`;
                }).join('')}</div>`;
            }

            popisUnos(id, val) {
                if (val === '') delete this.popisV[id];
                else this.popisV[id] = val;
                // osvezi samo dugme-brojac bez re-rendera da ne izgubi fokus
            }

            pregledPopisa() {
                const razlike = [];
                let vrednostRazlike = 0;
                Object.entries(this.popisV).forEach(([id, val]) => {
                    const m = this.db.materijal(id);
                    if (!m) return;
                    const stvarno = num(val);
                    const knjizno = this.db.stanje(id);
                    const razlika = stvarno - knjizno;
                    if (razlika !== 0) {
                        razlike.push({ m, knjizno, stvarno, razlika });
                        vrednostRazlike += razlika * m.nabavna;
                    }
                });

                if (!Object.keys(this.popisV).length) return this.toast('Nisi uneo nijedno stvarno stanje', 'error');

                if (!razlike.length) {
                    return this.modal(`
                        <div class="modal-title">Popis ✓ <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                        <div class="empty-state"><div class="big">🎉</div>Sve uneto se slaže sa knjižnim stanjem.<br>Magacin je čist!</div>
                        <button class="btn" onclick="app.popisV={}; app.closeModal(); app.render();">Završi popis</button>
                    `);
                }

                this.modal(`
                    <div class="modal-title">Razlike po popisu <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="table-wrap"><table>
                        <thead><tr><th>Materijal</th><th class="num">Knjižno</th><th class="num">Stvarno</th><th class="num">Razlika</th></tr></thead>
                        <tbody>${razlike.map(r => `<tr>
                            <td>${esc(r.m.naziv)}</td>
                            <td class="num">${fmt(r.knjizno)}</td>
                            <td class="num">${fmt(r.stvarno)}</td>
                            <td class="num" style="color:${r.razlika < 0 ? '#b91c1c' : '#15803d'}; font-weight:700;">${r.razlika > 0 ? '+' : ''}${fmt(r.razlika)}</td>
                        </tr>`).join('')}</tbody>
                    </table></div>
                    <p style="margin-top:12px; font-size:13px; color:${vrednostRazlike < 0 ? '#b91c1c' : '#15803d'}; font-weight:600;">
                        ${vrednostRazlike < 0 ? '📉 Rastur/manjak' : '📈 Višak'}: ${fmt(Math.abs(vrednostRazlike))} RSD (po nabavnoj)
                    </p>
                    <p style="font-size:12px; color:#94a3b8; margin: 8px 0 14px;">Knjiženjem se stanje svodi na stvarno — u istoriji ostaje zapis „popis".</p>
                    <div class="btn-row">
                        <button class="btn btn-ghost" onclick="app.closeModal()">Nazad</button>
                        <button class="btn" onclick="app.proknjiziPopis()">✓ Proknjiži korekcije</button>
                    </div>
                `);
            }

            proknjiziPopis() {
                const datum = new Date().toISOString();
                let br = 0;
