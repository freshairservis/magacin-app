<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3b82f6">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <title>Magacin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #e2e8f0;
            color: #1a1a2a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        #root {
            height: 100vh;
            height: 100dvh;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            box-shadow: 0 0 40px rgba(0,0,0,0.12);
        }

        /* ---------- HEADER ---------- */
        .header {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .hamburger {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #3b82f6;
            padding: 4px;
        }

        .header-title { font-size: 17px; font-weight: 700; color: #3b82f6; }
        .header-sub { font-size: 11px; color: #64748b; }

        /* ---------- TAB BAR ---------- */
        .tabbar {
            flex-shrink: 0;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
            z-index: 150;
        }
        .tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 2px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 20px;
            color: #94a3b8;
            border-radius: 10px;
            position: relative;
        }
        .tab-label { font-size: 10px; font-weight: 600; color: #94a3b8; }
        .tab.active .tab-label { color: #3b82f6; }
        .tab.active { color: #3b82f6; }
        .tab-fab {
            width: 52px;
            height: 52px;
            margin: -22px auto 0;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #ffffff;
            font-size: 26px;
            border: 4px solid #f8fafc;
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tab-fab:active { transform: scale(0.94); }
        .tab-dot {
            position: absolute;
            top: 2px;
            right: 50%;
            margin-right: -18px;
            background: #ef4444;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            min-width: 15px;
            height: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 3px;
        }

        .drawer-close { background: none; border: none; font-size: 22px; cursor: pointer; color: #64748b; }

        .segmenti {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 1fr;
            gap: 4px;
            background: #e2e8f0;
            border-radius: 12px;
            padding: 4px;
        }
        .segment {
            text-align: center;
            padding: 8px 4px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            white-space: nowrap;
        }
        .segment.active {
            background: #ffffff;
            color: #3b82f6;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        /* ---------- CONTENT ---------- */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-bottom: 32px;
            -webkit-overflow-scrolling: touch;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .card-title {
            font-size: 13px;
            font-weight: 700;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ---------- STATS ---------- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .stat-box {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .stat-box.green { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); border-color: #bbf7d0; }
        .stat-box.green .stat-value { color: #15803d; }
        .stat-box.green .stat-label { color: #15803d; }
        .stat-value { font-size: 20px; font-weight: 800; color: #1e40af; line-height: 1.1; }
        .stat-label { font-size: 10px; color: #1e40af; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.3px; opacity: 0.7; }

        .warning-banner {
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 13px;
            color: #991b1b;
            font-size: 13px;
            line-height: 1.5;
            cursor: pointer;
        }

        /* ---------- LISTS ---------- */
        .list-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
        }
        .list-item:last-child { margin-bottom: 0; }
        .list-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .item-title { font-size: 14px; font-weight: 600; color: #1e293b; margin-bottom: 2px; }
        .item-meta { font-size: 12px; color: #64748b; }
        .item-value { font-size: 13px; color: #15803d; font-weight: 600; }
        .item-value.red { color: #b91c1c; }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 24px 12px;
            font-size: 13px;
        }
        .empty-state .big { font-size: 32px; margin-bottom: 8px; }

        /* ---------- TABLE ---------- */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th {
            padding: 9px 8px;
            text-align: left;
            font-weight: 600;
            color: #64748b;
            border-bottom: 1px solid #e2e8f0;
            font-size: 10px;
            text-transform: uppercase;
            background: #f8fafc;
            white-space: nowrap;
        }
        th.num, td.num { text-align: right; }
        td { padding: 9px 8px; border-bottom: 1px solid #f1f5f9; }
        tr:last-child td { border-bottom: none; }
        tfoot td { font-weight: 700; border-top: 2px solid #e2e8f0; background: #f8fafc; }

        /* ---------- BUTTONS ---------- */
        .btn {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            width: 100%;
        }
        .btn:active { transform: scale(0.98); }
        .btn-small { width: auto; padding: 6px 10px; font-size: 12px; border-radius: 8px; }
        .btn-danger { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .btn-ghost {
            background: #f1f5f9;
            color: #475569;
        }
        .btn-success { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
        .btn-row { display: flex; gap: 8px; }
        .btn-row .btn { flex: 1; }
        .icon-btn {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 6px 9px;
            cursor: pointer;
            font-size: 13px;
        }
        .icon-btn.danger { background: #fef2f2; border-color: #fecaca; }

        /* ---------- FORMS ---------- */
        .form-group { margin-bottom: 11px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 5px; }
        input, select, textarea {
            width: 100%;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #1a1a2a;
            padding: 11px;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.15s, box-shadow 0.15s;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .search-input {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
        }

        .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .chip {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 6px 13px;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            white-space: nowrap;
        }
        .chip.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #ffffff;
        }

        .progress-track {
            background: #e2e8f0;
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            background: linear-gradient(90deg, #3b82f6, #22c55e);
            height: 100%;
            border-radius: 6px;
            transition: width 0.3s;
        }

        .pin-bar {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: #ffffff;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .pin-bar button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            border-radius: 6px;
            padding: 3px 9px;
            cursor: pointer;
            font-size: 12px;
        }

        .update-bar {
            position: absolute;
            top: 62px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #f1f5f9;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 550;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .update-bar button {
            background: #3b82f6;
            border: none;
            color: #fff;
            border-radius: 8px;
            padding: 6px 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ---------- BADGES ---------- */
        .badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-success { background: #dcfce7; color: #15803d; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-warn { background: #fef3c7; color: #92400e; }
        .badge-blue { background: #dbeafe; color: #1e40af; }

        /* ---------- TOAST ---------- */
        #toastWrap {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 600;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: calc(100% - 40px);
            max-width: 360px;
            pointer-events: none;
        }
        .toast {
            background: #1e293b;
            color: #f1f5f9;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            animation: toastIn 0.25s ease;
            text-align: center;
        }
        .toast.success { background: #14532d; color: #bbf7d0; }
        .toast.error { background: #7f1d1d; color: #fecaca; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------- MODAL ---------- */
        .modal-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(15,23,42,0.5);
            z-index: 500;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #ffffff;
            border-radius: 20px 20px 0 0;
            padding: 20px 16px;
            width: 100%;
            max-height: 85%;
            overflow-y: auto;
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { transform: translateY(40px); opacity: 0.5; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root">
        <div class="header">
            <div class="header-left">
                <div>
                    <div class="header-title" id="headerTitle">📦 Magacin</div>
                    <div class="header-sub" id="headerSub"></div>
                </div>
            </div>
            <div style="display:flex; gap:2px;">
                <button class="hamburger" onclick="app.globalnaPretraga()">🔍</button>
                <button class="hamburger" onclick="app.idiNa('podesavanja')">⚙️</button>
            </div>
        </div>

        <div id="pinBar"></div>

        <div class="content" id="content"></div>

        <div class="tabbar" id="tabbar"></div>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal" id="modalBox"></div>
        </div>
        <div id="toastWrap"></div>
    </div>

    <script>
        /* ================= UTILS ================= */
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const fmt = n => (Math.round(n * 100) / 100).toLocaleString('sr-RS');
        const fmtDate = d => new Date(d).toLocaleDateString('sr-RS', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const fmtDateTime = d => fmtDate(d) + ' ' + new Date(d).toLocaleTimeString('sr-RS', { hour: '2-digit', minute: '2-digit' });
        const num = v => {
            const n = parseFloat(String(v).replace(',', '.'));
            return isNaN(n) ? 0 : n;
        };
        const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        /* ================= DATA ================= */
        class DataManager {
            constructor() {
                this.migrate();
            }

            migrate() {
                // normalizuj stare zapise (količina -> kolicina, dodaj minZaliha, status posla)
                const mats = this.get('materijali').map(m => ({
                    kategorija: '', ...m,
                    nabavna: num(m.nabavna), prodajna: num(m.prodajna), minZaliha: m.minZaliha != null ? num(m.minZaliha) : 3
                }));
                const trans = this.get('transakcije').map(t => ({
                    ...t,
                    kolicina: t.kolicina != null ? num(t.kolicina) : num(t['količina'])
                })).map(t => { delete t['količina']; return t; });
                const poslovi = this.get('poslovi').map(p => ({ status: 'aktivan', ...p }));
                this.set('materijali', mats);
                this.set('transakcije', trans);
                this.set('poslovi', poslovi);
            }

            get(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } }
            set(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

            getMaterijali(iArhivirane) {
                return this.get('materijali')
                    .filter(m => iArhivirane || !m.arhiviran)
                    .sort((a, b) => a.naziv.localeCompare(b.naziv, 'sr'));
            }

            lokacije() {
                return [...new Set(this.get('materijali').map(m => (m.lokacija || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'sr'));
            }
            getTransakcije() { return this.get('transakcije').sort((a, b) => new Date(b.datum) - new Date(a.datum)); }
            getPoslovi() { return this.get('poslovi').sort((a, b) => (a.status === 'aktivan' ? 0 : 1) - (b.status === 'aktivan' ? 0 : 1)); }

            materijal(id) { return this.get('materijali').find(m => m.id === id); }
            posao(id) { return this.get('poslovi').find(p => p.id === id); }

            addMaterijal(data) {
                const m = this.get('materijali');
                m.push({ id: uid(), ...data });
                this.set('materijali', m);
            }
            updateMaterijal(id, data) {
                this.set('materijali', this.get('materijali').map(m => m.id === id ? { ...m, ...data } : m));
            }
            deleteMaterijal(id) {
                this.set('materijali', this.get('materijali').filter(m => m.id !== id));
                this.set('transakcije', this.get('transakcije').filter(t => t.materijal_id !== id));
            }

            addTransakcija(data) {
                const t = this.get('transakcije');
                const mat = this.materijal(data.materijal_id);
                t.push({
                    id: uid(),
                    datum: new Date().toISOString(),
                    // zamrzni cene u trenutku transakcije
                    nabavna: mat ? mat.nabavna : 0,
                    prodajna: mat ? mat.prodajna : 0,
                    ...data
                });
                this.set('transakcije', t);
            }
            deleteTransakcija(id) {
                this.set('transakcije', this.get('transakcije').filter(t => t.id !== id));
            }
            updateTransakcija(id, data) {
                this.set('transakcije', this.get('transakcije').map(t => t.id === id ? { ...t, ...data } : t));
            }
            transakcija(id) { return this.get('transakcije').find(t => t.id === id); }

            // rucne stavke na soping listi
            getSoping() { return this.get('soping'); }
            addSoping(data) {
                const s = this.get('soping');
                s.push({ id: uid(), ...data });
                this.set('soping', s);
            }
            deleteSoping(id) { this.set('soping', this.get('soping').filter(x => x.id !== id)); }

            // kompleti (sabloni materijala)
            getKompleti() { return this.get('kompleti').sort((a, b) => a.naziv.localeCompare(b.naziv, 'sr')); }
            komplet(id) { return this.get('kompleti').find(k => k.id === id); }
            addKomplet(data) {
                const k = this.get('kompleti');
                k.push({ id: uid(), ...data });
                this.set('kompleti', k);
            }
            updateKomplet(id, data) {
                this.set('kompleti', this.get('kompleti').map(k => k.id === id ? { ...k, ...data } : k));
            }
            deleteKomplet(id) { this.set('kompleti', this.get('kompleti').filter(k => k.id !== id)); }

            kategorije() {
                return [...new Set(this.get('materijali').map(m => (m.kategorija || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'sr'));
            }

            dobavljaci() {
                return [...new Set(this.get('transakcije').map(t => (t.dobavljac || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'sr'));
            }

            // koliko je materijala neto utroseno na poslu (izlazi minus povracaji)
            utrosenoNaPoslu(posaoId, mid) {
                return this.get('transakcije').reduce((s, t) =>
                    t.posao_id === posaoId && t.materijal_id === mid ? s + (t.tip === 'izlaz' ? t.kolicina : -t.kolicina) : s, 0);
            }

            // rezervisano planovima aktivnih poslova (plan minus vec utroseno)
            rezervisano(mid, izuzmiPosao) {
                let r = 0;
                this.get('poslovi').forEach(p => {
                    if (p.status !== 'aktivan' || !p.plan || p.id === izuzmiPosao) return;
                    p.plan.forEach(pl => {
                        if (pl.materijal_id !== mid) return;
                        r += Math.max(0, pl.kolicina - this.utrosenoNaPoslu(p.id, mid));
                    });
                });
                return r;
            }

            // poslednje nabavke materijala (ulazi sa cenom)
            nabavkeMaterijala(mid, n = 10) {
                return this.getTransakcije()
                    .filter(t => t.materijal_id === mid && t.tip === 'ulaz' && !(t.napomena || '').startsWith('popis'))
                    .slice(0, n);
            }

            // materijali ispod ciljne marze
            ispodMarze() {
                return this.get('materijali').filter(m => {
                    if (m.arhiviran) return false;
                    if (!m.marza || !(m.nabavna > 0)) return false;
                    const marzaSad = (m.prodajna - m.nabavna) / m.nabavna * 100;
                    return marzaSad < m.marza - 0.5;
                });
            }

            nedavniMaterijali(n = 5) {
                const ids = [];
                for (const t of this.getTransakcije()) {
                    if (!ids.includes(t.materijal_id)) ids.push(t.materijal_id);
                    if (ids.length >= n) break;
                }
                return ids.map(id => this.materijal(id)).filter(Boolean);
            }

            addPosao(data) {
                const p = this.get('poslovi');
                const novi = { id: uid(), status: 'aktivan', datum: new Date().toISOString(), ...data };
                p.push(novi);
                this.set('poslovi', p);
                return novi;
            }
            updatePosao(id, data) {
                this.set('poslovi', this.get('poslovi').map(p => p.id === id ? { ...p, ...data } : p));
            }
            deletePosao(id) {
                this.set('poslovi', this.get('poslovi').filter(p => p.id !== id));
                this.set('transakcije', this.get('transakcije').map(t => t.posao_id === id ? { ...t, posao_id: null } : t));
            }

            stanje(materijal_id) {
                return this.get('transakcije').reduce((s, t) =>
                    t.materijal_id === materijal_id ? s + (t.tip === 'ulaz' ? t.kolicina : -t.kolicina) : s, 0);
            }

            getInventura(iArhivirane) {
                return this.getMaterijali(iArhivirane).map(m => {
                    const stanje = this.stanje(m.id);
                    return { ...m, stanje, vredNabavna: stanje * m.nabavna, vredProdajna: stanje * m.prodajna };
                });
            }

            getNiskaZaliha() {
                return this.getInventura().filter(i => i.stanje <= i.minZaliha);
            }

            // finansije po poslu: izlazi zaduzuju, ulazi sa posao_id su povracaj (razduzuju)
            posaoFinansije(posao_id) {
                const vezane = this.get('transakcije').filter(t => t.posao_id === posao_id);
                let trosak = 0, naplativo = 0;
                const stavke = {};
                vezane.forEach(t => {
                    const mat = this.materijal(t.materijal_id);
                    const nab = t.nabavna != null ? t.nabavna : (mat ? mat.nabavna : 0);
                    const prod = t.prodajna != null ? t.prodajna : (mat ? mat.prodajna : 0);
                    const znak = t.tip === 'izlaz' ? 1 : -1;
                    trosak += znak * t.kolicina * nab;
                    naplativo += znak * t.kolicina * prod;
                    const key = t.materijal_id;
                    if (!stavke[key]) stavke[key] = { materijal_id: key, naziv: mat ? mat.naziv : '(obrisan materijal)', jedinica: mat ? mat.jedinica : '', kolicina: 0, trosak: 0, naplativo: 0 };
                    stavke[key].kolicina += znak * t.kolicina;
                    stavke[key].trosak += znak * t.kolicina * nab;
                    stavke[key].naplativo += znak * t.kolicina * prod;
                });
                const p = this.posao(posao_id);
                const cenaRada = p && p.cenaRada ? num(p.cenaRada) : 0;
                return {
                    trosak, naplativo, cenaRada,
                    ukupnoNaplativo: naplativo + cenaRada,
                    profit: naplativo + cenaRada - trosak,
                    stavke: Object.values(stavke).filter(s => Math.abs(s.kolicina) > 1e-9)
                };
            }

            exportAll() {
                return JSON.stringify({
                    app: 'magacin',
                    verzija: 3,
                    izvezeno: new Date().toISOString(),
                    materijali: this.get('materijali'),
                    transakcije: this.get('transakcije'),
                    poslovi: this.get('poslovi'),
                    kompleti: this.get('kompleti'),
                    soping: this.get('soping')
                }, null, 2);
            }

            importAll(json) {
                const data = JSON.parse(json);
                if (!Array.isArray(data.materijali) || !Array.isArray(data.transakcije) || !Array.isArray(data.poslovi)) {
                    throw new Error('Neispravan format fajla');
                }
                this.set('materijali', data.materijali);
                this.set('transakcije', data.transakcije);
                this.set('poslovi', data.poslovi);
                this.set('kompleti', Array.isArray(data.kompleti) ? data.kompleti : []);
                this.set('soping', Array.isArray(data.soping) ? data.soping : []);
                this.migrate();
            }

            resetAll() {
                ['materijali', 'transakcije', 'poslovi', 'kompleti', 'soping', 'magacin_pin', 'magacin_lastBackup'].forEach(k => localStorage.removeItem(k));
                this.migrate();
            }
        }

        /* ================= APP ================= */
        const PAGES = {
            pocetna:    { naslov: '🏠 Početna',      sub: 'Pregled dana' },
            magacin:    { naslov: '📦 Magacin',      sub: 'Stanje, šoping, popis, artikli' },
            pregled:    { naslov: '📈 Pregled',      sub: 'Dnevnik i izveštaji' },
            ulazi:      { naslov: '📥 Ulaz',         sub: 'Nabavka materijala' },
            izlazi:     { naslov: '📤 Izlaz',        sub: 'Potrošnja na poslu' },
            poslovi:    { naslov: '💼 Poslovi',      sub: 'Projekti i troškovi' },
            kompleti:   { naslov: '🧰 Kompleti',     sub: 'Šabloni materijala' },
            podesavanja:{ naslov: '⚙️ Podešavanja',  sub: 'Podaci i backup' }
        };

        // stare rute -> nova mesta (da svi postojeci linkovi rade)
        const RUTE = {
            stanje:     { stranica: 'magacin', tab: 'stanje' },
            soping:     { stranica: 'magacin', tab: 'soping' },
            popis:      { stranica: 'magacin', tab: 'popis' },
            materijali: { stranica: 'magacin', tab: 'artikli' },
            istorija:   { stranica: 'pregled', tab: 'dnevnik' },
            izvestaji:  { stranica: 'pregled', tab: 'izvestaji' }
        };

        class MagacinApp {
            constructor() {
                this.db = new DataManager();
                this.stranica = 'pocetna';
                this.filter = '';
                this.korpa = { ulaz: [], izlaz: [] };
                this.popisV = {};
                this.render();
            }

            /* ---------- UI helpers ---------- */
            toast(msg, type = '') {
                const wrap = document.getElementById('toastWrap');
                const el = document.createElement('div');
                el.className = 'toast ' + type;
                el.textContent = msg;
                wrap.appendChild(el);
                setTimeout(() => el.remove(), 2600);
            }

            modal(html) {
                document.getElementById('modalBox').innerHTML = html;
                document.getElementById('modalOverlay').classList.add('active');
            }
            closeModal() {
                this.brzi = false;
                this.otpisMode = false;
                document.getElementById('modalOverlay').classList.remove('active');
            }

            confirm(poruka, akcija) {
                this._confirmAkcija = akcija;
                this.modal(`
                    <div class="modal-title">Potvrda</div>
                    <p style="font-size:14px; color:#475569; margin-bottom:18px;">${poruka}</p>
                    <div class="btn-row">
                        <button class="btn btn-ghost" onclick="app.closeModal()">Otkaži</button>
                        <button class="btn btn-danger" onclick="app._confirmAkcija(); app.closeModal();">Potvrdi</button>
                    </div>
                `);
            }

            idiNa(stranica) {
                const ruta = RUTE[stranica];
                if (ruta) {
                    this.stranica = ruta.stranica;
                    if (ruta.stranica === 'magacin') this.magacinTab = ruta.tab;
                    else this.pregledTab = ruta.tab;
                } else {
                    this.stranica = stranica;
                }
                this.filter = '';
                this.istF = null;
                this.katF = '';
                this.lokF = '';
                this.arhivaView = false;
                this.closeModal();
                this.render();
            }

            /* ---------- RENDER ---------- */
            /* ---------- PIN POSLA ---------- */
            getPin() {
                const id = localStorage.getItem('magacin_pin');
                if (!id) return null;
                const p = this.db.posao(id);
                if (!p || p.status !== 'aktivan') { localStorage.removeItem('magacin_pin'); return null; }
                return p;
            }
            pinuj(id) {
                const trenutni = localStorage.getItem('magacin_pin');
                if (trenutni === id) { localStorage.removeItem('magacin_pin'); this.toast('Posao otkačen', 'success'); }
                else { localStorage.setItem('magacin_pin', id); this.toast('📌 Izlazi sada idu na ovaj posao', 'success'); }
                this.render();
            }

            /* ---------- BRZI TASTERI KOLIČINE ---------- */
            qtyDugmad(inputId) {
                return `<div class="chip-row" style="margin-top:8px;">
                    ${[1, 5, 10].map(n => `<span class="chip" onclick="app.qtyAdd('${inputId}', ${n})">+${n}</span>`).join('')}
                    <span class="chip" onclick="app.qtySet('${inputId}', '')">obriši</span>
                </div>`;
            }
            qtyAdd(id, n) {
                const el = document.getElementById(id);
                el.value = num(el.value) + n;
                el.focus();
            }
            qtySet(id, v) {
                const el = document.getElementById(id);
                el.value = v;
                el.focus();
            }

            render() {
                const p = PAGES[this.stranica];
                document.getElementById('headerTitle').textContent = p.naslov;
                document.getElementById('headerSub').textContent = p.sub;
                const pin = this.getPin();
                document.getElementById('pinBar').innerHTML = pin
                    ? `<div class="pin-bar"><span onclick="app.detaljPosla('${pin.id}')" style="cursor:pointer;">📌 Radiš na: ${esc(pin.naziv)}</span><button onclick="app.pinuj('${pin.id}')">✕ skini</button></div>`
                    : '';
                this.renderTabbar();

                const content = document.getElementById('content');
                content.innerHTML = this['render_' + this.stranica]();
                content.scrollTop = 0;
            }

            renderTabbar() {
                const niska = this.db.getNiskaZaliha().length;
                const aktivan = { pocetna: 'pocetna', magacin: 'magacin', poslovi: 'poslovi', pregled: 'pregled', ulazi: 'unos', izlazi: 'unos', kompleti: 'unos' }[this.stranica] || '';
                const tab = (id, ikona, tekst, badge) => `
                    <button class="tab ${aktivan === id ? 'active' : ''}" onclick="app.idiNa('${id}')">
                        ${ikona}<span class="tab-label">${tekst}</span>${badge ? `<span class="tab-dot">${badge}</span>` : ''}
                    </button>`;
                document.getElementById('tabbar').innerHTML = `
                    ${tab('pocetna', '🏠', 'Početna')}
                    ${tab('magacin', '📦', 'Magacin', niska || '')}
                    <div><button class="tab-fab" onclick="app.unosSheet()">➕</button></div>
                    ${tab('poslovi', '💼', 'Poslovi')}
                    ${tab('pregled', '📈', 'Pregled')}
                `;
            }

            unosSheet() {
                const pin = this.getPin();
                this.modal(`
                    <div class="modal-title">Šta beležimo? <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <button class="btn btn-success" style="padding:16px; font-size:15px; margin-bottom:10px;" onclick="app.brziUnos('izlaz')">📤 Izlaz — ugradio / potrošio${pin ? `<br><span style="font-size:11px; font-weight:400; opacity:0.85;">ide na 📌 ${esc(pin.naziv)}</span>` : ''}</button>
                    <button class="btn" style="padding:16px; font-size:15px; margin-bottom:10px;" onclick="app.brziUnos('ulaz')">📥 Ulaz — nabavio sam materijal</button>
                    <button class="btn btn-ghost" style="padding:14px; margin-bottom:10px;" onclick="app.brziKompleti()">🧰 Komplet — šablon u izlaz</button>
                    <button class="btn btn-ghost" style="padding:14px;" onclick="app.brziOtpis()">🗑 Otpis — rastur / lom / đubre</button>
                `);
            }

            brziOtpis() {
                this.otpisMode = true;
                this.brzi = true;
                this.otvoriPicker('izlaz');
            }

            /* ---------- GRUPNE STRANICE ---------- */
            render_magacin() {
                if (!this.magacinTab) this.magacinTab = 'stanje';
                const seg = (id, tekst) => `<div class="segment ${this.magacinTab === id ? 'active' : ''}" onclick="app.magacinTab='${id}'; app.filter=''; app.katF=''; app.render()">${tekst}</div>`;
                const sadrzaj = {
                    stanje: () => this.render_stanje(),
                    soping: () => this.render_soping(),
                    popis: () => this.render_popis(),
                    artikli: () => this.render_materijali()
                }[this.magacinTab]();
                const niska = this.db.getNiskaZaliha().length;
                return `
                    <div class="segmenti">
                        ${seg('stanje', '📊 Stanje')}
                        ${seg('artikli', '🔧 Artikli')}
                        ${seg('soping', `🛒 Šoping${niska ? ' (' + niska + ')' : ''}`)}
                        ${seg('popis', '📋 Popis')}
                    </div>
                    ${sadrzaj}
                `;
            }

            render_pregled() {
                if (!this.pregledTab) this.pregledTab = 'dnevnik';
                const seg = (id, tekst) => `<div class="segment ${this.pregledTab === id ? 'active' : ''}" onclick="app.pregledTab='${id}'; app.filter=''; app.istF=null; app.render()">${tekst}</div>`;
                return `
                    <div class="segmenti">
                        ${seg('dnevnik', '🕘 Dnevnik')}
                        ${seg('izvestaji', '📈 Izveštaji')}
                    </div>
                    ${this.pregledTab === 'dnevnik' ? this.render_istorija() : this.render_izvestaji()}
                `;
            }

            /* ---------- GLOBALNA PRETRAGA ---------- */
            globalnaPretraga() {
                this.gpF = '';
                this.modal(`
                    <div class="modal-title">🔍 Pretraži sve <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <input class="search-input" id="gpInput" placeholder="Kucaj: posao, materijal, napomena..." autocomplete="off"
                        oninput="app.gpF=this.value; app.osveziListu('gpRez', app.gpRezultati())">
                    <div id="gpRez" style="margin-top:10px; max-height:55vh; overflow-y:auto;">${this.gpRezultati()}</div>
                `);
                setTimeout(() => { const el = document.getElementById('gpInput'); if (el) el.focus(); }, 100);
            }

            gpIdiMaterijal(naziv) {
                this.closeModal();
                this.idiNa('materijali');
                this.filter = naziv;
                this.render();
            }

            gpRezultati() {
                const f = (this.gpF || '').trim().toLowerCase();
                if (f.length < 2) return '<div class="empty-state">Kucaj bar 2 slova...</div>';
                const sekcije = [];

                const poslovi = this.db.get('poslovi').filter(p =>
                    p.naziv.toLowerCase().includes(f) || (p.lokacija || '').toLowerCase().includes(f) || (p.napomena || '').toLowerCase().includes(f)).slice(0, 5);
                if (poslovi.length) sekcije.push(`<div class="item-meta" style="margin:6px 0;">💼 POSLOVI</div>` + poslovi.map(p =>
                    `<div class="list-item" style="cursor:pointer;" onclick="app.closeModal(); app.detaljPosla('${p.id}')">
                        <div class="item-title">${esc(p.naziv)} <span class="badge ${p.status === 'aktivan' ? 'badge-blue' : 'badge-success'}">${p.status === 'aktivan' ? 'aktivan' : 'završen'}</span></div>
                        <div class="item-meta">${esc(p.lokacija || '')}</div>
                    </div>`).join(''));

                const mats = this.db.getInventura().filter(m =>
                    m.naziv.toLowerCase().includes(f) || (m.sku || '').toLowerCase().includes(f) || (m.kategorija || '').toLowerCase().includes(f)).slice(0, 5);
                if (mats.length) sekcije.push(`<div class="item-meta" style="margin:6px 0;">🔧 MATERIJALI</div>` + mats.map(m =>
                    `<div class="list-item" style="cursor:pointer;" data-n="${esc(m.naziv)}" onclick="app.gpIdiMaterijal(this.dataset.n)">
                        <div class="item-title">${esc(m.naziv)}</div>
                        <div class="item-meta">Na stanju: ${fmt(m.stanje)} ${esc(m.jedinica)} • prod. ${fmt(m.prodajna)} RSD</div>
                    </div>`).join(''));

                const kompleti = this.db.getKompleti().filter(k => k.naziv.toLowerCase().includes(f)).slice(0, 3);
                if (kompleti.length) sekcije.push(`<div class="item-meta" style="margin:6px 0;">🧰 KOMPLETI</div>` + kompleti.map(k =>
                    `<div class="list-item" style="cursor:pointer;" onclick="app.closeModal(); app.idiNa('kompleti')">
                        <div class="item-title">${esc(k.naziv)}</div>
                    </div>`).join(''));

                const trans = this.db.getTransakcije().filter(t => {
                    if ((t.napomena || '').toLowerCase().includes(f)) return true;
                    const m = this.db.materijal(t.materijal_id);
                    const p = t.posao_id ? this.db.posao(t.posao_id) : null;
                    return (m && m.naziv.toLowerCase().includes(f)) || (p && p.naziv.toLowerCase().includes(f));
                }).slice(0, 8);
                if (trans.length) sekcije.push(`<div class="item-meta" style="margin:6px 0;">🕘 TRANSAKCIJE</div>` + trans.map(t => {
                    const m = this.db.materijal(t.materijal_id);
                    const p = t.posao_id ? this.db.posao(t.posao_id) : null;
                    return `<div class="list-item">
                        <div class="item-title">${t.tip === 'ulaz' ? '📥' : '📤'} ${esc(m ? m.naziv : '(obrisan)')} — ${fmt(t.kolicina)} ${esc(m ? m.jedinica : '')}</div>
                        <div class="item-meta">${fmtDateTime(t.datum)}${p ? ' • 💼 ' + esc(p.naziv) : ''}${t.napomena ? ' • 📋 ' + esc(t.napomena) : ''}</div>
                    </div>`;
                }).join(''));

                return sekcije.length ? sekcije.join('') : `<div class="empty-state">Ništa nije nađeno za „${esc(this.gpF)}".</div>`;
            }

            /* ---------- POČETNA ---------- */
            render_pocetna() {
                const aktivni = this.db.getPoslovi().filter(p => p.status === 'aktivan');
                const pinHint = !this.getPin() && aktivni.length
                    ? `<div class="card" style="padding:12px 16px;"><div class="item-meta" style="cursor:pointer;" onclick="app.idiNa('poslovi')">📌 Pinuj posao na kom radiš — izlazi će sami ići na njega. <span style="color:#3b82f6; font-weight:600;">Otvori Poslove →</span></div></div>`
                    : '';
                return `
                    ${this.pinWidget()}
                    ${pinHint}
                    ${this.danasKartica()}
                    ${this.savetnik()}
                `;
            }

            danasKartica() {
                const danas = new Date().toISOString().slice(0, 10);
                const ts = this.db.getTransakcije().filter(t => t.datum.slice(0, 10) === danas);
                if (!ts.length) {
                    return `<div class="card">
                        <div class="card-title">📅 Danas — ${fmtDate(new Date())}</div>
                        <div class="empty-state"><div class="big">📭</div>Još ništa nije zabeleženo danas.<br>Kad nešto ugradiš ili nabaviš — ➕ dole.</div>
                    </div>`;
                }
                let ugradjeno = 0, nabavljeno = 0;
                const posloviDana = new Set();
                ts.forEach(t => {
                    const m = this.db.materijal(t.materijal_id);
                    const nab = t.nabavna != null ? t.nabavna : (m ? m.nabavna : 0);
                    const prod = t.prodajna != null ? t.prodajna : (m ? m.prodajna : 0);
                    if (t.tip === 'ulaz') nabavljeno += t.kolicina * nab;
                    else ugradjeno += t.kolicina * prod;
                    if (t.posao_id) { const p = this.db.posao(t.posao_id); if (p) posloviDana.add(p.naziv); }
                });
                return `<div class="card">
                    <div class="card-title">📅 Danas — ${fmtDate(new Date())}
                        <span style="text-transform:none; font-weight:600; color:#64748b;">${ugradjeno ? '📤 ' + fmt(ugradjeno) : ''}${ugradjeno && nabavljeno ? ' • ' : ''}${nabavljeno ? '📥 ' + fmt(nabavljeno) : ''} RSD</span>
                    </div>
                    ${posloviDana.size ? `<div class="item-meta" style="margin-bottom:8px;">💼 ${[...posloviDana].map(esc).join(' • ')}</div>` : ''}
                    ${ts.slice(0, 8).map(t => this.transRed(t)).join('')}
                    ${ts.length > 8 ? `<div class="item-meta" style="text-align:center; margin-top:4px;">… i još ${ts.length - 8}</div>` : ''}
                    <button class="btn btn-ghost btn-small" style="margin-top:10px;" onclick="app.idiNa('istorija')">🕘 Ceo dnevnik →</button>
                </div>`;
            }

            /* ---------- WIDGET PINOVANOG POSLA ---------- */
            pinWidget() {
                const pin = this.getPin();
                if (!pin) return '';
                const fin = this.db.posaoFinansije(pin.id);
                const zaPoneti = (pin.zaPoneti || []).filter(z => !z.done);
                return `<div class="card" style="border-color:#93c5fd; background:linear-gradient(135deg,#ffffff 0%,#eff6ff 100%);">
                    <div class="card-title">🏗 Tekući posao: ${esc(pin.naziv)}</div>
                    ${fin.stavke.length ? `
                        ${fin.stavke.slice(0, 3).map(s => `<div class="item-meta">• ${esc(s.naziv)} — ${fmt(s.kolicina)} ${esc(s.jedinica)}</div>`).join('')}
                        ${fin.stavke.length > 3 ? `<div class="item-meta">… i još ${fin.stavke.length - 3}</div>` : ''}
                        <div class="item-value" style="margin-top:6px;">Ugrađeno: ${fmt(fin.naplativo)} RSD${fin.cenaRada ? ' + rad ' + fmt(fin.cenaRada) : ''} • profit ${fmt(fin.profit)}</div>
                    ` : '<div class="item-meta">Još nema utrošenog materijala na ovom poslu.</div>'}
                    ${zaPoneti.length ? `<div class="item-meta" style="margin-top:6px; color:#92400e;">🎒 Za poneti: ${zaPoneti.map(z => esc(z.tekst)).join(', ')}</div>` : ''}
                    ${this.progresBar(this.progresPosla(pin.id))}
                    <div class="btn-row" style="margin-top:10px;">
                        <button class="btn btn-success btn-small" onclick="app.idiNa('izlazi')">📤 Dodaj izlaz</button>
                        ${this.tovarStavke(pin.id).length ? `<button class="btn btn-ghost btn-small" onclick="app.tovarenje('${pin.id}')">🚚 Tovarenje</button>` : ''}
                        <button class="btn btn-ghost btn-small" onclick="app.detaljPosla('${pin.id}')">📋 Detalji</button>
                    </div>
                </div>`;
            }

            /* ---------- SAVETNIK ---------- */
            potrosnjaMesecno(mid) {
                const od = Date.now() - 60 * 86400000;
                let kol = 0, prvi = Date.now();
                this.db.get('transakcije').forEach(t => {
                    if (t.materijal_id !== mid || t.tip !== 'izlaz') return;
                    const d = new Date(t.datum).getTime();
                    if (d >= od) { kol += t.kolicina; if (d < prvi) prvi = d; }
                });
                if (!kol) return 0;
                const dana = Math.max(7, (Date.now() - prvi) / 86400000);
                return kol * 30 / dana;
            }

            savetnik() {
                const saveti = [];
                const inv = this.db.getInventura();

                // 0. niska zaliha (najhitnije)
                const niska = this.db.getNiskaZaliha();
                if (niska.length) saveti.push({
                    t: `⚠️ <strong>${niska.length} ${niska.length === 1 ? 'materijal je' : 'materijala je'} ispod minimuma</strong> — pogledaj šoping listu.`,
                    go: 'soping'
                });

                // 00. pre polaska: pinovan posao sa planom kome nesto fali
                const pin = this.getPin();
                if (pin) {
                    const fali = this.tovarStavke(pin.id).filter(s => s.fali > 0);
                    if (fali.length) {
                        const cena = fali.reduce((s, x) => { const m = this.db.materijal(x.mid); return s + x.fali * (m ? m.nabavna : 0); }, 0);
                        saveti.push({
                            t: `🌅 <strong>Pre polaska na ${esc(pin.naziv)}:</strong> fali ti ${fali.map(x => `${esc(x.tekst)} (${fmt(x.fali)})`).join(', ')} — ~${fmt(cena)} RSD. <span style="text-decoration:underline;" onclick="event.stopPropagation(); app.tovarenje('${pin.id}')">Otvori tovarenje</span>.`,
                            go: null
                        });
                    }
                }

                // 0a. cuvar marze
                const losaMarza = this.db.ispodMarze();
                if (losaMarza.length) saveti.push({
                    t: `🛡 <strong>${losaMarza.length} ${losaMarza.length === 1 ? 'artikal je' : 'artikala je'} ispod ciljne marže</strong> — gubiš na svakoj ugradnji. <span style="text-decoration:underline;" onclick="event.stopPropagation(); app.srediMarze()">Sredi cene</span>.`,
                    go: null
                });

                // 0b. backup
                const brTrans = this.db.get('transakcije').length;
                if (brTrans >= 5) {
                    const zadnji = localStorage.getItem('magacin_lastBackup');
                    const dana = zadnji ? Math.floor((Date.now() - new Date(zadnji)) / 86400000) : null;
                    if (!zadnji || dana >= 7) saveti.push({
                        t: `💾 ${zadnji ? `Backup je star <strong>${dana} dana</strong>` : '<strong>Nikad nisi izvezao backup</strong>'} — podaci žive samo u ovom browseru.`,
                        go: 'podesavanja'
                    });
                }

                // 1. predikcija: za koliko dana nestaje
                const predikcije = inv
                    .filter(i => i.stanje > 0)
                    .map(i => {
                        const mes = this.potrosnjaMesecno(i.id);
                        return { i, dana: mes > 0 ? Math.round(i.stanje / (mes / 30)) : Infinity };
                    })
                    .filter(x => x.dana <= 14)
                    .sort((a, b) => a.dana - b.dana)
                    .slice(0, 3);
                predikcije.forEach(x => saveti.push({
                    t: `⏳ <strong>${esc(x.i.naziv)}</strong> — po tvojoj potrošnji, na stanju za još <strong>~${x.dana} ${x.dana === 1 ? 'dan' : 'dana'}</strong>.`,
                    go: 'soping'
                }));

                // 2. zaboravljeni aktivni poslovi
                const sada = Date.now();
                this.db.get('poslovi').filter(p => p.status === 'aktivan').forEach(p => {
                    const vezane = this.db.get('transakcije').filter(t => t.posao_id === p.id);
                    const zadnja = vezane.length ? Math.max(...vezane.map(t => new Date(t.datum).getTime())) : new Date(p.datum || 0).getTime();
                    const dana = Math.floor((sada - zadnja) / 86400000);
                    if (dana >= 30) saveti.push({ t: `💼 Posao <strong>${esc(p.naziv)}</strong> nema aktivnosti ${dana} dana — završiti ili nastaviti?`, go: 'poslovi' });
                });

                // 3. mrtvi kapital
                const granica = sada - 90 * 86400000;
                const mrtvi = inv.filter(i => {
                    if (i.stanje <= 0 || i.vredNabavna <= 0) return false;
                    const sve = this.db.get('transakcije').filter(t => t.materijal_id === i.id);
                    if (!sve.length || !sve.some(t => new Date(t.datum).getTime() < granica)) return false;
                    return !sve.some(t => t.tip === 'izlaz' && new Date(t.datum).getTime() >= granica);
                });
                if (mrtvi.length >= 2) {
                    const vrednost = mrtvi.reduce((s, i) => s + i.vredNabavna, 0);
                    saveti.push({ t: `🧊 <strong>${mrtvi.length} materijala</strong> ne koristiš 3+ meseca, a drže <strong>${fmt(vrednost)} RSD</strong> — mrtvi kapital.`, go: 'stanje' });
                }

                // 4. predlog minimuma
                const zaMinimum = inv.filter(i => {
                    const mes = this.potrosnjaMesecno(i.id);
                    return mes > 0 && i.minZaliha < mes / 4;
                });
                if (zaMinimum.length >= 3) saveti.push({ t: `🎯 Minimalne zalihe za <strong>${zaMinimum.length} materijala</strong> su premale za tvoju potrošnju — <span style="text-decoration:underline;" onclick="event.stopPropagation(); app.predloziMinimume()">predloži nove</span>.`, go: null });

                // 5. imas za jos N kompleta
                this.db.getKompleti().slice(0, 8).forEach(k => {
                    if (!k.stavke.length) return;
                    let n = Infinity, ok = true;
                    k.stavke.forEach(s => {
                        const m = this.db.materijal(s.materijal_id);
                        if (!m || m.arhiviran || s.kolicina <= 0) { ok = false; return; }
                        n = Math.min(n, Math.floor(this.db.stanje(s.materijal_id) / s.kolicina));
                    });
                    if (ok && isFinite(n) && n > 0 && n <= 20) saveti.push({ t: `🧮 Sa trenutnim stanjem imaš materijala za još <strong>~${n} × ${esc(k.naziv)}</strong>.`, go: 'stanje' });
                });

                if (!saveti.length) return '';
                return `<div class="card" style="border-color:#c7d2fe; background:linear-gradient(135deg,#ffffff 0%,#eef2ff 100%);">
                    <div class="card-title" style="color:#4f46e5;">🤖 Savetnik</div>
                    ${saveti.slice(0, 6).map(s => `<div class="list-item" style="background:#ffffff; ${s.go ? 'cursor:pointer;' : ''}" ${s.go ? `onclick="app.idiNa('${s.go}')"` : ''}><div class="item-meta" style="color:#334155; line-height:1.5;">${s.t}${s.go ? ' <span style="color:#3b82f6;">→</span>' : ''}</div></div>`).join('')}
                </div>`;
            }

            /* ---------- KORPA UNOS (ULAZ / IZLAZ) ---------- */
            render_ulazi() { return this.renderKorpaStrana('ulaz'); }
            render_izlazi() { return this.renderKorpaStrana('izlaz'); }

            renderKorpaStrana(tip) {
                const mats = this.db.getMaterijali();
                const korpa = this.korpa[tip];
                const poslovi = this.db.getPoslovi().filter(p => p.status === 'aktivan');
                const poslednje = this.db.getTransakcije().filter(t => t.tip === tip).slice(0, 10);
                const danas = new Date().toISOString().slice(0, 10);

                if (!mats.length) return `<div class="card"><div class="empty-state"><div class="big">🔧</div>Prvo dodaj materijale u šifarnik.<br><br><button class="btn btn-small" onclick="app.idiNa('materijali')">Idi na Materijale</button></div></div>`;

                const stavke = korpa.map((s, i) => {
                    const m = this.db.materijal(s.materijal_id);
                    return `<div class="list-item">
                        <div class="list-row">
                            <div>
                                <div class="item-title">${esc(m.naziv)}</div>
                                <div class="item-meta">${fmt(s.kolicina)} ${esc(m.jedinica)}${s.cena ? ' • nova cena: ' + fmt(s.cena) + ' RSD' : ''}</div>
                            </div>
                            <button class="icon-btn danger" onclick="app.korpaUkloni('${tip}', ${i})">🗑</button>
                        </div>
                    </div>`;
                }).join('');

                return `
                    <div class="card">
                        <div class="card-title">${tip === 'ulaz' ? '📥 Novi ulaz (nabavka)' : '📤 Novi izlaz (potrošnja)'} ${korpa.length ? `<span class="badge badge-blue">${korpa.length} ${korpa.length === 1 ? 'stavka' : 'stavke/i'}</span>` : ''}</div>
                        ${stavke || '<div class="empty-state">Korpa je prazna.<br>Dodaj materijale pa sačuvaj sve odjednom.</div>'}
                        <button class="btn btn-ghost" style="margin-top:10px;" onclick="app.brzi=false; app.otvoriPicker('${tip}')">➕ Dodaj materijal</button>
                        ${korpa.length ? `
                        <div class="form-grid2" style="margin-top:12px;">
                            <div class="form-group">
                                <label class="form-label">Datum</label>
                                <input type="date" id="fDatum" value="${danas}" max="${danas}">
                            </div>
                            ${tip === 'izlaz' ? `
                            <div class="form-group">
                                <label class="form-label">Posao ${this.getPin() ? '📌' : ''}</label>
                                <select id="fPosao">
                                    <option value="">— bez posla —</option>
                                    ${poslovi.map(p => `<option value="${p.id}" ${this.getPin() && this.getPin().id === p.id ? 'selected' : ''}>${esc(p.naziv)}</option>`).join('')}
                                    <option value="__otpis">🗑 Otpis (rastur/lom)</option>
                                </select>
                            </div>` : `
                            <div class="form-group">
                                <label class="form-label">Radnja / dobavljač</label>
                                <input id="fDobavljac" placeholder="opciono" list="dobList">
                                <datalist id="dobList">${this.db.dobavljaci().map(d => `<option value="${esc(d)}">`).join('')}</datalist>
                            </div>`}
                        </div>
                        <div class="form-group">
                            <label class="form-label">Napomena (opciono)</label>
                            <input id="fNapomena" placeholder="npr. servis kod Jovića, uzeo Pera...">
                        </div>
                        <button class="btn ${tip === 'izlaz' ? 'btn-success' : ''}" onclick="app.sacuvajKorpu('${tip}')">Sačuvaj ${korpa.length > 1 ? 'sve stavke' : 'stavku'}</button>
                        ` : ''}
                    </div>

                    <div class="card">
                        <div class="card-title">Poslednji ${tip === 'ulaz' ? 'ulazi' : 'izlazi'}</div>
                        ${poslednje.length ? poslednje.map(t => this.transRed(t)).join('') : '<div class="empty-state">Nema transakcija.</div>'}
                    </div>
                `;
            }

            /* --- picker materijala sa pretragom --- */
            otvoriPicker(tip) {
                this.pickerTip = tip;
                this.pickerF = '';
                const korpa = this.korpa[tip];
                const korpaBar = this.brzi && korpa.length ? `
                    <div class="list-item" style="background:#eff6ff; border-color:#93c5fd; margin-bottom:10px;">
                        <div class="list-row">
                            <div class="item-meta" style="color:#1e40af;"><strong>🧺 ${korpa.length}</strong> ${korpa.length === 1 ? 'stavka' : 'stavke/i'} u korpi</div>
                            <div style="display:flex; gap:6px;">
                                <button class="btn ${tip === 'izlaz' ? 'btn-success' : ''} btn-small" onclick="app.sacuvajBrzo('${tip}')">✓ Sačuvaj</button>
                                <button class="btn btn-ghost btn-small" onclick="app.brzi=false; app.closeModal(); app.idiNa('${tip === 'ulaz' ? 'ulazi' : 'izlazi'}')">Detalji</button>
                            </div>
                        </div>
                    </div>` : '';
                this.modal(`
                    <div class="modal-title">${tip === 'ulaz' ? '📥 Ulaz' : (this.otpisMode ? '🗑 Otpis' : '📤 Izlaz')} — izaberi materijal <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    ${korpaBar}
                    <input class="search-input" id="pickerSearch" placeholder="🔍 Kucaj naziv, šifru ili kategoriju..." autocomplete="off"
                        oninput="app.pickerF=this.value; app.osveziListu('pickerLista', app.pickerLista())">
                    <div id="pickerLista" style="margin-top:10px; max-height:50vh; overflow-y:auto;">${this.pickerLista()}</div>
                `);
                setTimeout(() => { const el = document.getElementById('pickerSearch'); if (el) el.focus(); }, 100);
            }

            pickerLista() {
                const tip = this.pickerTip;
                const f = (this.pickerF || '').toLowerCase();
                let inv = this.db.getInventura();
                if (tip === 'izlaz') inv = inv.filter(i => i.stanje > 0);

                const red = m => `<div class="list-item" style="cursor:pointer;" onclick="app.pickerIzbor('${m.id}')">
                    <div class="list-row">
                        <div>
                            <div class="item-title">${esc(m.naziv)}</div>
                            <div class="item-meta">${m.kategorija ? esc(m.kategorija) + ' • ' : ''}na stanju: ${fmt(m.stanje)} ${esc(m.jedinica)}${m.lokacija ? ' • 📍 ' + esc(m.lokacija) : ''}</div>
                        </div>
                        <span style="color:#3b82f6; font-size:18px;">›</span>
                    </div>
                </div>`;

                if (!f) {
                    const nedavniIds = this.db.nedavniMaterijali(5).map(m => m.id);
                    const nedavni = inv.filter(i => nedavniIds.includes(i.id))
                        .sort((a, b) => nedavniIds.indexOf(a.id) - nedavniIds.indexOf(b.id));
                    const ostali = inv.filter(i => !nedavniIds.includes(i.id));
                    return (nedavni.length ? `<div class="item-meta" style="margin-bottom:6px;">🕘 NEDAVNO KORIŠĆENI</div>${nedavni.map(red).join('')}<div class="item-meta" style="margin:10px 0 6px;">SVI MATERIJALI</div>` : '')
                        + (ostali.length ? ostali.map(red).join('') : (nedavni.length ? '' : '<div class="empty-state">Nema materijala' + (tip === 'izlaz' ? ' na stanju' : '') + '.</div>'));
                }
                const nadjeni = inv.filter(m =>
                    m.naziv.toLowerCase().includes(f) || (m.sku || '').toLowerCase().includes(f) || (m.kategorija || '').toLowerCase().includes(f));
                return nadjeni.length ? nadjeni.map(red).join('') : '<div class="empty-state">Ništa nije nađeno za „' + esc(this.pickerF) + '".</div>';
            }

            pickerIzbor(mid) {
                const tip = this.pickerTip;
                const m = this.db.getInventura().find(i => i.id === mid);
                this.modal(`
                    <div class="modal-title">${esc(m.naziv)} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="item-meta" style="margin-bottom:12px;">Na stanju: <strong>${fmt(m.stanje)} ${esc(m.jedinica)}</strong>${tip === 'ulaz' ? ' • trenutna nab. cena: ' + fmt(m.nabavna) + ' RSD' : ''}</div>
                    <div class="form-group">
                        <label class="form-label">Količina (${esc(m.jedinica)})</label>
                        <input type="number" id="kKol" inputmode="decimal" placeholder="0" min="0" step="any" style="font-size:20px; text-align:center; padding:14px;">
                        ${this.qtyDugmad('kKol')}
                    </div>
                    ${tip === 'ulaz' ? `
                    <div class="form-group">
                        <label class="form-label">Nova nab. cena (opciono)</label>
                        <input type="number" id="kCena" inputmode="decimal" placeholder="ostaje ${fmt(m.nabavna)}" min="0" step="any">
                    </div>` : ''}
                    <button class="btn" onclick="app.korpaDodaj('${mid}')">Dodaj u korpu</button>
                `);
                setTimeout(() => { const el = document.getElementById('kKol'); if (el) el.focus(); }, 100);
            }

            korpaDodaj(mid) {
                const tip = this.pickerTip;
                const kol = num(document.getElementById('kKol').value);
                if (kol <= 0) return this.toast('Unesi ispravnu količinu', 'error');
                if (tip === 'izlaz') {
                    const uKorpi = this.korpa.izlaz.filter(s => s.materijal_id === mid).reduce((s, x) => s + x.kolicina, 0);
                    const stanje = this.db.stanje(mid);
                    if (kol + uKorpi > stanje) {
                        const m = this.db.materijal(mid);
                        return this.toast(`Nema dovoljno — na stanju ${fmt(stanje)} ${m.jedinica}${uKorpi ? ', u korpi već ' + fmt(uKorpi) : ''}`, 'error');
                    }
                }
                const stavka = { materijal_id: mid, kolicina: kol };
                if (tip === 'ulaz') {
                    const cena = num(document.getElementById('kCena').value);
                    if (cena > 0) stavka.cena = cena;
                }
                this.korpa[tip].push(stavka);
                if (this.brzi) {
                    this.otvoriPicker(tip);
                } else {
                    this.closeModal();
                    this.render();
                }
            }

            korpaUkloni(tip, i) {
                this.korpa[tip].splice(i, 1);
                this.render();
            }

            sacuvajKorpu(tip) {
                const datumStr = document.getElementById('fDatum').value;
                const danas = new Date().toISOString().slice(0, 10);
                const datum = (!datumStr || datumStr === danas) ? new Date().toISOString() : new Date(datumStr + 'T12:00:00').toISOString();
                const posao = tip === 'izlaz' ? (document.getElementById('fPosao').value || null) : null;
                const napomenaEl = document.getElementById('fNapomena');
                const dobEl = document.getElementById('fDobavljac');
                this.sacuvajKorpuCore(tip, datum, posao, napomenaEl ? napomenaEl.value.trim() : '', dobEl ? dobEl.value.trim() : '');
            }

            sacuvajKorpuCore(tip, datum, posao, napomena, dobavljac) {
                const korpa = this.korpa[tip];
                if (!korpa.length) return;
                if (posao === '__otpis') {
                    posao = null;
                    napomena = napomena ? 'otpis — ' + napomena : 'otpis';
                }
                const preIds = new Set(this.db.get('transakcije').map(t => t.id));
                korpa.forEach(s => {
                    if (tip === 'ulaz' && s.cena) this.db.updateMaterijal(s.materijal_id, { nabavna: s.cena });
                    const t = { materijal_id: s.materijal_id, tip, kolicina: s.kolicina, posao_id: posao, datum };
                    if (napomena) t.napomena = napomena;
                    if (tip === 'ulaz' && dobavljac) t.dobavljac = dobavljac;
                    this.db.addTransakcija(t);
                });
                this.lastAkcija = this.db.get('transakcije').filter(t => !preIds.has(t.id)).map(t => t.id);
                const br = korpa.length;
                this.korpa[tip] = [];
                const p = posao ? this.db.posao(posao) : null;
                this.toastUndo(`${tip === 'ulaz' ? 'Ulaz' : 'Izlaz'} sačuvan — ${br} ${br === 1 ? 'stavka' : 'stavke/i'}${p ? ' na „' + p.naziv + '"' : ''} ✓`);
                this.render();
            }

            /* ---------- BRZI UNOS (iz ➕) ---------- */
            brziUnos(tip) {
                this.brzi = true;
                this.otvoriPicker(tip);
            }

            sacuvajBrzo(tip) {
                if (!this.korpa[tip].length) return;
                if (tip === 'izlaz') {
                    if (this.otpisMode) return this.zavrsiBrzo('izlaz', '__otpis', '');
                    const pin = this.getPin();
                    if (pin) return this.zavrsiBrzo(tip, pin.id, '');
                    const aktivni = this.db.getPoslovi().filter(p => p.status === 'aktivan');
                    this.modal(`
                        <div class="modal-title">Na koji posao? <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                        <div class="form-group">
                            <select id="fBrziPosao">
                                <option value="">— bez posla —</option>
                                ${aktivni.map(p => `<option value="${p.id}">${esc(p.naziv)}</option>`).join('')}
                                <option value="__otpis">🗑 Otpis (rastur/lom)</option>
                            </select>
                        </div>
                        <button class="btn btn-success" onclick="app.zavrsiBrzo('izlaz', document.getElementById('fBrziPosao').value || null, '')">✓ Sačuvaj</button>
                    `);
                    return;
                }
                // ulaz: pitaj gde je kupljeno (opciono, preskocivo)
                this.modal(`
                    <div class="modal-title">Gde si kupio? <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="form-group">
                        <input id="fBrziDob" placeholder="radnja / dobavljač (opciono)" list="dobList2">
                        <datalist id="dobList2">${this.db.dobavljaci().map(d => `<option value="${esc(d)}">`).join('')}</datalist>
                    </div>
                    <button class="btn" onclick="app.zavrsiBrzo('ulaz', null, document.getElementById('fBrziDob').value.trim())">✓ Sačuvaj</button>
                `);
            }

            zavrsiBrzo(tip, posaoId, dobavljac) {
                this.brzi = false;
                this.closeModal();
                this.sacuvajKorpuCore(tip, new Date().toISOString(), posaoId, '', dobavljac || '');
            }

            brziKompleti() {
                const kompleti = this.db.getKompleti();
                if (!kompleti.length) return this.idiNa('kompleti');
                this.brzi = true;
                this.modal(`
                    <div class="modal-title">🧰 Koji komplet? <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    ${kompleti.map(k => `<div class="list-item" style="cursor:pointer;" onclick="app.kompletUKorpu('${k.id}')">
                        <div class="list-row">
                            <div>
                                <div class="item-title">🧰 ${esc(k.naziv)}</div>
                                <div class="item-meta">${k.stavke.map(x => { const m = this.db.materijal(x.materijal_id); return m ? `${esc(m.naziv)} ×${fmt(x.kolicina)}` : ''; }).filter(Boolean).join(' • ')}</div>
                            </div>
                            <span style="color:#3b82f6; font-size:18px;">›</span>
                        </div>
                    </div>`).join('')}
                    <button class="btn btn-ghost btn-small" style="margin-top:8px;" onclick="app.idiNa('kompleti')">✏️ Uredi komplete</button>
                `);
            }

            /* ---------- UNDO / PONOVI ---------- */
            toastUndo(msg) {
                const wrap = document.getElementById('toastWrap');
                const el = document.createElement('div');
                el.className = 'toast success';
                el.style.pointerEvents = 'auto';
                el.innerHTML = `${esc(msg)} &nbsp; <button style="background:rgba(255,255,255,0.15); border:none; color:#fff; border-radius:6px; padding:4px 12px; font-weight:700; cursor:pointer;" onclick="app.ponisti(); this.parentElement.remove();">PONIŠTI</button>`;
                wrap.appendChild(el);
                setTimeout(() => el.remove(), 6000);
            }

            ponisti() {
                if (!this.lastAkcija || !this.lastAkcija.length) return;
                this.lastAkcija.forEach(id => this.db.deleteTransakcija(id));
                this.lastAkcija = null;
                this.toast('Poništeno ✓', 'success');
                this.render();
            }

            ponovi(id) {
                const t = this.db.transakcija(id);
                if (!t || !this.db.materijal(t.materijal_id)) return this.toast('Materijal više ne postoji', 'error');
                if (t.tip === 'izlaz') {
                    const uKorpi = this.korpa.izlaz.filter(x => x.materijal_id === t.materijal_id).reduce((a, x) => a + x.kolicina, 0);
                    if (t.kolicina + uKorpi > this.db.stanje(t.materijal_id)) return this.toast('Nema dovoljno na stanju za ponavljanje', 'error');
                }
                const postojeca = this.korpa[t.tip].find(x => x.materijal_id === t.materijal_id);
                if (postojeca) postojeca.kolicina += t.kolicina;
                else this.korpa[t.tip].push({ materijal_id: t.materijal_id, kolicina: t.kolicina });
                this.toast('Ubačeno u korpu ✓', 'success');
                this.idiNa(t.tip === 'ulaz' ? 'ulazi' : 'izlazi');
            }

            transRed(t) {
                const m = this.db.materijal(t.materijal_id);
                const p = t.posao_id ? this.db.posao(t.posao_id) : null;
                return `<div class="list-item">
                    <div class="list-row">
                        <div>
                            <div class="item-title">${esc(m ? m.naziv : '(obrisan)')}</div>
                            <div class="item-meta">${fmtDateTime(t.datum)}${p ? ' • 💼 ' + esc(p.naziv) : ''}${t.dobavljac ? ' • 🏪 ' + esc(t.dobavljac) : ''}${t.napomena ? ' • 📋 ' + esc(t.napomena) : ''}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <div class="item-value ${t.tip === 'izlaz' ? 'red' : ''}">${t.tip === 'ulaz' ? '+' : '−'}${fmt(t.kolicina)} ${esc(m ? m.jedinica : '')}</div>
                            <button class="icon-btn" onclick="app.ponovi('${t.id}')">🔁</button>
                            <button class="icon-btn" onclick="app.formaTrans('${t.id}')">✏️</button>
                            <button class="icon-btn danger" onclick="app.obrisiTrans('${t.id}')">🗑</button>
                        </div>
                    </div>
                </div>`;
            }

            formaTrans(id) {
                const t = this.db.transakcija(id);
                const m = this.db.materijal(t.materijal_id);
                const poslovi = this.db.getPoslovi();
                this.modal(`
                    <div class="modal-title">${t.tip === 'ulaz' ? '📥' : '📤'} ${esc(m ? m.naziv : '(obrisan)')} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="form-grid2">
                        <div class="form-group">
                            <label class="form-label">Količina (${esc(m ? m.jedinica : '')})</label>
                            <input type="number" id="tKol" inputmode="decimal" step="any" min="0" value="${t.kolicina}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Datum</label>
                            <input type="date" id="tDatum" value="${t.datum.slice(0, 10)}">
                        </div>
                    </div>
                    ${t.tip === 'izlaz' ? `
                    <div class="form-group">
                        <label class="form-label">Posao</label>
                        <select id="tPosao">
                            <option value="">— bez posla —</option>
                            ${poslovi.map(p => `<option value="${p.id}" ${t.posao_id === p.id ? 'selected' : ''}>${esc(p.naziv)}</option>`).join('')}
                        </select>
                    </div>` : ''}
                    <div class="form-group">
                        <label class="form-label">Napomena</label>
                        <input id="tNapomena" value="${esc(t.napomena || '')}" placeholder="opciono">
                    </div>
                    <button class="btn" onclick="app.sacuvajTrans('${id}')">Sačuvaj izmene</button>
                `);
            }

            sacuvajTrans(id) {
                const t = this.db.transakcija(id);
                const kol = num(document.getElementById('tKol').value);
                if (kol <= 0) return this.toast('Unesi ispravnu količinu', 'error');
                const datumStr = document.getElementById('tDatum').value;
                if (t.tip === 'izlaz') {
                    // stanje bez ove transakcije + nova kolicina ne sme u minus
                    const stanjeBez = this.db.stanje(t.materijal_id) + t.kolicina;
                    if (kol > stanjeBez) return this.toast(`Nema dovoljno — bez ove stavke na stanju je ${fmt(stanjeBez)}`, 'error');
                }
                const data = { kolicina: kol };
                if (datumStr && datumStr !== t.datum.slice(0, 10)) data.datum = new Date(datumStr + 'T12:00:00').toISOString();
                const posaoEl = document.getElementById('tPosao');
                if (posaoEl) data.posao_id = posaoEl.value || null;
                data.napomena = document.getElementById('tNapomena').value.trim();
                this.db.updateTransakcija(id, data);
                this.toast('Transakcija izmenjena ✓', 'success');
                this.closeModal();
                this.render();
            }

            obrisiTrans(id) {
                this.confirm('Obrisati ovu transakciju? Stanje će se preračunati.', () => {
                    this.db.deleteTransakcija(id);
                    this.toast('Transakcija obrisana', 'success');
                    this.render();
                });
            }

            /* ---------- ISTORIJA ---------- */
            render_istorija() {
                if (!this.istF) this.istF = { tip: '', mat: '', posao: '', od: '', do: '' };
                const f = this.istF;
                const mats = this.db.getMaterijali();
                const poslovi = this.db.get('poslovi');

                let trans = this.db.getTransakcije();
                if (f.tip) trans = trans.filter(t => t.tip === f.tip);
                if (f.mat) trans = trans.filter(t => t.materijal_id === f.mat);
                if (f.posao) trans = trans.filter(t => t.posao_id === f.posao);
                if (f.od) trans = trans.filter(t => t.datum.slice(0, 10) >= f.od);
                if (f.do) trans = trans.filter(t => t.datum.slice(0, 10) <= f.do);

                let vredUlaz = 0, vredIzlaz = 0;
                trans.forEach(t => {
                    const m = this.db.materijal(t.materijal_id);
                    const nab = t.nabavna != null ? t.nabavna : (m ? m.nabavna : 0);
                    if (t.tip === 'ulaz') vredUlaz += t.kolicina * nab;
                    else vredIzlaz += t.kolicina * nab;
