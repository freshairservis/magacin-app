                Object.entries(this.popisV).forEach(([id, val]) => {
                    const m = this.db.materijal(id);
                    if (!m) return;
                    const razlika = num(val) - this.db.stanje(id);
                    if (razlika === 0) return;
                    this.db.addTransakcija({
                        materijal_id: id,
                        tip: razlika > 0 ? 'ulaz' : 'izlaz',
                        kolicina: Math.abs(razlika),
                        posao_id: null,
                        datum,
                        napomena: 'popis'
                    });
                    br++;
                });
                this.popisV = {};
                this.toast(`Popis proknjižen — ${br} korekcija ✓`, 'success');
                this.closeModal();
                this.render();
            }

            /* ---------- IZVEŠTAJI ---------- */
            render_izvestaji() {
                const trans = this.db.getTransakcije();
                const poslovi = this.db.get('poslovi');

                let ukupanUlazNab = 0, ukupanIzlazNab = 0, ukupanIzlazProd = 0;
                trans.forEach(t => {
                    const m = this.db.materijal(t.materijal_id);
                    const nab = t.nabavna != null ? t.nabavna : (m ? m.nabavna : 0);
                    const prod = t.prodajna != null ? t.prodajna : (m ? m.prodajna : 0);
                    if (t.tip === 'ulaz') ukupanUlazNab += t.kolicina * nab;
                    else { ukupanIzlazNab += t.kolicina * nab; ukupanIzlazProd += t.kolicina * prod; }
                });

                const poPoslu = poslovi.map(p => ({ p, fin: this.db.posaoFinansije(p.id) }))
                    .filter(x => x.fin.stavke.length || x.fin.cenaRada)
                    .sort((a, b) => b.fin.profit - a.fin.profit);
                const ukupnoRad = poPoslu.reduce((s, x) => s + x.fin.cenaRada, 0);

                return `
                    ${this.mojMesec(trans, poPoslu)}

                    <div class="stats-grid">
                        <div class="stat-box"><div class="stat-value">${fmt(ukupanUlazNab)}</div><div class="stat-label">Uloženo u nabavku RSD</div></div>
                        <div class="stat-box"><div class="stat-value">${fmt(ukupanIzlazNab)}</div><div class="stat-label">Utrošeno (nabavna) RSD</div></div>
                        <div class="stat-box green"><div class="stat-value">${fmt(ukupanIzlazProd)}</div><div class="stat-label">Naplativo materijal RSD</div></div>
                        <div class="stat-box green"><div class="stat-value">${fmt(ukupnoRad)}</div><div class="stat-label">Naplativo rad RSD</div></div>
                        <div class="stat-box green" style="grid-column: span 2;"><div class="stat-value">${fmt(ukupanIzlazProd + ukupnoRad - ukupanIzlazNab)}</div><div class="stat-label">Ukupan profit (materijal + rad) RSD</div></div>
                    </div>

                    <div class="card">
                        <div class="card-title">Profit po poslu</div>
                        ${poPoslu.length ? `<div class="table-wrap"><table>
                            <thead><tr><th>Posao</th><th class="num">Trošak</th><th class="num">Naplativo</th><th class="num">Profit</th></tr></thead>
                            <tbody>${poPoslu.map(x => `<tr>
                                <td>${esc(x.p.naziv)}</td>
                                <td class="num">${fmt(x.fin.trosak)}</td>
                                <td class="num">${fmt(x.fin.ukupnoNaplativo)}</td>
                                <td class="num" style="color:${x.fin.profit >= 0 ? '#15803d' : '#b91c1c'}; font-weight:700;">${fmt(x.fin.profit)}</td>
                            </tr>`).join('')}</tbody>
                        </table></div>` : '<div class="empty-state">Nema izlaza vezanih za poslove.<br>Kod izlaza izaberi posao da bi se ovde video profit.</div>'}
                    </div>

                    ${this.otpisKartica(trans)}

                    <div class="card">
                        <div class="card-title">Po mesecima</div>
                        ${this.mesecniPregled(trans)}
                    </div>
                `;
            }

            otpisKartica(trans) {
                const godina = new Date().getFullYear().toString();
                let ukupno = 0, ovaGodina = 0;
                trans.forEach(t => {
                    if (t.tip !== 'izlaz' || !(t.napomena || '').startsWith('otpis')) return;
                    const m = this.db.materijal(t.materijal_id);
                    const nab = t.nabavna != null ? t.nabavna : (m ? m.nabavna : 0);
                    ukupno += t.kolicina * nab;
                    if (t.datum.slice(0, 4) === godina) ovaGodina += t.kolicina * nab;
                });
                if (!ukupno) return '';
                return `<div class="card" style="border-color:#fecaca;">
                    <div class="card-title" style="color:#b91c1c;">🗑 Otpis / rastur</div>
                    <div class="item-meta" style="color:#334155;">Ove godine: <strong style="color:#b91c1c;">${fmt(ovaGodina)} RSD</strong> • ukupno: ${fmt(ukupno)} RSD (po nabavnoj)</div>
                    <p style="font-size:11px; color:#94a3b8; margin-top:6px;">Ovo je materijal koji je otišao u đubre umesto u naplatu. Vredi pogledati gde nastaje.</p>
                </div>`;
            }

            mojMesec(trans, poPoslu) {
                const mesec = new Date().toISOString().slice(0, 7);
                let ugradjeno = 0, trosak = 0, brIzlaza = 0;
                const posloviMeseca = new Set();
                trans.forEach(t => {
                    if (t.datum.slice(0, 7) !== mesec || t.tip !== 'izlaz') return;
                    const m = this.db.materijal(t.materijal_id);
                    const nab = t.nabavna != null ? t.nabavna : (m ? m.nabavna : 0);
                    const prod = t.prodajna != null ? t.prodajna : (m ? m.prodajna : 0);
                    ugradjeno += t.kolicina * prod;
                    trosak += t.kolicina * nab;
                    brIzlaza++;
                    if (t.posao_id) posloviMeseca.add(t.posao_id);
                });
                const top3 = [...poPoslu].sort((a, b) => b.fin.profit - a.fin.profit).slice(0, 3);
                return `<div class="card" style="border-color:#bbf7d0; background:linear-gradient(135deg,#ffffff 0%,#f0fdf4 100%);">
                    <div class="card-title" style="color:#15803d;">💰 Moj mesec u brojkama</div>
                    <div class="stats-grid">
                        <div class="stat-box green"><div class="stat-value">${fmt(ugradjeno)}</div><div class="stat-label">Ugrađeno (prodajna) RSD</div></div>
                        <div class="stat-box green"><div class="stat-value">${fmt(ugradjeno - trosak)}</div><div class="stat-label">Profit materijala RSD</div></div>
                    </div>
                    <div class="item-meta" style="margin-top:8px;">📤 ${brIzlaza} izlaza • 💼 ${posloviMeseca.size} ${posloviMeseca.size === 1 ? 'posao' : 'posla/ova'} sa aktivnošću${posloviMeseca.size ? ` • prosek ${fmt(ugradjeno / posloviMeseca.size)} RSD po poslu` : ''}</div>
                    ${top3.length ? `<div class="item-meta" style="margin-top:6px;">🏆 Najprofitabilniji: ${top3.map(x => `${esc(x.p.naziv)} (${fmt(x.fin.profit)})`).join(' • ')}</div>` : ''}
                </div>`;
            }

            mesecniPregled(trans) {
                const meseci = {};
                trans.forEach(t => {
                    const m = this.db.materijal(t.materijal_id);
                    const nab = t.nabavna != null ? t.nabavna : (m ? m.nabavna : 0);
                    const prod = t.prodajna != null ? t.prodajna : (m ? m.prodajna : 0);
                    const kljuc = t.datum.slice(0, 7);
                    if (!meseci[kljuc]) meseci[kljuc] = { nabavka: 0, utroseno: 0, naplativo: 0 };
                    if (t.tip === 'ulaz') meseci[kljuc].nabavka += t.kolicina * nab;
                    else { meseci[kljuc].utroseno += t.kolicina * nab; meseci[kljuc].naplativo += t.kolicina * prod; }
                });
                const kljucevi = Object.keys(meseci).sort().reverse().slice(0, 12);
                if (!kljucevi.length) return '<div class="empty-state">Nema podataka.</div>';
                const imena = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'avg', 'sep', 'okt', 'nov', 'dec'];
                return `<div class="table-wrap"><table>
                    <thead><tr><th>Mesec</th><th class="num">Nabavka</th><th class="num">Utrošeno</th><th class="num">Naplativo</th><th class="num">Profit mat.</th></tr></thead>
                    <tbody>${kljucevi.map(k => {
                        const [g, m] = k.split('-');
                        const x = meseci[k];
                        return `<tr>
                            <td>${imena[parseInt(m, 10) - 1]} ${g.slice(2)}.</td>
                            <td class="num">${fmt(x.nabavka)}</td>
                            <td class="num">${fmt(x.utroseno)}</td>
                            <td class="num">${fmt(x.naplativo)}</td>
                            <td class="num" style="color:${x.naplativo - x.utroseno >= 0 ? '#15803d' : '#b91c1c'}; font-weight:700;">${fmt(x.naplativo - x.utroseno)}</td>
                        </tr>`;
                    }).join('')}</tbody>
                </table></div>`;
            }

            /* ---------- PODEŠAVANJA ---------- */
            render_podesavanja() {
                const brM = this.db.get('materijali').length;
                const brT = this.db.get('transakcije').length;
                const brP = this.db.get('poslovi').length;
                return `
                    <div class="card">
                        <div class="card-title">Backup podataka</div>
                        <p style="font-size:13px; color:#64748b; margin-bottom:12px;">Podaci žive samo u ovom browseru (${brM} materijala, ${brT} transakcija, ${brP} poslova). Redovno izvezi backup fajl!</p>
                        <div class="btn-row">
                            <button class="btn" onclick="app.izvoz()">⬇️ Izvezi (JSON)</button>
                            <button class="btn btn-ghost" onclick="document.getElementById('uvozFajl').click()">⬆️ Uvezi</button>
                        </div>
                        ${navigator.share ? `<button class="btn btn-ghost" style="margin-top:8px;" onclick="app.podeliBackup()">📤 Podeli backup (WhatsApp/Viber/Drive)</button>` : ''}
                        <input type="file" id="uvozFajl" accept=".json,application/json" style="display:none" onchange="app.uvoz(this)">
                    </div>

                    <div class="card">
                        <div class="card-title">Izvoz za Excel / knjigovođu</div>
                        <div class="btn-row">
                            <button class="btn btn-ghost" onclick="app.izvozCsvIstorija()">📄 CSV istorija</button>
                            <button class="btn btn-ghost" onclick="app.izvozCsvStanje()">📄 CSV stanje</button>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">Instalacija</div>
                        <p style="font-size:13px; color:#64748b;">Na telefonu: otvori meni browsera → <strong>"Dodaj na početni ekran"</strong> / <strong>"Add to Home Screen"</strong> — aplikacija radi i bez interneta.</p>
                    </div>

                    <div class="card">
                        <div class="card-title" style="color:#b91c1c;">Opasna zona</div>
                        <button class="btn btn-danger" onclick="app.resetuj()">🗑 Obriši sve podatke</button>
                    </div>
                `;
            }

            preuzmiFajl(ime, sadrzaj, mime) {
                const blob = new Blob([sadrzaj], { type: mime });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = ime;
                a.click();
                URL.revokeObjectURL(a.href);
            }

            izvoz() {
                this.preuzmiFajl('magacin-backup-' + new Date().toISOString().slice(0, 10) + '.json', this.db.exportAll(), 'application/json');
                localStorage.setItem('magacin_lastBackup', new Date().toISOString());
                this.toast('Backup preuzet ✓', 'success');
            }

            csvRed(polja) {
                return polja.map(p => {
                    const s = String(p ?? '');
                    return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
                }).join(';');
            }

            izvozCsvIstorija() {
                const redovi = [this.csvRed(['Datum', 'Tip', 'Materijal', 'Kolicina', 'Jedinica', 'Posao', 'Nabavna', 'Prodajna', 'Napomena'])];
                this.db.getTransakcije().forEach(t => {
                    const m = this.db.materijal(t.materijal_id);
                    const p = t.posao_id ? this.db.posao(t.posao_id) : null;
                    redovi.push(this.csvRed([
                        fmtDate(t.datum), t.tip, m ? m.naziv : '(obrisan)',
                        String(t.kolicina).replace('.', ','), m ? m.jedinica : '',
                        p ? p.naziv : '',
                        String(t.nabavna != null ? t.nabavna : (m ? m.nabavna : 0)).replace('.', ','),
                        String(t.prodajna != null ? t.prodajna : (m ? m.prodajna : 0)).replace('.', ','),
                        t.napomena || ''
                    ]));
                });
                this.preuzmiFajl('magacin-istorija-' + new Date().toISOString().slice(0, 10) + '.csv', '﻿' + redovi.join('\r\n'), 'text/csv;charset=utf-8');
                this.toast('CSV istorija preuzeta ✓', 'success');
            }

            izvozCsvStanje() {
                const redovi = [this.csvRed(['Materijal', 'SKU', 'Kategorija', 'Stanje', 'Jedinica', 'Nabavna', 'Prodajna', 'Vrednost nabavna', 'Vrednost prodajna'])];
                this.db.getInventura().forEach(i => {
                    redovi.push(this.csvRed([
                        i.naziv, i.sku || '', i.kategorija || '',
                        String(i.stanje).replace('.', ','), i.jedinica,
                        String(i.nabavna).replace('.', ','), String(i.prodajna).replace('.', ','),
                        String(Math.round(i.vredNabavna * 100) / 100).replace('.', ','),
                        String(Math.round(i.vredProdajna * 100) / 100).replace('.', ',')
                    ]));
                });
                this.preuzmiFajl('magacin-stanje-' + new Date().toISOString().slice(0, 10) + '.csv', '﻿' + redovi.join('\r\n'), 'text/csv;charset=utf-8');
                this.toast('CSV stanje preuzeto ✓', 'success');
            }

            uvoz(input) {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        this.db.importAll(reader.result);
                        this.toast('Podaci uvezeni ✓', 'success');
                        this.render();
                    } catch (e) {
                        this.toast('Greška: ' + e.message, 'error');
                    }
                };
                reader.readAsText(file);
                input.value = '';
            }

            resetuj() {
                this.confirm('<strong>Obrisati SVE podatke?</strong><br>Ovo se ne može poništiti. Prvo izvezi backup!', () => {
                    this.db.resetAll();
                    this.toast('Svi podaci obrisani', 'success');
                    this.render();
                });
            }
        }

        const app = new MagacinApp();

        // PWA precice: dugi pritisak na ikonu -> ?akcija=izlaz/ulaz/otpis
        (() => {
            const akcija = new URLSearchParams(location.search).get('akcija');
            if (!akcija) return;
            history.replaceState(null, '', location.pathname);
            if (akcija === 'izlaz') app.brziUnos('izlaz');
            else if (akcija === 'ulaz') app.brziUnos('ulaz');
            else if (akcija === 'otpis') app.brziOtpis();
        })();

        // zatvori modal klikom van njega
        document.getElementById('modalOverlay').addEventListener('click', e => {
            if (e.target.id === 'modalOverlay') app.closeModal();
        });

        // PWA service worker + obavestenje o novoj verziji
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                const ponudiOsvezenje = () => {
                    if (document.getElementById('updateBar')) return;
                    document.getElementById('root').insertAdjacentHTML('beforeend',
                        `<div class="update-bar" id="updateBar">✨ Stigla je nova verzija <button onclick="location.reload()">Osveži</button></div>`);
                };
                if (reg.waiting && navigator.serviceWorker.controller) ponudiOsvezenje();
                reg.addEventListener('updatefound', () => {
                    const novi = reg.installing;
                    if (!novi) return;
                    novi.addEventListener('statechange', () => {
                        if (novi.state === 'installed' && navigator.serviceWorker.controller) ponudiOsvezenje();
                    });
                });
            }).catch(() => {});
        }
    </script>
</body>
</html>
