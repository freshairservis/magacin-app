                if (!s || kol > s.kolicina) return this.toast(`Možeš vratiti najviše ${fmt(s ? s.kolicina : 0)}`, 'error');
                this.db.addTransakcija({ materijal_id: mid, tip: 'ulaz', kolicina: kol, posao_id: posaoId, napomena: 'povraćaj sa posla' });
                this.toast('Vraćeno u magacin ✓ — posao razdužen', 'success');
                this.closeModal();
                this.detaljPosla(posaoId);
                this.render();
            }

            /* ---------- STANJE ---------- */
            render_stanje() {
                if (!this.stanjeSort) this.stanjeSort = 'naziv';
                const sortChip = (id, tekst) => `<span class="chip ${this.stanjeSort === id ? 'active' : ''}" onclick="app.stanjeSort='${id}'; app.render()">${tekst}</span>`;
                return `
                    <input class="search-input" placeholder="🔍 Pretraži stanje..." value="${esc(this.filter)}"
                        oninput="app.filter=this.value; app.osveziListu('listaStanje', app.tabelaStanja())">
                    <div class="chip-row">
                        ${sortChip('naziv', 'A–Š')}
                        ${sortChip('nisko', '⚠️ Nisko prvo')}
                        ${sortChip('vrednost', '💰 Po vrednosti')}
                    </div>
                    <div id="listaStanje">${this.tabelaStanja()}</div>
                    ${this.topPotrosnja()}
                `;
            }

            topPotrosnja() {
                const mesec = new Date().toISOString().slice(0, 7);
                const potroseno = {};
                this.db.get('transakcije').forEach(t => {
                    if (t.tip !== 'izlaz' || t.datum.slice(0, 7) !== mesec) return;
                    potroseno[t.materijal_id] = (potroseno[t.materijal_id] || 0) + t.kolicina;
                });
                const top = Object.entries(potroseno)
                    .map(([id, kol]) => ({ m: this.db.materijal(id), kol }))
                    .filter(x => x.m)
                    .sort((a, b) => b.kol * b.m.nabavna - a.kol * a.m.nabavna)
                    .slice(0, 5);
                if (!top.length) return '';
                return `<div class="card">
                    <div class="card-title">🔥 Najtrošenije ovog meseca</div>
                    ${top.map(x => `<div class="list-item"><div class="list-row">
                        <div class="item-meta">${esc(x.m.naziv)}</div>
                        <div class="item-value red">−${fmt(x.kol)} ${esc(x.m.jedinica)} (~${fmt(x.kol * x.m.nabavna)} RSD)</div>
                    </div></div>`).join('')}
                    <p style="font-size:11px; color:#94a3b8; margin-top:8px;">Ovo drži u većoj zalihi — razmisli o povećanju minimuma (✏️ na materijalu).</p>
                </div>`;
            }

            tabelaStanja() {
                const f = this.filter.toLowerCase();
                let inv = this.db.getInventura().filter(i => !f || i.naziv.toLowerCase().includes(f));
                if (this.stanjeSort === 'nisko') inv.sort((a, b) => (a.stanje - a.minZaliha) - (b.stanje - b.minZaliha));
                else if (this.stanjeSort === 'vrednost') inv.sort((a, b) => b.vredNabavna - a.vredNabavna);
                if (!inv.length) return '<div class="card"><div class="empty-state"><div class="big">📊</div>Nema materijala.</div></div>';
                const ukupnoNab = inv.reduce((s, i) => s + Math.max(0, i.vredNabavna), 0);
                const ukupnoProd = inv.reduce((s, i) => s + Math.max(0, i.vredProdajna), 0);
                return `<div class="card"><div class="table-wrap"><table>
                    <thead><tr><th>Materijal</th><th class="num">Stanje</th><th class="num">Vred. nab.</th><th class="num">Vred. prod.</th></tr></thead>
                    <tbody>${inv.map(i => `
                        <tr>
                            <td>${esc(i.naziv)}${i.stanje <= i.minZaliha ? ' <span class="badge badge-danger">nisko</span>' : ''}</td>
                            <td class="num"><strong>${fmt(i.stanje)}</strong> ${esc(i.jedinica)}</td>
                            <td class="num">${fmt(Math.max(0, i.vredNabavna))}</td>
                            <td class="num">${fmt(Math.max(0, i.vredProdajna))}</td>
                        </tr>`).join('')}</tbody>
                    <tfoot><tr><td>UKUPNO (RSD)</td><td></td><td class="num">${fmt(ukupnoNab)}</td><td class="num">${fmt(ukupnoProd)}</td></tr></tfoot>
                </table></div></div>`;
            }

            /* ---------- ŠOPING LISTA ---------- */
            sopingStavke() {
                const rucneRaw = this.db.getSoping();
                const niska = this.db.getNiskaZaliha();
                const rucneMatIds = rucneRaw.map(r => r.materijal_id).filter(Boolean);
                const auto = niska
                    .filter(i => !rucneMatIds.includes(i.id))
                    .map(i => ({
                        auto: true, materijal_id: i.id, naziv: i.naziv, jedinica: i.jedinica,
                        kolicina: Math.max(i.minZaliha * 2 - i.stanje, 1), nabavna: i.nabavna, stanje: i.stanje
                    }));
                const rucne = rucneRaw.map(r => {
                    const m = r.materijal_id ? this.db.materijal(r.materijal_id) : null;
                    return {
                        auto: false, sopingId: r.id, materijal_id: m ? m.id : null,
                        naziv: m ? m.naziv : r.naziv, jedinica: m ? m.jedinica : (r.jedinica || ''),
                        kolicina: r.kolicina || 1, nabavna: m ? m.nabavna : 0, stanje: m ? this.db.stanje(m.id) : null
                    };
                });
                return [...rucne, ...auto];
            }

            render_soping() {
                const stavke = this.sopingStavke();
                const ukupno = stavke.reduce((s, x) => s + x.kolicina * (x.nabavna || 0), 0);

                return `
                    <div class="btn-row">
                        <button class="btn" onclick="app.formaSoping()">➕ Dodaj stavku</button>
                        ${stavke.length ? `<button class="btn btn-ghost" onclick="app.kopirajSoping()">📋 Kopiraj</button>` : ''}
                        ${stavke.length && navigator.share ? `<button class="btn btn-ghost" onclick="app.podeliSoping()">📤 Podeli</button>` : ''}
                    </div>
                    ${stavke.length ? `
                    <div class="card">
                        <div class="card-title">Treba kupiti (${stavke.length}) <span style="text-transform:none; color:#64748b; font-weight:600;">~${fmt(ukupno)} RSD</span></div>
                        ${stavke.map(s => `<div class="list-item">
                            <div class="list-row">
                                <div>
                                    <div class="item-title">${esc(s.naziv)} ${s.auto ? '<span class="badge badge-warn">nisko</span>' : '<span class="badge badge-blue">ručno</span>'}</div>
                                    <div class="item-meta">Kupi: <strong>${fmt(s.kolicina)} ${esc(s.jedinica)}</strong>${s.stanje != null ? ' • imaš ' + fmt(s.stanje) : ''}${s.nabavna ? ' • ~' + fmt(s.kolicina * s.nabavna) + ' RSD' : ''}</div>
                                </div>
                                <div style="display:flex; gap:6px;">
                                    <button class="btn btn-success btn-small" onclick='app.kupiStavku(${JSON.stringify(JSON.stringify({ materijal_id: s.materijal_id, kolicina: s.kolicina, sopingId: s.sopingId || null }))})'>✓ Kupljeno</button>
                                    ${!s.auto ? `<button class="icon-btn danger" onclick="app.obrisiSoping('${s.sopingId}')">🗑</button>` : ''}
                                </div>
                            </div>
                        </div>`).join('')}
                        <p style="font-size:11px; color:#94a3b8; margin-top:10px;">„Nisko" stavke dolaze automatski kad zaliha padne ispod minimuma. „✓ Kupljeno" odmah knjiži ulaz u magacin.</p>
                    </div>
                    ` : '<div class="card"><div class="empty-state"><div class="big">✅</div>Sve zalihe su iznad minimuma i nema ručnih stavki.<br>Ništa ne treba kupovati!</div></div>'}
                `;
            }

            formaSoping() {
                const mats = this.db.getMaterijali();
                this.modal(`
                    <div class="modal-title">Dodaj na šoping listu <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="form-group">
                        <label class="form-label">Materijal iz šifarnika</label>
                        <select id="sMat" onchange="document.getElementById('sNazivWrap').style.display = this.value ? 'none' : 'block'">
                            <option value="">— nije u šifarniku (slobodan unos) —</option>
                            ${mats.map(m => `<option value="${m.id}">${esc(m.naziv)}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group" id="sNazivWrap">
                        <label class="form-label">Naziv (slobodan unos)</label>
                        <input id="sNaziv" placeholder="npr. burgija 8mm, silikon...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Količina</label>
                        <input type="number" id="sKol" inputmode="decimal" step="any" min="0" value="1">
                    </div>
                    <button class="btn" onclick="app.sacuvajSoping()">Dodaj</button>
                `);
            }

            sacuvajSoping() {
                const mid = document.getElementById('sMat').value || null;
                const naziv = document.getElementById('sNaziv').value.trim();
                const kol = num(document.getElementById('sKol').value) || 1;
                if (!mid && !naziv) return this.toast('Izaberi materijal ili upiši naziv', 'error');
                this.db.addSoping({ materijal_id: mid, naziv, kolicina: kol });
                this.toast('Dodato na listu ✓', 'success');
                this.closeModal();
                this.render();
            }

            obrisiSoping(id) {
                this.db.deleteSoping(id);
                this.render();
            }

            kupiStavku(json) {
                const s = JSON.parse(json);
                if (!s.materijal_id) {
                    // slobodna stavka — samo skini sa liste
                    if (s.sopingId) this.db.deleteSoping(s.sopingId);
                    this.toast('Skinuto sa liste ✓', 'success');
                    return this.render();
                }
                const m = this.db.materijal(s.materijal_id);
                this.modal(`
                    <div class="modal-title">✓ Kupljeno: ${esc(m.naziv)} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="form-grid2">
                        <div class="form-group">
                            <label class="form-label">Količina (${esc(m.jedinica)})</label>
                            <input type="number" id="bKol" inputmode="decimal" step="any" min="0" value="${s.kolicina}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Cena po ${esc(m.jedinica)} (RSD)</label>
                            <input type="number" id="bCena" inputmode="decimal" step="any" min="0" value="${m.nabavna}">
                        </div>
                    </div>
                    <button class="btn btn-success" onclick="app.potvrdiKupovinu('${s.materijal_id}', '${s.sopingId || ''}')">Proknjiži ulaz</button>
                `);
            }

            potvrdiKupovinu(mid, sopingId) {
                const kol = num(document.getElementById('bKol').value);
                if (kol <= 0) return this.toast('Unesi ispravnu količinu', 'error');
                const cena = num(document.getElementById('bCena').value);
                const m = this.db.materijal(mid);
                if (cena > 0 && cena !== m.nabavna) this.db.updateMaterijal(mid, { nabavna: cena });
                this.db.addTransakcija({ materijal_id: mid, tip: 'ulaz', kolicina: kol, posao_id: null });
                if (sopingId) this.db.deleteSoping(sopingId);
                this.toast('Ulaz proknjižen ✓', 'success');
                this.closeModal();
                this.render();
            }

            sopingTekst() {
                return '🛒 Šoping lista — ' + fmtDate(new Date()) + '\n'
                    + this.sopingStavke().map(s => `• ${s.naziv} — ${fmt(s.kolicina)} ${s.jedinica}`.trim()).join('\n');
            }

            kopirajSoping() {
                navigator.clipboard.writeText(this.sopingTekst())
                    .then(() => this.toast('Lista kopirana — nalepi u poruku ✓', 'success'))
                    .catch(() => this.toast('Kopiranje nije uspelo', 'error'));
            }

            podeliSoping() {
                navigator.share({ title: 'Šoping lista', text: this.sopingTekst() }).catch(() => {});
            }

            podeliBackup() {
                const fajl = new File([this.db.exportAll()], 'magacin-backup-' + new Date().toISOString().slice(0, 10) + '.json', { type: 'application/json' });
                if (navigator.canShare && navigator.canShare({ files: [fajl] })) {
                    navigator.share({ files: [fajl], title: 'Magacin backup' })
                        .then(() => localStorage.setItem('magacin_lastBackup', new Date().toISOString()))
                        .catch(() => {});
                } else {
                    this.toast('Deljenje fajlova nije podržano — koristi Izvezi', 'error');
                }
            }

            /* ---------- KOMPLETI ---------- */
            render_kompleti() {
                const kompleti = this.db.getKompleti();
                return `
                    <button class="btn" onclick="app.formaKomplet()">➕ Novi komplet</button>
                    ${kompleti.length ? kompleti.map(k => {
                        const cena = k.stavke.reduce((s, x) => {
                            const m = this.db.materijal(x.materijal_id);
                            return s + (m ? x.kolicina * m.prodajna : 0);
                        }, 0);
                        return `<div class="card">
                            <div class="list-row">
                                <div>
                                    <div class="item-title">🧰 ${esc(k.naziv)}</div>
                                    <div class="item-meta">${k.stavke.map(x => {
                                        const m = this.db.materijal(x.materijal_id);
                                        return m ? `${esc(m.naziv)} ×${fmt(x.kolicina)}` : '(obrisan)';
                                    }).join(' • ')}</div>
                                    <div class="item-value">~${fmt(cena)} RSD po kompletu (prodajna)</div>
                                </div>
                            </div>
                            <div class="btn-row" style="margin-top:10px;">
                                <button class="btn btn-success btn-small" onclick="app.kompletUKorpu('${k.id}')">📤 U izlaz</button>
                                <button class="btn btn-ghost btn-small" onclick="app.formaKomplet('${k.id}')">✏️</button>
                                <button class="btn btn-danger btn-small" onclick="app.obrisiKomplet('${k.id}')">🗑</button>
                            </div>
                        </div>`;
                    }).join('') : `<div class="card"><div class="empty-state"><div class="big">🧰</div>Nema kompleta.<br>Komplet = šablon materijala koji stalno ide zajedno<br>(npr. „Montaža utičnice": doza + utičnica + 3m kabla).<br>Kod izlaza ga ubaciš u korpu jednim klikom.</div></div>`}
                `;
            }

            formaKomplet(id) {
                const k = id ? this.db.komplet(id) : null;
                this.kompletDraft = k ? { id: k.id, naziv: k.naziv, stavke: [...k.stavke.map(s => ({ ...s }))] } : { id: null, naziv: '', stavke: [] };
                this.modalKomplet();
            }

            modalKomplet() {
                const d = this.kompletDraft;
                const mats = this.db.getMaterijali();
                this.modal(`
                    <div class="modal-title">${d.id ? 'Izmena kompleta' : 'Novi komplet'} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="form-group"><label class="form-label">Naziv *</label><input id="kNaziv" value="${esc(d.naziv)}" placeholder="npr. Montaža utičnice"></div>
                    ${d.stavke.length ? d.stavke.map((s, i) => {
                        const m = this.db.materijal(s.materijal_id);
                        return `<div class="list-item"><div class="list-row">
                            <div class="item-meta">${esc(m ? m.naziv : '(obrisan)')} — <strong>${fmt(s.kolicina)} ${esc(m ? m.jedinica : '')}</strong></div>
                            <button class="icon-btn danger" onclick="app.kompletDraftUkloni(${i})">🗑</button>
                        </div></div>`;
                    }).join('') : '<div class="empty-state">Još nema stavki.</div>'}
                    <div class="form-grid2" style="margin-top:10px;">
                        <div class="form-group">
                            <label class="form-label">Materijal</label>
                            <select id="kMat">${mats.map(m => `<option value="${m.id}">${esc(m.naziv)}</option>`).join('')}</select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Količina</label>
                            <input type="number" id="kStKol" inputmode="decimal" step="any" min="0" placeholder="0">
                        </div>
                    </div>
                    <button class="btn btn-ghost" onclick="app.kompletDraftDodaj()">➕ Dodaj stavku</button>
                    <button class="btn" style="margin-top:8px;" onclick="app.sacuvajKomplet()">Sačuvaj komplet</button>
                `);
            }

            kompletDraftDodaj() {
                const mid = document.getElementById('kMat').value;
                const kol = num(document.getElementById('kStKol').value);
                this.kompletDraft.naziv = document.getElementById('kNaziv').value;
                if (!mid || kol <= 0) return this.toast('Izaberi materijal i količinu', 'error');
                const postojeca = this.kompletDraft.stavke.find(s => s.materijal_id === mid);
                if (postojeca) postojeca.kolicina += kol;
                else this.kompletDraft.stavke.push({ materijal_id: mid, kolicina: kol });
                this.modalKomplet();
            }

            kompletDraftUkloni(i) {
                this.kompletDraft.naziv = document.getElementById('kNaziv').value;
                this.kompletDraft.stavke.splice(i, 1);
                this.modalKomplet();
            }

            sacuvajKomplet() {
                const d = this.kompletDraft;
                d.naziv = document.getElementById('kNaziv').value.trim();
                if (!d.naziv) return this.toast('Naziv je obavezan', 'error');
                if (!d.stavke.length) return this.toast('Dodaj bar jednu stavku', 'error');
                if (d.id) { this.db.updateKomplet(d.id, { naziv: d.naziv, stavke: d.stavke }); this.toast('Komplet izmenjen ✓', 'success'); }
                else { this.db.addKomplet({ naziv: d.naziv, stavke: d.stavke }); this.toast('Komplet sačuvan ✓', 'success'); }
                this.kompletDraft = null;
                this.closeModal();
                this.render();
            }

            obrisiKomplet(id) {
                const k = this.db.komplet(id);
                this.confirm(`Obrisati komplet <strong>${esc(k.naziv)}</strong>?`, () => {
                    this.db.deleteKomplet(id);
                    this.toast('Komplet obrisan', 'success');
                    this.render();
                });
            }

            kompletUKorpu(id) {
                const k = this.db.komplet(id);
                this.modal(`
                    <div class="modal-title">🧰 ${esc(k.naziv)} <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="form-group">
                        <label class="form-label">Koliko puta? (npr. broj utičnica)</label>
                        <input type="number" id="kPuta" inputmode="numeric" min="1" step="1" value="1" style="font-size:18px; text-align:center;">
                        ${this.qtyDugmad('kPuta')}
                    </div>
                    <button class="btn btn-success" onclick="app.potvrdiKompletUKorpu('${id}')">Ubaci u izlaz</button>
                `);
            }

            potvrdiKompletUKorpu(id) {
                const k = this.db.komplet(id);
                const puta = Math.max(1, Math.round(num(document.getElementById('kPuta').value) || 1));
                // provera stanja za sve stavke (ukljucujuci ono sto je vec u korpi)
                for (const s of k.stavke) {
                    const m = this.db.materijal(s.materijal_id);
                    if (!m) return this.toast('Komplet sadrži obrisan materijal — izmeni komplet', 'error');
                    const potrebno = s.kolicina * puta + this.korpa.izlaz.filter(x => x.materijal_id === s.materijal_id).reduce((a, x) => a + x.kolicina, 0);
                    const stanje = this.db.stanje(s.materijal_id);
                    if (potrebno > stanje) return this.toast(`Nema dovoljno: ${m.naziv} (treba ${fmt(potrebno)}, imaš ${fmt(stanje)})`, 'error');
                }
                k.stavke.forEach(s => {
                    const postojeca = this.korpa.izlaz.find(x => x.materijal_id === s.materijal_id);
                    if (postojeca) postojeca.kolicina += s.kolicina * puta;
                    else this.korpa.izlaz.push({ materijal_id: s.materijal_id, kolicina: s.kolicina * puta });
                });
                this.closeModal();
                this.toast(`Komplet ×${puta} ubačen u korpu ✓`, 'success');
                this.idiNa('izlazi');
            }

            /* ---------- POPIS ---------- */
            render_popis() {
                const inv = this.db.getInventura();
                if (!inv.length) return '<div class="card"><div class="empty-state"><div class="big">📋</div>Nema materijala za popis.</div></div>';

                const unetih = Object.keys(this.popisV).length;
                const f = this.filter.toLowerCase();
                const prikaz = inv.filter(i => !f || i.naziv.toLowerCase().includes(f));

                return `
                    <div class="card">
                        <div class="card-title">Kako se radi popis</div>
                        <p style="font-size:13px; color:#64748b;">Prođi kroz policu i za svaki materijal upiši <strong>koliko stvarno imaš</strong>. Preskoči ono što se slaže. Na kraju pritisni „Pregled razlika" — app će ti pokazati rastur i ponuditi da svede stanje.</p>
                    </div>
                    <input class="search-input" placeholder="🔍 Pretraži..." value="${esc(this.filter)}"
                        oninput="app.filter=this.value; app.osveziListu('popisLista', app.popisLista())">
                    <div id="popisLista">${this.popisLista()}</div>
                    <button class="btn ${unetih ? '' : 'btn-ghost'}" onclick="app.pregledPopisa()">📋 Pregled razlika ${unetih ? `(${unetih})` : ''}</button>
                `;
            }

            popisLista() {
                const f = this.filter.toLowerCase();
                const inv = this.db.getInventura().filter(i => !f || i.naziv.toLowerCase().includes(f));
                return `<div class="card">${inv.map(i => {
                    const uneto = this.popisV[i.id];
                    const imaUnos = uneto !== undefined && uneto !== '';
                    const razlika = imaUnos ? num(uneto) - i.stanje : 0;
                    return `<div class="list-item" style="${imaUnos ? (razlika === 0 ? 'border-color:#bbf7d0; background:#f0fdf4;' : 'border-color:#fecaca; background:#fef2f2;') : ''}">
                        <div class="list-row">
                            <div style="flex:1;">
                                <div class="item-title">${esc(i.naziv)}</div>
                                <div class="item-meta">Knjižno: <strong>${fmt(i.stanje)} ${esc(i.jedinica)}</strong>${imaUnos && razlika !== 0 ? ` • razlika: <strong style="color:#b91c1c;">${razlika > 0 ? '+' : ''}${fmt(razlika)}</strong>` : ''}${imaUnos && razlika === 0 ? ' • ✓ slaže se' : ''}</div>
                            </div>
                            <input type="number" inputmode="decimal" step="any" min="0" placeholder="stvarno"
                                value="${imaUnos ? uneto : ''}"
                                style="width:90px; flex:none; text-align:right;"
                                oninput="app.popisUnos('${i.id}', this.value)">
                        </div>
                    </div>`;
                }).join('')}</div>`;
            }

            popisUnos(id, val) {
                if (val === '') delete this.popisV[id];
                else this.popisV[id] = val;
                // osvezi samo dugme-brojac bez re-rendera da ne izgubi fokus
            }

            pregledPopisa() {
                const razlike = [];
                let vrednostRazlike = 0;
                Object.entries(this.popisV).forEach(([id, val]) => {
                    const m = this.db.materijal(id);
                    if (!m) return;
                    const stvarno = num(val);
                    const knjizno = this.db.stanje(id);
                    const razlika = stvarno - knjizno;
                    if (razlika !== 0) {
                        razlike.push({ m, knjizno, stvarno, razlika });
                        vrednostRazlike += razlika * m.nabavna;
                    }
                });

                if (!Object.keys(this.popisV).length) return this.toast('Nisi uneo nijedno stvarno stanje', 'error');

                if (!razlike.length) {
                    return this.modal(`
                        <div class="modal-title">Popis ✓ <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                        <div class="empty-state"><div class="big">🎉</div>Sve uneto se slaže sa knjižnim stanjem.<br>Magacin je čist!</div>
                        <button class="btn" onclick="app.popisV={}; app.closeModal(); app.render();">Završi popis</button>
                    `);
                }

                this.modal(`
                    <div class="modal-title">Razlike po popisu <button class="drawer-close" onclick="app.closeModal()">✕</button></div>
                    <div class="table-wrap"><table>
                        <thead><tr><th>Materijal</th><th class="num">Knjižno</th><th class="num">Stvarno</th><th class="num">Razlika</th></tr></thead>
                        <tbody>${razlike.map(r => `<tr>
                            <td>${esc(r.m.naziv)}</td>
                            <td class="num">${fmt(r.knjizno)}</td>
                            <td class="num">${fmt(r.stvarno)}</td>
                            <td class="num" style="color:${r.razlika < 0 ? '#b91c1c' : '#15803d'}; font-weight:700;">${r.razlika > 0 ? '+' : ''}${fmt(r.razlika)}</td>
                        </tr>`).join('')}</tbody>
                    </table></div>
                    <p style="margin-top:12px; font-size:13px; color:${vrednostRazlike < 0 ? '#b91c1c' : '#15803d'}; font-weight:600;">
                        ${vrednostRazlike < 0 ? '📉 Rastur/manjak' : '📈 Višak'}: ${fmt(Math.abs(vrednostRazlike))} RSD (po nabavnoj)
                    </p>
                    <p style="font-size:12px; color:#94a3b8; margin: 8px 0 14px;">Knjiženjem se stanje svodi na stvarno — u istoriji ostaje zapis „popis".</p>
                    <div class="btn-row">
                        <button class="btn btn-ghost" onclick="app.closeModal()">Nazad</button>
                        <button class="btn" onclick="app.proknjiziPopis()">✓ Proknjiži korekcije</button>
                    </div>
                `);
            }

            proknjiziPopis() {
                const datum = new Date().toISOString();
                let br = 0;
                Object.entries(this.popisV).forEach(([id, val]) => {
                    const m = this.db.materijal(id);
                    if (!m) return;
                    const razlika = num(val) - this.db.stanje(id);
                    if (razlika === 0) return;
                    this.db.addTransakcija({
                        materijal_id: id,
                        tip: razlika > 0 ? 'ulaz' : 'izlaz',
                        kolicina: Math.abs(razlika),
                        posao_id: null,
                        datum,
                        napomena: 'popis'
                    });
                    br++;
                });
                this.popisV = {};
                this.toast(`Popis proknjižen — ${br} korekcija ✓`, 'success');
                this.closeModal();
                this.render();
            }

            /* ---------- IZVEŠTAJI ---------- */
            render_izvestaji() {
                const trans = this.db.getTransakcije();
                const poslovi = this.db.get('poslovi');

                let ukupanUlazNab = 0, ukupanIzlazNab = 0, ukupanIzlazProd = 0;
                trans.forEach(t => {
                    const m = this.db.materijal(t.materijal_id);
                    const nab = t.nabavna != null ? t.nabavna : (m ? m.nabavna : 0);
                    const prod = t.prodajna != null ? t.prodajna : (m ? m.prodajna : 0);
                    if (t.tip === 'ulaz') ukupanUlazNab += t.kolicina * nab;
                    else { ukupanIzlazNab += t.kolicina * nab; ukupanIzlazProd += t.kolicina * prod; }
                });

                const poPoslu = poslovi.map(p => ({ p, fin: this.db.posaoFinansije(p.id) }))
                    .filter(x => x.fin.stavke.length || x.fin.cenaRada)
                    .sort((a, b) => b.fin.profit - a.fin.profit);
                const ukupnoRad = poPoslu.reduce((s, x) => s + x.fin.cenaRada, 0);

                return `
                    <div class="stats-grid">
                        <div class="stat-box"><div class="stat-value">${fmt(ukupanUlazNab)}</div><div class="stat-label">Uloženo u nabavku RSD</div></div>
                        <div class="stat-box"><div class="stat-value">${fmt(ukupanIzlazNab)}</div><div class="stat-label">Utrošeno (nabavna) RSD</div></div>
                        <div class="stat-box green"><div class="stat-value">${fmt(ukupanIzlazProd)}</div><div class="stat-label">Naplativo materijal RSD</div></div>
                        <div class="stat-box green"><div class="stat-value">${fmt(ukupnoRad)}</div><div class="stat-label">Naplativo rad RSD</div></div>
                        <div class="stat-box green" style="grid-column: span 2;"><div class="stat-value">${fmt(ukupanIzlazProd + ukupnoRad - ukupanIzlazNab)}</div><div class="stat-label">Ukupan profit (materijal + rad) RSD</div></div>
                    </div>

                    <div class="card">
                        <div class="card-title">Profit po poslu</div>
                        ${poPoslu.length ? `<div class="table-wrap"><table>
                            <thead><tr><th>Posao</th><th class="num">Trošak</th><th class="num">Naplativo</th><th class="num">Profit</th></tr></thead>
                            <tbody>${poPoslu.map(x => `<tr>
                                <td>${esc(x.p.naziv)}</td>
                                <td class="num">${fmt(x.fin.trosak)}</td>
                                <td class="num">${fmt(x.fin.ukupnoNaplativo)}</td>
                                <td class="num" style="color:${x.fin.profit >= 0 ? '#15803d' : '#b91c1c'}; font-weight:700;">${fmt(x.fin.profit)}</td>
                            </tr>`).join('')}</tbody>
                        </table></div>` : '<div class="empty-state">Nema izlaza vezanih za poslove.<br>Kod izlaza izaberi posao da bi se ovde video profit.</div>'}
                    </div>

                    <div class="card">
                        <div class="card-title">Po mesecima</div>
                        ${this.mesecniPregled(trans)}
                    </div>
                `;
            }

            mesecniPregled(trans) {
                const meseci = {};
                trans.forEach(t => {
                    const m = this.db.materijal(t.materijal_id);
                    const nab = t.nabavna != null ? t.nabavna : (m ? m.nabavna : 0);
                    const prod = t.prodajna != null ? t.prodajna : (m ? m.prodajna : 0);
                    const kljuc = t.datum.slice(0, 7);
                    if (!meseci[kljuc]) meseci[kljuc] = { nabavka: 0, utroseno: 0, naplativo: 0 };
                    if (t.tip === 'ulaz') meseci[kljuc].nabavka += t.kolicina * nab;
                    else { meseci[kljuc].utroseno += t.kolicina * nab; meseci[kljuc].naplativo += t.kolicina * prod; }
                });
                const kljucevi = Object.keys(meseci).sort().reverse().slice(0, 12);
                if (!kljucevi.length) return '<div class="empty-state">Nema podataka.</div>';
                const imena = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'avg', 'sep', 'okt', 'nov', 'dec'];
                return `<div class="table-wrap"><table>
                    <thead><tr><th>Mesec</th><th class="num">Nabavka</th><th class="num">Utrošeno</th><th class="num">Naplativo</th><th class="num">Profit mat.</th></tr></thead>
                    <tbody>${kljucevi.map(k => {
                        const [g, m] = k.split('-');
                        const x = meseci[k];
                        return `<tr>
                            <td>${imena[parseInt(m, 10) - 1]} ${g.slice(2)}.</td>
                            <td class="num">${fmt(x.nabavka)}</td>
                            <td class="num">${fmt(x.utroseno)}</td>
                            <td class="num">${fmt(x.naplativo)}</td>
                            <td class="num" style="color:${x.naplativo - x.utroseno >= 0 ? '#15803d' : '#b91c1c'}; font-weight:700;">${fmt(x.naplativo - x.utroseno)}</td>
                        </tr>`;
                    }).join('')}</tbody>
                </table></div>`;
            }

            /* ---------- PODEŠAVANJA ---------- */
            render_podesavanja() {
                const brM = this.db.get('materijali').length;
                const brT = this.db.get('transakcije').length;
                const brP = this.db.get('poslovi').length;
                return `
                    <div class="card">
                        <div class="card-title">Backup podataka</div>
                        <p style="font-size:13px; color:#64748b; margin-bottom:12px;">Podaci žive samo u ovom browseru (${brM} materijala, ${brT} transakcija, ${brP} poslova). Redovno izvezi backup fajl!</p>
                        <div class="btn-row">
                            <button class="btn" onclick="app.izvoz()">⬇️ Izvezi (JSON)</button>
                            <button class="btn btn-ghost" onclick="document.getElementById('uvozFajl').click()">⬆️ Uvezi</button>
                        </div>
                        ${navigator.share ? `<button class="btn btn-ghost" style="margin-top:8px;" onclick="app.podeliBackup()">📤 Podeli backup (WhatsApp/Viber/Drive)</button>` : ''}
                        <input type="file" id="uvozFajl" accept=".json,application/json" style="display:none" onchange="app.uvoz(this)">
                    </div>

                    <div class="card">
                        <div class="card-title">Izvoz za Excel / knjigovođu</div>
                        <div class="btn-row">
                            <button class="btn btn-ghost" onclick="app.izvozCsvIstorija()">📄 CSV istorija</button>
                            <button class="btn btn-ghost" onclick="app.izvozCsvStanje()">📄 CSV stanje</button>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">Instalacija</div>
                        <p style="font-size:13px; color:#64748b;">Na telefonu: otvori meni browsera → <strong>"Dodaj na početni ekran"</strong> / <strong>"Add to Home Screen"</strong> — aplikacija radi i bez interneta.</p>
                    </div>

                    <div class="card">
                        <div class="card-title" style="color:#b91c1c;">Opasna zona</div>
                        <button class="btn btn-danger" onclick="app.resetuj()">🗑 Obriši sve podatke</button>
                    </div>
                `;
            }

            preuzmiFajl(ime, sadrzaj, mime) {
                const blob = new Blob([sadrzaj], { type: mime });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = ime;
                a.click();
                URL.revokeObjectURL(a.href);
            }

            izvoz() {
                this.preuzmiFajl('magacin-backup-' + new Date().toISOString().slice(0, 10) + '.json', this.db.exportAll(), 'application/json');
                localStorage.setItem('magacin_lastBackup', new Date().toISOString());
                this.toast('Backup preuzet ✓', 'success');
            }

            csvRed(polja) {
                return polja.map(p => {
                    const s = String(p ?? '');
                    return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
                }).join(';');
            }

            izvozCsvIstorija() {
                const redovi = [this.csvRed(['Datum', 'Tip', 'Materijal', 'Kolicina', 'Jedinica', 'Posao', 'Nabavna', 'Prodajna', 'Napomena'])];
                this.db.getTransakcije().forEach(t => {
                    const m = this.db.materijal(t.materijal_id);
                    const p = t.posao_id ? this.db.posao(t.posao_id) : null;
                    redovi.push(this.csvRed([
                        fmtDate(t.datum), t.tip, m ? m.naziv : '(obrisan)',
                        String(t.kolicina).replace('.', ','), m ? m.jedinica : '',
                        p ? p.naziv : '',
                        String(t.nabavna != null ? t.nabavna : (m ? m.nabavna : 0)).replace('.', ','),
                        String(t.prodajna != null ? t.prodajna : (m ? m.prodajna : 0)).replace('.', ','),
                        t.napomena || ''
                    ]));
                });
                this.preuzmiFajl('magacin-istorija-' + new Date().toISOString().slice(0, 10) + '.csv', '﻿' + redovi.join('\r\n'), 'text/csv;charset=utf-8');
                this.toast('CSV istorija preuzeta ✓', 'success');
            }

            izvozCsvStanje() {
                const redovi = [this.csvRed(['Materijal', 'SKU', 'Kategorija', 'Stanje', 'Jedinica', 'Nabavna', 'Prodajna', 'Vrednost nabavna', 'Vrednost prodajna'])];
                this.db.getInventura().forEach(i => {
                    redovi.push(this.csvRed([
                        i.naziv, i.sku || '', i.kategorija || '',
                        String(i.stanje).replace('.', ','), i.jedinica,
                        String(i.nabavna).replace('.', ','), String(i.prodajna).replace('.', ','),
                        String(Math.round(i.vredNabavna * 100) / 100).replace('.', ','),
                        String(Math.round(i.vredProdajna * 100) / 100).replace('.', ',')
                    ]));
                });
                this.preuzmiFajl('magacin-stanje-' + new Date().toISOString().slice(0, 10) + '.csv', '﻿' + redovi.join('\r\n'), 'text/csv;charset=utf-8');
                this.toast('CSV stanje preuzeto ✓', 'success');
            }

            uvoz(input) {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        this.db.importAll(reader.result);
                        this.toast('Podaci uvezeni ✓', 'success');
                        this.render();
                    } catch (e) {
                        this.toast('Greška: ' + e.message, 'error');
                    }
                };
                reader.readAsText(file);
                input.value = '';
            }

            resetuj() {
                this.confirm('<strong>Obrisati SVE podatke?</strong><br>Ovo se ne može poništiti. Prvo izvezi backup!', () => {
                    this.db.resetAll();
                    this.toast('Svi podaci obrisani', 'success');
                    this.render();
                });
            }
        }

        const app = new MagacinApp();

        // zatvori modal klikom van njega
        document.getElementById('modalOverlay').addEventListener('click', e => {
            if (e.target.id === 'modalOverlay') app.closeModal();
        });

        // PWA service worker + obavestenje o novoj verziji
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                const ponudiOsvezenje = () => {
                    if (document.getElementById('updateBar')) return;
                    document.getElementById('root').insertAdjacentHTML('beforeend',
                        `<div class="update-bar" id="updateBar">✨ Stigla je nova verzija <button onclick="location.reload()">Osveži</button></div>`);
                };
                if (reg.waiting && navigator.serviceWorker.controller) ponudiOsvezenje();
                reg.addEventListener('updatefound', () => {
                    const novi = reg.installing;
                    if (!novi) return;
                    novi.addEventListener('statechange', () => {
                        if (novi.state === 'installed' && navigator.serviceWorker.controller) ponudiOsvezenje();
                    });
                });
            }).catch(() => {});
        }
    </script>
</body>
</html>
